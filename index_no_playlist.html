<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Now Playing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --c1: #FF3D81;
    --c2: #7C3AED;
    --ink: #14101F;
    --paper: #FFF9F0;
    --lime: #C6FF3D;
  }
  *{ box-sizing: border-box; margin: 0; padding: 0; }
  html{ height: 100%; }
  body{
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    color: var(--paper);
    min-height: 100vh;
    display: flex;
    background: var(--ink);
    overflow-x: hidden;
    position: relative;
  }

  /* ---------- moving background ---------- */
  .bg-blobs{
    position: fixed;
    inset: 0;
    overflow: hidden;
    z-index: 0;
    filter: blur(90px);
  }
  .blob{
    position: absolute;
    border-radius: 50%;
    mix-blend-mode: screen;
    transition: background 1.2s ease;
  }
  .blob-a{
    width: 60vmax; height: 60vmax;
    top: -22%; left: -18%;
    background: var(--c1);
    opacity: .8;
    animation: floatA 28s ease-in-out infinite alternate;
  }
  .blob-b{
    width: 54vmax; height: 54vmax;
    bottom: -26%; right: -14%;
    background: var(--c2);
    opacity: .75;
    animation: floatB 34s ease-in-out infinite alternate;
  }
  .blob-c{
    width: 40vmax; height: 40vmax;
    top: 28%; left: 38%;
    background: var(--lime);
    opacity: .35;
    animation: floatC 22s ease-in-out infinite alternate;
  }
  @keyframes floatA{
    0%{ transform: translate(0,0) scale(1); }
    100%{ transform: translate(12vw,14vh) scale(1.18); }
  }
  @keyframes floatB{
    0%{ transform: translate(0,0) scale(1); }
    100%{ transform: translate(-14vw,-10vh) scale(1.12); }
  }
  @keyframes floatC{
    0%{ transform: translate(0,0) scale(1); }
    100%{ transform: translate(9vw,-14vh) scale(0.88); }
  }
  @media (prefers-reduced-motion: reduce){
    .blob{ animation: none !important; }
  }

  .stage{ position: relative; z-index: 1; }

  .stage{
    width: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 48px 40px 60px;
    max-width: 1080px;
    margin: 0 auto;
  }
  .layout{
    display: flex;
    align-items: flex-start;
    gap: 56px;
    width: 100%;
  }
  .main-col{
    flex: 1 1 420px;
    min-width: 0;
    max-width: 460px;
  }
  .side-col{
    width: 280px;
    flex-shrink: 0;
    position: sticky;
    top: 40px;
    max-height: calc(100vh - 80px);
    overflow-y: auto;
    padding-right: 4px;
  }
  .side-col::-webkit-scrollbar{ width: 6px; }
  .side-col::-webkit-scrollbar-thumb{ background: rgba(255,255,255,.25); border-radius: 6px; }
  @media (max-width: 860px){
    .layout{ flex-direction: column; }
    .main-col{ max-width: none; width: 100%; }
    .side-col{
      width: 100%;
      position: static;
      max-height: none;
      overflow-y: visible;
    }
  }

  /* ---------- login / idle ---------- */
  .kicker{
    font-size: 15px;
    font-weight: 500;
    color: var(--paper);
    opacity: .8;
    margin-bottom: 10px;
  }
  .big-headline{
    font-family: 'Bricolage Grotesque', sans-serif;
    font-weight: 800;
    font-size: clamp(40px, 9vw, 68px);
    line-height: 1.02;
    letter-spacing: -0.02em;
    margin-bottom: 22px;
  }
  .sub{
    font-size: 16px;
    line-height: 1.6;
    opacity: .85;
    max-width: 380px;
    margin-bottom: 32px;
  }
  button.cta{
    align-self: flex-start;
    background: var(--paper);
    color: var(--ink);
    border: none;
    padding: 16px 30px;
    border-radius: 999px;
    font-weight: 700;
    font-size: 15px;
    font-family: inherit;
    cursor: pointer;
    transition: transform .15s ease, background .15s ease;
  }
  button.cta:hover{ background: var(--lime); }
  button.cta:active{ transform: scale(.97); }
  button.cta:focus-visible{ outline: 2px solid var(--paper); outline-offset: 3px; }

  /* ---------- now playing ---------- */
  .art-card{
    width: 168px;
    height: 168px;
    border-radius: 26px;
    overflow: hidden;
    transform: rotate(-4deg);
    box-shadow: 0 24px 48px -18px rgba(0,0,0,.55);
    margin-bottom: 28px;
    background: rgba(255,255,255,.08);
    flex-shrink: 0;
  }
  .art-card img{ width: 100%; height: 100%; object-fit: cover; display: block; }

  .track-title{
    font-family: 'Bricolage Grotesque', sans-serif;
    font-weight: 800;
    font-size: clamp(32px, 7vw, 52px);
    line-height: 1.04;
    letter-spacing: -0.02em;
    margin-bottom: 10px;
    word-break: break-word;
  }
  .track-artist{
    font-size: 17px;
    font-weight: 500;
    opacity: .82;
    margin-bottom: 30px;
  }

  .progress{
    width: 100%;
    max-width: 420px;
    margin-bottom: 10px;
  }
  .progress-track{
    position: relative;
    height: 6px;
    background: rgba(255,255,255,.22);
    border-radius: 6px;
  }
  .progress-fill{
    position: absolute;
    top: 0; left: 0; height: 100%;
    background: var(--paper);
    border-radius: 6px;
    width: 0%;
    transition: width 1s linear;
  }
  .time-row{
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    opacity: .7;
    font-variant-numeric: tabular-nums;
    max-width: 420px;
    margin-bottom: 30px;
  }

  .controls{
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 18px;
  }
  .ctrl-btn{
    width: 56px;
    height: 56px;
    border-radius: 50%;
    border: none;
    background: rgba(255,255,255,.14);
    color: var(--paper);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: background .15s ease, transform .12s ease;
    flex-shrink: 0;
  }
  .ctrl-btn:hover{ background: rgba(255,255,255,.26); }
  .ctrl-btn:active{ transform: scale(.92); }
  .ctrl-btn:focus-visible{ outline: 2px solid var(--paper); outline-offset: 3px; }
  .ctrl-btn.main{
    width: 64px; height: 64px;
    background: var(--paper);
    color: var(--ink);
  }
  .ctrl-btn.main:hover{ background: var(--lime); }
  .ctrl-btn svg{ width: 22px; height: 22px; }
  .ctrl-btn.main svg{ width: 24px; height: 24px; }

  .state-label{
    font-size: 13px;
    font-weight: 500;
    opacity: .7;
    display: flex;
    align-items: center;
    gap: 7px;
  }
  .state-label .dot{
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--lime);
  }
  .state-label .dot.paused{ background: var(--paper); opacity: .5; }

  .section-label{
    font-size: 14px;
    font-weight: 600;
    opacity: .8;
    margin: 0 0 16px;
  }
  
  
  
  
  
  

  .toast{
    position: fixed;
    bottom: 28px;
    left: 50%;
    transform: translateX(-50%) translateY(12px);
    background: var(--ink);
    color: var(--paper);
    padding: 12px 20px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 500;
    opacity: 0;
    pointer-events: none;
    transition: opacity .25s ease, transform .25s ease;
    max-width: 90vw;
    text-align: center;
    z-index: 10;
  }
  .toast.show{
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  @media (max-width: 420px){
    .stage{ padding: 36px 22px 50px; }
    .art-card{ width: 132px; height: 132px; }
    
  }

  .topbar{
    position: fixed;
    top: 20px;
    right: 20px;
    display: flex;
    align-items: center;
    gap: 10px;
    z-index: 10;
  }
  .profile-chip{
    display: none;
    align-items: center;
    gap: 11px;
    background: rgba(255,255,255,.14);
    padding: 7px 20px 7px 7px;
    border-radius: 999px;
    text-decoration: none;
    color: var(--paper);
    font-size: 16px;
    font-weight: 600;
    max-width: 260px;
    transition: background .15s ease;
  }
  .profile-chip:hover{ background: rgba(255,255,255,.26); }
  .profile-avatar{
    width: 42px;
    height: 42px;
    border-radius: 50%;
    object-fit: cover;
    background: rgba(255,255,255,.25);
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
  }
  .profile-name{
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .logout-btn{
    background: rgba(255,255,255,.14);
    color: var(--paper);
    border: none;
    padding: 13px 22px;
    border-radius: 999px;
    font-family: inherit;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: background .15s ease;
  }
  .logout-btn:hover{ background: rgba(255,255,255,.26); }

  .lyrics-box{
    margin-top: 30px;
    max-width: 460px;
    height: 280px;
    overflow-y: auto;
    background: rgba(255,255,255,.08);
    border-radius: 20px;
    padding: 34px 22px;
    scroll-behavior: smooth;
    scrollbar-width: thin;
  }
  .lyrics-box::-webkit-scrollbar{ width: 6px; }
  .lyrics-box::-webkit-scrollbar-thumb{ background: rgba(255,255,255,.25); border-radius: 6px; }
  .lyrics-list{
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .lyric-line{
    border: 0;
    background: transparent;
    color: var(--paper);
    width: 100%;
    padding: 2px 0;
    text-align: left;
    font: 600 17px/1.45 'Inter', sans-serif;
    opacity: .34;
    cursor: pointer;
    transition: opacity .25s ease, transform .25s ease, color .25s ease;
    transform-origin: left center;
  }
  .lyric-line.past{ opacity: .52; }
  .lyric-line.active{
    opacity: 1;
    transform: scale(1.035);
  }
  .lyric-line:hover{ opacity: .9; }
  .lyric-line:focus-visible{
    outline: 2px solid var(--paper);
    outline-offset: 4px;
    border-radius: 4px;
  }
  .lyrics-plain{
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    line-height: 1.75;
    white-space: pre-line;
    opacity: .92;
  }
  .lyrics-status{
    font-size: 14px;
    opacity: .6;
  }
</style>
</head>
<body>

<div class="bg-blobs">
  <div class="blob blob-a"></div>
  <div class="blob blob-b"></div>
  <div class="blob blob-c"></div>
</div>

<div class="stage" id="stage">
  <p class="kicker">Loading…</p>
</div>
<div class="toast" id="toast"></div>

<script>
/* ============ CONFIGURE THIS ============ */
const CLIENT_ID = "f8ae9b8233d44779be5fa82f8351bbf9";
/* ========================================= */

const REDIRECT_URI = window.location.origin + window.location.pathname;
const stage = document.getElementById('stage');
const toastEl = document.getElementById('toast');

let accessToken = null;
let pollTimer = null;
let nowPlayingEl = null;
let libraryEl = null;
let currentTrackId = null;
let lyricsCache = {};

/* ---------- icons ---------- */
const ICON = {
  prev: `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h2v14H6zM19.5 5.5L9 12l10.5 6.5v-13z"/></svg>`,
  next: `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 5h2v14h-2zM4.5 5.5L15 12 4.5 18.5v-13z"/></svg>`,
  play: `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 4.5v15l13-7.5z"/></svg>`,
  pause:`<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>`
};

/* ---------- PKCE helpers ---------- */
function randomString(len){
  const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
  let out = '';
  for(let i=0;i<len;i++) out += chars.charAt(Math.floor(Math.random()*chars.length));
  return out;
}
async function sha256(plain){
  return crypto.subtle.digest('SHA-256', new TextEncoder().encode(plain));
}
function base64UrlEncode(buffer){
  return btoa(String.fromCharCode(...new Uint8Array(buffer)))
    .replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}

async function redirectToAuth(){
  const verifier = randomString(64);
  window.name = "sp_verifier:" + verifier;
  const challenge = base64UrlEncode(await sha256(verifier));
  const params = new URLSearchParams({
    client_id: CLIENT_ID,
    response_type: 'code',
    redirect_uri: REDIRECT_URI,
    scope: SCOPES,
    code_challenge_method: 'S256',
    code_challenge: challenge
  });
  window.location.href = `https://accounts.spotify.com/authorize?${params}`;
}

const REFRESH_KEY = 'sp_refresh_token';

async function refreshAccessToken(refreshToken){
  const body = new URLSearchParams({
    grant_type: 'refresh_token',
    refresh_token: refreshToken,
    client_id: CLIENT_ID
  });
  try{
    const res = await fetch('https://accounts.spotify.com/api/token', {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body
    });
    const data = await res.json();
    if(data.access_token){
      accessToken = data.access_token;
      if(data.refresh_token){ localStorage.setItem(REFRESH_KEY, data.refresh_token); }
      return true;
    }
  } catch(e){ /* fall through to false */ }
  return false;
}

function logout(){
  localStorage.removeItem(REFRESH_KEY);
  stopPolling();
  renderLogin();
}

async function exchangeCodeForToken(code){
  const verifier = window.name.startsWith('sp_verifier:') ? window.name.slice(12) : null;
  if(!verifier){ renderLogin("That link expired — log in again."); return; }
  const body = new URLSearchParams({
    client_id: CLIENT_ID,
    grant_type: 'authorization_code',
    code,
    redirect_uri: REDIRECT_URI,
    code_verifier: verifier
  });
  const res = await fetch('https://accounts.spotify.com/api/token', {
    method: 'POST',
    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
    body
  });
  const data = await res.json();
  window.history.replaceState({}, document.title, REDIRECT_URI);
  if(data.access_token){
    accessToken = data.access_token;
    if(data.refresh_token){ localStorage.setItem(REFRESH_KEY, data.refresh_token); }
    startPolling();
  } else {
    renderLogin("Couldn't log in — try again.");
  }
}

/* ---------- rendering: login / idle / track ---------- */
function renderLogin(message){
  stopPolling();
  stage.innerHTML = `
    <p class="kicker">Now playing</p>
    <h1 class="big-headline">See what's<br>spinning.</h1>
    <button class="cta" id="loginBtn">Log in with Spotify</button>
  `;
  document.getElementById('loginBtn').addEventListener('click', redirectToAuth);
}

function renderIdle(){
  if(!nowPlayingEl) return;
  nowPlayingEl.innerHTML = `
    <p class="kicker">Now playing</p>
    <h1 class="big-headline">Quiet for now.</h1>
    <p class="sub">Nothing's playing on Spotify right now. Start something and this page will catch up automatically.</p>
  `;
}

function msToClock(ms){
  const total = Math.floor(ms/1000);
  const m = Math.floor(total/60);
  const s = total % 60;
  return `${m}:${String(s).padStart(2,'0')}`;
}

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function renderTrack(data){
  if(!nowPlayingEl) return;
  const track = data.item;
  const artists = track.artists.map(a => a.name).join(', ');
  const art = track.album.images[0]?.url || '';
  const progress = data.progress_ms || 0;
  currentTrackProgressSec = progress / 1000;
  const duration = track.duration_ms || 1;
  const pct = Math.min(100, (progress/duration) * 100);
  const playing = !!data.is_playing;

  nowPlayingEl.innerHTML = `
    <div class="art-card"><img src="${art}" alt=""></div>
    <h1 class="track-title">${escapeHtml(track.name)}</h1>
    <p class="track-artist">${escapeHtml(artists)}</p>
    <div class="progress">
      <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
    </div>
    <div class="time-row"><span>${msToClock(progress)}</span><span>${msToClock(duration)}</span></div>
    <div class="controls">
      <button class="ctrl-btn" id="prevBtn" aria-label="Previous track">${ICON.prev}</button>
      <button class="ctrl-btn main" id="playBtn" aria-label="${playing ? 'Pause' : 'Play'}">${playing ? ICON.pause : ICON.play}</button>
      <button class="ctrl-btn" id="nextBtn" aria-label="Next track">${ICON.next}</button>
    </div>
    <div class="state-label"><span class="dot ${playing ? '' : 'paused'}"></span>${playing ? 'Playing' : 'Paused'}</div>
    <p class="section-label" style="margin-top:30px;">Lyrics</p>
    <div class="lyrics-box" id="lyricsBox"><p class="lyrics-status">Loading lyrics…</p></div>
  `;

  document.getElementById('prevBtn').addEventListener('click', () => playerAction('POST', '/previous', 'Skipped back'));
  document.getElementById('nextBtn').addEventListener('click', () => playerAction('POST', '/next', 'Skipped ahead'));
  document.getElementById('playBtn').addEventListener('click', () => {
    playerAction('PUT', playing ? '/pause' : '/play', playing ? 'Paused' : 'Playing');
  });

  extractGradient(art);

  if(track.id !== currentTrackId){
    currentTrackId = track.id;
    loadLyricsFor(track, duration);
  } else if(lyricsCache[track.id] !== undefined){
    renderLyricsBox(lyricsCache[track.id]);
  }

  animateLyrics(progress, playing);
}

/* ---------- lyrics (via lrclib.net - free, open, no key required) ---------- */
async function fetchLyricsData(title, artist, album, durationSec){
  try{
    const exact = new URLSearchParams({
      track_name: title,
      artist_name: artist,
      album_name: album,
      duration: durationSec
    });
    let res = await fetch(`https://lrclib.net/api/get?${exact}`);
    if(res.ok){
      const data = await res.json();
      if(data.syncedLyrics || data.plainLyrics) return data;
    }

    const loose = new URLSearchParams({ track_name: title, artist_name: artist });
    res = await fetch(`https://lrclib.net/api/search?${loose}`);
    if(res.ok){
      const results = await res.json();
      if(Array.isArray(results)){
        const hit = results.find(r => r.syncedLyrics || r.plainLyrics);
        if(hit) return hit;
      }
    }
  } catch(e){ /* treat as not found */ }
  return null;
}

function parseSyncedLyrics(lrc){
  if(!lrc) return [];
  return lrc.split(/\\r?\\n/)
    .map(line => {
      const match = line.match(/^\\[(\\d+):(\\d+(?:\\.\\d+)?)\\]\\s*(.*)$/);
      if(!match) return null;
      return {
        time: Number(match[1]) * 60 + Number(match[2]),
        text: match[3].trim()
      };
    })
    .filter(line => line && line.text)
    .sort((a,b) => a.time - b.time);
}

function renderLyricsBox(data){
  const box = document.getElementById('lyricsBox');
  if(!box) return;

  if(!data){
    box.innerHTML = '<p class="lyrics-status">Lyrics not found for this track.</p>';
    return;
  }

  const synced = parseSyncedLyrics(data.syncedLyrics);

  if(synced.length){
    box.innerHTML = `<div class="lyrics-list" id="lyricsList">
      ${synced.map((line, i) =>
        `<button type="button" class="lyric-line" data-time="${line.time}" data-index="${i}">
          ${escapeHtml(line.text)}
        </button>`
      ).join('')}
    </div>`;
    box.querySelectorAll('.lyric-line').forEach(btn => {
      btn.addEventListener('click', () => {
        const seconds = Number(btn.dataset.time);
        playerAction('PUT', `/seek?position_ms=${Math.max(0, Math.round(seconds * 1000))}`, 'Jumped to lyric');
      });
    });
    syncLyrics(currentTrackProgressSec);
    return;
  }

  box.innerHTML = `<pre class="lyrics-plain">${escapeHtml(data.plainLyrics || '')}</pre>`;
}

let currentTrackProgressSec = 0;
let currentLyricsAnimationFrame = null;

function syncLyrics(progressSec){
  currentTrackProgressSec = progressSec || 0;
  const box = document.getElementById('lyricsBox');
  if(!box) return;

  const lines = [...box.querySelectorAll('.lyric-line')];
  if(!lines.length) return;

  let activeIndex = -1;
  lines.forEach((line, i) => {
    const time = Number(line.dataset.time);
    if(time <= currentTrackProgressSec) activeIndex = i;
    line.classList.toggle('past', i < activeIndex);
    line.classList.toggle('active', i === activeIndex);
  });

  if(activeIndex >= 0){
    const active = lines[activeIndex];
    const boxRect = box.getBoundingClientRect();
    const lineRect = active.getBoundingClientRect();
    if(lineRect.top < boxRect.top + box.clientHeight * .30 ||
       lineRect.bottom > boxRect.top + box.clientHeight * .72){
      active.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }
  }
}

function animateLyrics(progressMs, isPlaying){
  if(currentLyricsAnimationFrame) cancelAnimationFrame(currentLyricsAnimationFrame);
  const startedAt = performance.now();
  const startSec = (progressMs || 0) / 1000;

  if(!isPlaying){
    syncLyrics(startSec);
    return;
  }

  const frame = now => {
    const elapsed = (now - startedAt) / 1000;
    syncLyrics(startSec + elapsed);
    currentLyricsAnimationFrame = requestAnimationFrame(frame);
  };
  currentLyricsAnimationFrame = requestAnimationFrame(frame);
}

async function loadLyricsFor(track, durationMs){
  const id = track.id;
  if(lyricsCache[id] !== undefined){
    renderLyricsBox(lyricsCache[id]);
    animateLyrics(currentTrackProgressSec * 1000, true);
    return;
  }

  const artist = track.artists[0]?.name || '';
  const data = await fetchLyricsData(
    track.name,
    artist,
    track.album.name,
    Math.round(durationMs / 1000)
  );

  lyricsCache[id] = data;
  if(currentTrackId === id){
    renderLyricsBox(data);
    animateLyrics(currentTrackProgressSec * 1000, true);
  }
}

async function fetchProfile(){
  try{

      headers: { Authorization: `Bearer ${accessToken}` }

    if(!chip) return;
    const avatar = data.images?.[0]?.url;
    const name = data.display_name || 'Your profile';
    chip.href = data.external_urls?.spotify || '#';
    chip.style.display = 'flex';
    chip.innerHTML = `
      ${avatar ? `<img class="profile-avatar" src="${avatar}" alt="">` : `<span class="profile-avatar">${escapeHtml(name.charAt(0).toUpperCase())}</span>`}
      <span class="profile-name">${escapeHtml(name)}</span>
    `;
  } catch(e){ /* leave the chip hidden on failure */ }
}

/* ---------- playback controls ---------- */
async function playerAction(method, path, okMessage){
  try{
    const res = await fetch(`https://api.spotify.com/v1/me/player${path}`, {
      method,
      headers: { Authorization: `Bearer ${accessToken}` }
    });
    if(res.status === 403){ showToast("That needs Spotify Premium."); return; }
    if(res.status === 401){
      const stored = localStorage.getItem(REFRESH_KEY);
      if(stored && await refreshAccessToken(stored)){ setTimeout(tick, 300); return; }
      renderLogin("Session expired — log in again.");
      return;
    }
    if(res.status === 404){ showToast("Open Spotify on a device first."); return; }
    showToast(okMessage);
    setTimeout(tick, 450);
  } catch(e){
    showToast("Couldn't reach Spotify.");
  }
}

let toastTimer = null;
function showToast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('show'), 1800);
}

/* ---------- gradient from album art (two-tone, no storage used) ---------- */
function pickVibrant(pixelData){
  let best = null, bestScore = -1, fallbackR=0, fallbackG=0, fallbackB=0, n=0;
  for(let i=0;i<pixelData.length;i+=4){
    const r=pixelData[i], g=pixelData[i+1], b=pixelData[i+2], a=pixelData[i+3];
    if(a < 100) continue;
    fallbackR+=r; fallbackG+=g; fallbackB+=b; n++;
    const max=Math.max(r,g,b), min=Math.min(r,g,b);
    const lum=(max+min)/2;
    if(lum < 30 || lum > 225) continue; // skip near-black/near-white pixels
    const sat = max===0 ? 0 : (max-min)/max;
    if(sat > bestScore){ bestScore = sat; best = [r,g,b]; }
  }
  if(best) return best;
  if(n===0) return [124,58,237]; // ultimate fallback: violet
  return [Math.round(fallbackR/n), Math.round(fallbackG/n), Math.round(fallbackB/n)];
}

function extractGradient(imgUrl){
  if(!imgUrl) return;
  const img = new Image();
  img.crossOrigin = 'Anonymous';
  img.onload = () => {
    try{
      const canvas = document.createElement('canvas');
      canvas.width = 24; canvas.height = 24;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, 24, 24);
      const left = ctx.getImageData(0, 0, 10, 24).data;
      const right = ctx.getImageData(14, 0, 10, 24).data;
      const [r1,g1,b1] = pickVibrant(left);
      const [r2,g2,b2] = pickVibrant(right);
      document.documentElement.style.setProperty('--c1', `rgb(${r1},${g1},${b1})`);
      document.documentElement.style.setProperty('--c2', `rgb(${r2},${g2},${b2})`);
    } catch(e){ /* CORS-tainted canvas - keep the current colors */ }
  };
  img.src = imgUrl;
}

/* ---------- polling ---------- */
async function tick(){
  try{
    const res = await fetch('https://api.spotify.com/v1/me/player/currently-playing', {
      headers: { Authorization: `Bearer ${accessToken}` }
    });
    if(res.status === 204){ renderIdle(); return; }
    if(res.status === 401){
      const stored = localStorage.getItem(REFRESH_KEY);
      if(stored && await refreshAccessToken(stored)){ tick(); return; }
      renderLogin("Session expired — log in again.");
      return;
    }
    const data = await res.json();
    if(!data || !data.item){ renderIdle(); return; }
    renderTrack(data);
  } catch(e){ /* transient network hiccup - keep current view, retry next tick */ }
}

function startPolling(){
  stopPolling();
  stage.innerHTML = `
    <div class="topbar">
      <a class="profile-chip" id="profileChip" href="#" target="_blank" rel="noopener"></a>
      <button class="logout-btn" id="logoutBtn">Log out</button>
    </div>
    <div class="layout">
      <div class="main-col" id="nowPlaying"></div>
      <aside class="side-col" id="library"></aside>
    </div>
  `;
  document.getElementById('logoutBtn').addEventListener('click', logout);
  fetchProfile();
  nowPlayingEl = document.getElementById('nowPlaying');
  libraryEl = document.getElementById('library');
  tick();
  fetchLibrary();
  pollTimer = setInterval(tick, 5000);
}
function stopPolling(){
  if(pollTimer){ clearInterval(pollTimer); pollTimer = null; }
}

/* ---------- init ---------- */
(async function init(){
  if(CLIENT_ID.includes('PASTE_YOUR')){
    renderLogin("Add your Spotify Client ID in the code before this will work.");
    return;
  }
  const params = new URLSearchParams(window.location.search);
  const code = params.get('code');
  if(code){
    exchangeCodeForToken(code);
    return;
  }
  const stored = localStorage.getItem(REFRESH_KEY);
  if(stored){
    const ok = await refreshAccessToken(stored);
    if(ok){ startPolling(); return; }
    localStorage.removeItem(REFRESH_KEY);
  }
  renderLogin();
})();
