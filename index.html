<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Now Spinning</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #17140f;
    --bg-soft: #1f1b14;
    --paper: #f5f1e8;
    --paper-dim: #b7ae9c;
    --accent: #e8a33d;
    --accent-dim: #e8a33d55;
  }
  *{ box-sizing: border-box; margin: 0; padding: 0; }
  html, body{ height: 100%; }
  body{
    background: radial-gradient(120% 140% at 20% -10%, var(--bg-soft), var(--bg) 60%);
    color: var(--paper);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px;
    overflow-x: hidden;
  }

  .stage{
    width: 100%;
    max-width: 420px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }

  /* --- vinyl + art --- */
  .platter{
    position: relative;
    width: 260px;
    height: 260px;
    margin-bottom: 36px;
    flex-shrink: 0;
  }
  .disc{
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background:
      repeating-radial-gradient(circle at center,
        #0c0a07 0px, #0c0a07 2px,
        #1a160f 2px, #1a160f 4px);
    box-shadow: 0 20px 50px -12px rgba(0,0,0,.7);
    animation: spin 6s linear infinite;
    animation-play-state: paused;
  }
  .disc.spinning{ animation-play-state: running; }
  .art-wrap{
    position: absolute;
    top: 50%; left: 50%;
    width: 46%;
    height: 46%;
    transform: translate(-50%,-50%);
    border-radius: 50%;
    overflow: hidden;
    border: 3px solid var(--bg);
    box-shadow: 0 0 0 1px rgba(255,255,255,.08);
    background: var(--bg-soft);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .art-wrap img{ width: 100%; height: 100%; object-fit: cover; }
  .art-wrap.empty::after{
    content: '';
    width: 10px; height: 10px;
    border-radius: 50%;
    background: var(--paper-dim);
  }
  @keyframes spin{ to{ transform: rotate(360deg); } }

  /* --- text --- */
  .track{
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 26px;
    line-height: 1.25;
    letter-spacing: -0.01em;
    margin-bottom: 6px;
    max-width: 360px;
  }
  .artist{
    font-size: 15px;
    color: var(--paper-dim);
    margin-bottom: 28px;
  }

  /* --- progress --- */
  .progress-row{ width: 100%; max-width: 300px; margin-bottom: 22px; }
  .track-bar{
    position: relative;
    height: 2px;
    background: rgba(245,241,232,.14);
    border-radius: 2px;
    margin-bottom: 8px;
  }
  .track-bar-fill{
    position: absolute;
    top: 0; left: 0; height: 100%;
    background: var(--accent);
    border-radius: 2px;
    width: 0%;
    transition: width 1s linear, background .6s ease;
  }
  .time-row{
    display: flex; justify-content: space-between;
    font-size: 11px; color: var(--paper-dim);
    font-variant-numeric: tabular-nums;
  }

  .state{
    display: inline-flex;
    align-items: center;
    gap: 7px;
    font-size: 13px;
    color: var(--paper-dim);
  }
  .state .dot{
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--accent);
    transition: background .6s ease;
  }
  .state .dot.paused{ background: var(--paper-dim); }

  /* --- login / status card --- */
  .intro{
    font-size: 15px;
    color: var(--paper-dim);
    max-width: 300px;
    line-height: 1.6;
    margin-bottom: 26px;
  }
  .needle{
    width: 64px; height: 64px;
    margin-bottom: 28px;
    opacity: .85;
  }
  button{
    background: var(--paper);
    color: var(--bg);
    border: none;
    padding: 13px 26px;
    border-radius: 999px;
    font-weight: 600;
    font-size: 14px;
    font-family: inherit;
    cursor: pointer;
    transition: transform .15s ease, background .15s ease;
  }
  button:hover{ background: var(--accent); }
  button:active{ transform: scale(.97); }
  button:focus-visible{ outline: 2px solid var(--accent); outline-offset: 3px; }

  .foot-note{
    margin-top: 22px;
    font-size: 11px;
    color: var(--paper-dim);
    opacity: .6;
  }

  @media (prefers-reduced-motion: reduce){
    .disc{ animation: none !important; }
  }

  @media (max-width: 360px){
    .platter{ width: 210px; height: 210px; }
    .track{ font-size: 22px; }
  }
</style>
</head>
<body>

<div class="stage" id="stage">
  <div class="platter">
    <svg class="needle" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
      <circle cx="32" cy="32" r="30" stroke="#f5f1e8" stroke-width="1.5" opacity=".5"/>
      <circle cx="32" cy="32" r="4" fill="#e8a33d"/>
    </svg>
  </div>
  <p class="intro">Loading…</p>
</div>

<script>
/* ============ CONFIGURE THIS ============ */
const CLIENT_ID = "f8ae9b8233d44779be5fa82f8351bbf9";
/* ========================================= */

const REDIRECT_URI = window.location.origin + window.location.pathname;
const SCOPES = "user-read-currently-playing user-read-playback-state";
const stage = document.getElementById('stage');

let accessToken = null;
let pollTimer = null;

/* ---------- PKCE helpers ---------- */
function randomString(len){
  const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
  let out = '';
  for(let i=0;i<len;i++) out += chars.charAt(Math.floor(Math.random()*chars.length));
  return out;
}
async function sha256(plain){
  const data = new TextEncoder().encode(plain);
  return crypto.subtle.digest('SHA-256', data);
}
function base64UrlEncode(buffer){
  return btoa(String.fromCharCode(...new Uint8Array(buffer)))
    .replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}

/* window.name survives the redirect to Spotify and back, without touching
   localStorage/sessionStorage (which this page intentionally avoids). */
async function redirectToAuth(){
  const verifier = randomString(64);
  window.name = "sp_verifier:" + verifier;
  const challenge = base64UrlEncode(await sha256(verifier));
  const params = new URLSearchParams({
    client_id: CLIENT_ID,
    response_type: 'code',
    redirect_uri: REDIRECT_URI,
    scope: SCOPES,
    code_challenge_method: 'S256',
    code_challenge: challenge
  });
  window.location.href = `https://accounts.spotify.com/authorize?${params}`;
}

async function exchangeCodeForToken(code){
  const verifier = window.name.startsWith('sp_verifier:') ? window.name.slice(12) : null;
  if(!verifier){
    renderLogin("That link expired — log in again.");
    return;
  }
  const body = new URLSearchParams({
    client_id: CLIENT_ID,
    grant_type: 'authorization_code',
    code,
    redirect_uri: REDIRECT_URI,
    code_verifier: verifier
  });
  const res = await fetch('https://accounts.spotify.com/api/token', {
    method: 'POST',
    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
    body
  });
  const data = await res.json();
  window.history.replaceState({}, document.title, REDIRECT_URI);
  if(data.access_token){
    accessToken = data.access_token;
    startPolling();
  } else {
    renderLogin("Couldn't log in — try again.");
  }
}

/* ---------- rendering ---------- */
function renderLogin(message){
  stage.innerHTML = `
    <svg class="needle" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
      <circle cx="32" cy="32" r="30" stroke="#f5f1e8" stroke-width="1.5" opacity=".5"/>
      <circle cx="32" cy="32" r="4" fill="#e8a33d"/>
    </svg>
    <p class="intro">${message || "Connect your Spotify account to see what's spinning right now."}</p>
    <button id="loginBtn">Log in with Spotify</button>
  `;
  document.getElementById('loginBtn').addEventListener('click', redirectToAuth);
}

function renderIdle(){
  stopPolling(false);
  stage.innerHTML = `
    <div class="platter"><div class="disc"></div><div class="art-wrap empty"></div></div>
    <p class="intro" style="margin-bottom:0;">Nothing spinning right now.</p>
  `;
}

function msToClock(ms){
  const total = Math.floor(ms/1000);
  const m = Math.floor(total/60);
  const s = total % 60;
  return `${m}:${String(s).padStart(2,'0')}`;
}

function renderTrack(data, accentHex){
  const track = data.item;
  const artists = track.artists.map(a => a.name).join(', ');
  const art = track.album.images[0]?.url || '';
  const progress = data.progress_ms || 0;
  const duration = track.duration_ms || 1;
  const pct = Math.min(100, (progress/duration) * 100);
  const playing = !!data.is_playing;

  stage.innerHTML = `
    <div class="platter">
      <div class="disc ${playing ? 'spinning' : ''}"></div>
      <div class="art-wrap"><img src="${art}" alt=""></div>
    </div>
    <h1 class="track">${escapeHtml(track.name)}</h1>
    <p class="artist">${escapeHtml(artists)}</p>
    <div class="progress-row">
      <div class="track-bar"><div class="track-bar-fill" style="width:${pct}%"></div></div>
      <div class="time-row"><span>${msToClock(progress)}</span><span>${msToClock(duration)}</span></div>
    </div>
    <div class="state"><span class="dot ${playing ? '' : 'paused'}"></span>${playing ? 'Playing' : 'Paused'}</div>
  `;
  if(accentHex){
    document.documentElement.style.setProperty('--accent', accentHex);
  }
}

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

/* ---------- pull a dominant color from the album art ---------- */
function extractAccent(imgUrl){
  return new Promise((resolve) => {
    const img = new Image();
    img.crossOrigin = 'Anonymous';
    img.onload = () => {
      try{
        const canvas = document.createElement('canvas');
        canvas.width = 24; canvas.height = 24;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, 24, 24);
        const { data } = ctx.getImageData(0, 0, 24, 24);
        let r=0,g=0,b=0,n=0;
        for(let i=0;i<data.length;i+=4){
          const [rr,gg,bb,aa] = [data[i],data[i+1],data[i+2],data[i+3]];
          if(aa < 100) continue;
          // skip near-black / near-white pixels so the accent stays vivid
          const lum = (rr+gg+bb)/3;
          if(lum < 25 || lum > 235) continue;
          r+=rr; g+=gg; b+=bb; n++;
        }
        if(n === 0){ resolve(null); return; }
        r = Math.round(r/n); g = Math.round(g/n); b = Math.round(b/n);
        resolve(`rgb(${r},${g},${b})`);
      } catch(e){
        resolve(null); // canvas got tainted by CORS - just keep the default accent
      }
    };
    img.onerror = () => resolve(null);
    img.src = imgUrl;
  });
}

/* ---------- polling ---------- */
async function tick(){
  try{
    const res = await fetch('https://api.spotify.com/v1/me/player/currently-playing', {
      headers: { Authorization: `Bearer ${accessToken}` }
    });
    if(res.status === 204){ renderIdle(); startPolling(); return; }
    if(res.status === 401){ stopPolling(false); renderLogin("Session expired — log in again."); return; }
    const data = await res.json();
    if(!data || !data.item){ renderIdle(); startPolling(); return; }
    const art = data.item.album.images[0]?.url;
    const accent = art ? await extractAccent(art) : null;
    renderTrack(data, accent);
  } catch(e){
    // transient network hiccup - keep the current view and try again next tick
  }
}

function startPolling(){
  stopPolling(false);
  tick();
  pollTimer = setInterval(tick, 5000);
}
function stopPolling(){
  if(pollTimer){ clearInterval(pollTimer); pollTimer = null; }
}

/* ---------- init ---------- */
(function init(){
  if(CLIENT_ID.includes('PASTE_YOUR')){
    renderLogin("Add your Spotify Client ID in the code before this will work.");
    return;
  }
  const params = new URLSearchParams(window.location.search);
  const code = params.get('code');
  if(code){
    exchangeCodeForToken(code);
  } else {
    renderLogin();
  }
})();
</script>
</body>
</html>
