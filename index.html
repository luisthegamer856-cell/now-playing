<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Now Playing">
<meta name="theme-color" content="#14101F">
<title>Now Playing</title>
<link rel="icon" type="image/jpeg" href="Sky.jpeg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Inter:wght@400;500;600;700&family=Onest:wght@400..800&display=swap" rel="stylesheet">
<style>
  :root{
    /* Side safe areas. The page shrinks the one on the side WITHOUT the notch /
       Dynamic Island (set from the phone's rotation in JS) to use that space. */
    --sa-l: env(safe-area-inset-left);
    --sa-r: env(safe-area-inset-right);
    --c1: #FF3D81;
    --c2: #7C3AED;
    --ink: #14101F;
    --paper: #FFF9F0;
    --lime: #C6FF3D;
  }
  *{ box-sizing: border-box; margin: 0; padding: 0; }
  html{ height: 100%; background: var(--ink); }
  html.island-left{ --sa-r: 0px; }
  html.island-right{ --sa-l: 0px; }
  body{
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    color: var(--paper);
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    background: var(--ink);
    /* keep content out of the notch / home-indicator areas while the
       background still fills the whole screen (viewport-fit=cover) */
    padding: env(safe-area-inset-top) var(--sa-r) env(safe-area-inset-bottom) var(--sa-l);
    overflow-x: hidden;
    position: relative;
  }

  /* ---------- moving background ---------- */
  .bg-blobs{
    position: fixed;
    inset: 0;
    overflow: hidden;
    z-index: 0;
    filter: blur(90px);
  }
  .blob{
    position: absolute;
    border-radius: 50%;
    mix-blend-mode: screen;
    transition: background 1.2s ease;
  }
  .blob-a{
    width: 60vmax; height: 60vmax;
    top: -22%; left: -18%;
    background: var(--c1);
    opacity: .8;
    animation: floatA 28s ease-in-out infinite alternate;
  }
  .blob-b{
    width: 54vmax; height: 54vmax;
    bottom: -26%; right: -14%;
    background: var(--c2);
    opacity: .75;
    animation: floatB 34s ease-in-out infinite alternate;
  }
  .blob-c{
    width: 40vmax; height: 40vmax;
    top: 28%; left: 38%;
    background: var(--c3, var(--lime));
    opacity: .4;
    animation: floatC 22s ease-in-out infinite alternate;
  }
  @keyframes floatA{
    0%{ transform: translate(0,0) scale(1); }
    100%{ transform: translate(12vw,14vh) scale(1.18); }
  }
  @keyframes floatB{
    0%{ transform: translate(0,0) scale(1); }
    100%{ transform: translate(-14vw,-10vh) scale(1.12); }
  }
  @keyframes floatC{
    0%{ transform: translate(0,0) scale(1); }
    100%{ transform: translate(9vw,-14vh) scale(0.88); }
  }
  @media (prefers-reduced-motion: reduce){
    .blob{ animation: none !important; }
  }


  /* ---------- extra moving background styles (pick one in Settings) ---------- */
  .bgs{ position: fixed; inset: 0; overflow: hidden; z-index: 0; display: none; pointer-events: none; }
  .custom-bg{ position: fixed; inset: 0; z-index: 0; display: none; overflow: hidden; pointer-events: none; background:#14101F; }
  html[data-custom-bg="1"] .custom-bg{ display:block; }
  html[data-custom-bg="1"] .bgs{ display:none !important; }
  .custom-bg img,.custom-bg video{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:block; transform:translateZ(0); }
  .custom-bg::after{ content:''; position:absolute; inset:0; background:rgba(0,0,0,.18); pointer-events:none; }
  .sp-custom{ padding:6px 10px 8px; }
  .sp-custom-head{ display:flex; align-items:center; justify-content:space-between; gap:8px; margin:4px 4px 8px; }
  .sp-custom-head .sp-bglabel{ margin:0; }
  .custom-add{ border:1px solid rgba(255,255,255,.28); background:rgba(255,255,255,.14); color:inherit; border-radius:999px; padding:6px 10px; font:600 11px inherit; cursor:pointer; }
  .custom-add:hover{ background:rgba(255,255,255,.24); }
  .custom-bggrid{ display:grid; grid-template-columns:repeat(3,1fr); gap:6px; }
  .custom-tile{ position:relative; min-width:0; border:1.5px solid transparent; border-radius:13px; background:rgba(255,255,255,.06); padding:3px; color:inherit; cursor:pointer; overflow:hidden; }
  .custom-tile[aria-checked="true"]{ border-color:rgba(255,255,255,.9); background:rgba(255,255,255,.14); }
  .custom-thumb{ display:block; width:100%; aspect-ratio:16/10; object-fit:cover; border-radius:9px; background:#14101F; }
  .custom-name{ display:block; margin:4px 2px 1px; font-size:9.5px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; text-align:center; }
  .custom-delete{ position:absolute; top:6px; right:6px; width:22px; height:22px; border:0; border-radius:50%; background:rgba(0,0,0,.65); color:#fff; display:grid; place-items:center; cursor:pointer; font:700 14px/1 sans-serif; }
  .custom-empty{ font-size:11px; opacity:.62; padding:5px 4px 2px; }
  #customBgInput{ display:none; }

  html[data-bg="flow"] .bgs-flow, html[data-bg="liquid"] .bgs-liquid, html[data-bg="beams"] .bgs-beams,
  html[data-bg="bokeh"] .bgs-bokeh, html[data-bg="stars"] .bgs-stars, html[data-bg="ripple"] .bgs-ripple,
  html[data-bg="orbit"] .bgs-orbit, html[data-bg="waves"] .bgs-waves, html[data-bg="lights"] .bgs-lights,
  html[data-bg="lava"] .bgs-lava, html[data-bg="grid"] .bgs-grid,
  html[data-bg="city"] .bgs-city, html[data-bg="tokyo"] .bgs-tokyo{ display: block; }
  html[data-bg] .bg-blobs{ display: none; }
  @keyframes bgSpin{ to{ transform: rotate(360deg); } }

  /* Flow: a slow-shifting colour gradient */
  .bgs-flow{
    background: linear-gradient(120deg, var(--c1), var(--c2), var(--c3, var(--lime)), var(--c2), var(--c1));
    background-size: 320% 320%; animation: bgFlow 24s ease-in-out infinite;
  }
  .bgs-flow::after{ content: ''; position: absolute; inset: 0; background: rgba(20,16,31,.46); }
  @keyframes bgFlow{ 0%{ background-position: 0% 50%; } 50%{ background-position: 100% 50%; } 100%{ background-position: 0% 50%; } }

  /* Liquid: big soft shapes turning slowly */
  .bgs-liquid{ filter: blur(70px); }
  .bgs-liquid i{ position: absolute; width: 90vmax; height: 90vmax; border-radius: 43%; mix-blend-mode: screen; opacity: .55; }
  .bgs-liquid i:nth-child(1){ background: var(--c1); left: -30vmax; top: -36vmax; animation: bgSpin 38s linear infinite; }
  .bgs-liquid i:nth-child(2){ background: var(--c2); right: -36vmax; bottom: -42vmax; animation: bgSpin 46s linear infinite reverse; }
  .bgs-liquid i:nth-child(3){ background: var(--c3, var(--lime)); width: 60vmax; height: 60vmax; left: 28%; top: 18%; opacity: .32; animation: bgSpin 30s linear infinite; }

  /* Beams: light sweeping around like a slow lighthouse */
  .bgs-beams i{
    position: absolute; left: 50%; top: 50%; width: 170vmax; height: 170vmax; margin: -85vmax 0 0 -85vmax;
    background: conic-gradient(from 0deg, transparent 0 8%, var(--c1) 15%, transparent 24% 40%, var(--c2) 48%, transparent 57% 72%, var(--c3, var(--lime)) 80%, transparent 89%);
    filter: blur(60px); opacity: .62; animation: bgSpin 44s linear infinite;
  }

  /* Bokeh: soft glowing circles drifting about */
  .bgs-bokeh::before{ content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, transparent 20%, var(--c2) 140%); opacity: .35; }
  .bgs-bokeh i{
    position: absolute; width: var(--s); height: var(--s); border-radius: 50%; opacity: .5;
    background: radial-gradient(circle, var(--bk) 0%, transparent 68%); filter: blur(3px);
    animation: bgBokeh var(--d) ease-in-out infinite alternate; animation-delay: var(--dl);
  }
  @keyframes bgBokeh{ 0%{ transform: translate(0,0) scale(.85); opacity: .25; } 100%{ transform: translate(var(--dx), -14vh) scale(1.15); opacity: .65; } }

  /* Stars: twinkling dots and the odd shooting star */
  .bgs-stars::before{
    content: ''; position: absolute; inset: -10%; opacity: .38; filter: blur(50px);
    background: radial-gradient(60% 50% at 15% 10%, var(--c1), transparent 70%), radial-gradient(55% 50% at 90% 95%, var(--c2), transparent 70%);
  }
  .bgs-stars i{ position: absolute; border-radius: 50%; background: #fff; opacity: .55; animation: bgTwinkle var(--t) ease-in-out infinite; animation-delay: var(--dl); }
  @keyframes bgTwinkle{ 0%,100%{ opacity: .15; transform: scale(.8); } 50%{ opacity: 1; transform: scale(1.4); } }
  .bgs-stars b{ position: absolute; width: 150px; height: 2px; border-radius: 2px; opacity: 0; background: linear-gradient(90deg, #fff, transparent); animation: bgShoot 11s ease-in infinite; }
  @keyframes bgShoot{ 0%{ transform: translate(0,0) rotate(-35deg); opacity: 0; } 2%{ opacity: .9; } 7%{ transform: translate(-30vw,21vw) rotate(-35deg); opacity: 0; } 100%{ transform: translate(-30vw,21vw) rotate(-35deg); opacity: 0; } }

  /* Ripple: rings spreading out from the middle */
  .bgs-ripple{ filter: blur(1.5px); }
  .bgs-ripple::before{ content: ''; position: absolute; inset: 0; background: radial-gradient(40% 40% at 50% 50%, var(--c2), transparent 70%); opacity: .28; }
  .bgs-ripple i{
    position: absolute; left: 50%; top: 50%; width: 46vmax; height: 46vmax; margin: -23vmax 0 0 -23vmax; border-radius: 50%;
    border: 3px solid var(--rc); box-shadow: 0 0 50px var(--rc), inset 0 0 50px var(--rc); opacity: .28;
    transform: scale(calc(.5 + var(--i) * .55)); animation: bgRipple 16s linear infinite; animation-delay: calc(var(--i) * -3.2s);
  }
  @keyframes bgRipple{ 0%{ transform: scale(.15); opacity: 0; } 12%{ opacity: .42; } 100%{ transform: scale(3.4); opacity: 0; } }

  /* Orbit: three glows circling the screen */
  .bgs-orbit{ filter: blur(60px); }
  .bgs-orbit i{
    position: absolute; left: 50%; top: 50%; width: 46vmax; height: 46vmax; margin: -23vmax 0 0 -23vmax; border-radius: 50%;
    mix-blend-mode: screen; opacity: .6; background: var(--oc);
    transform: rotate(calc(var(--i) * 120deg)) translateX(var(--r)) rotate(calc(var(--i) * -120deg));
    animation: bgOrbit var(--t) linear infinite;
  }
  @keyframes bgOrbit{
    from{ transform: rotate(calc(var(--i) * 120deg)) translateX(var(--r)) rotate(calc(var(--i) * -120deg)); }
    to{ transform: rotate(calc(var(--i) * 120deg + 360deg)) translateX(var(--r)) rotate(calc(var(--i) * -120deg - 360deg)); }
  }


  /* Waves: layered swells rolling sideways */
  .bgs-waves::before{ content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, var(--c1), transparent 75%); opacity: .3; }
  .bgs-waves svg{ position: absolute; left: 0; bottom: var(--b); width: 200%; height: var(--h); opacity: var(--op); animation: bgWave var(--t) linear infinite; }
  .bgs-waves path{ fill: var(--wc); }
  @keyframes bgWave{ from{ transform: translateX(0); } to{ transform: translateX(-50%); } }

  /* Lights: soft northern-lights curtains swaying */
  .bgs-lights::before{ content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, transparent 55%, var(--c2) 170%); opacity: .3; }
  .bgs-lights i{
    position: absolute; top: -12%; width: 38vmax; height: 100%; mix-blend-mode: screen; opacity: .85; filter: blur(26px);
    background: linear-gradient(180deg, transparent 0%, var(--ac) 30%, var(--ac) 52%, transparent 100%);
    transform-origin: 50% 0; animation: bgSway var(--t) ease-in-out infinite alternate;
  }
  @keyframes bgSway{ 0%{ transform: translateX(-7vw) skewX(-11deg) scaleY(.88); opacity: .5; } 100%{ transform: translateX(7vw) skewX(11deg) scaleY(1.12); opacity: .95; } }

  /* Lava: big blobs slowly rising and sinking */
  .bgs-lava{ filter: blur(34px); }
  .bgs-lava i{
    position: absolute; left: var(--x); top: 76%; width: var(--s); height: var(--s); margin-left: calc(var(--s) / -2);
    border-radius: 50%; background: var(--lc); mix-blend-mode: screen; opacity: .72;
    transform: translate(0, -30vh); animation: bgLava var(--d) ease-in-out infinite alternate; animation-delay: calc(var(--d) * -.45);
  }
  .bgs-lava i:nth-child(odd){ animation-delay: calc(var(--d) * -.15); }
  .bgs-lava i:nth-child(3n){ animation-delay: calc(var(--d) * -.7); }
  @keyframes bgLava{ 0%{ transform: translate(0, 4vh) scale(1); } 100%{ transform: translate(var(--dx), -88vh) scale(var(--sc)); } }

  /* Grid: a glowing retro floor scrolling toward you */
  .bgs-grid .sun{
    position: absolute; left: 50%; top: 18%; width: 28vmax; height: 28vmax; margin-left: -14vmax; border-radius: 50%;
    background: linear-gradient(180deg, var(--c3, var(--lime)), var(--c1)); opacity: .85; filter: blur(2px);
  }
  .bgs-grid .gd{
    position: absolute; left: 0; right: 0; top: 52%; bottom: 0; background: #120D1D; overflow: hidden;
    border-top: 2px solid var(--c1); box-shadow: 0 -6px 50px var(--c1);
  }
  .bgs-grid .gd i{
    position: absolute; left: -70%; right: -70%; top: 0; bottom: -60%;
    background-image: linear-gradient(var(--c2) 2px, transparent 2px), linear-gradient(90deg, var(--c2) 2px, transparent 2px);
    background-size: 64px 64px; opacity: .75;
    transform: perspective(340px) rotateX(58deg); transform-origin: 50% 0; animation: bgGrid 2.2s linear infinite;
    -webkit-mask-image: linear-gradient(180deg, transparent 0%, #000 38%); mask-image: linear-gradient(180deg, transparent 0%, #000 38%);
  }
  @keyframes bgGrid{ to{ background-position: 0 64px, 0 0; } }


  /* ---------- City and Tokyo skylines (day / night, tinted by the album colours) ---------- */
  :root{ --bf: rgba(255,255,255,.07); --bm: #1a1330; --bF: #0e0a1c; --wf: var(--c3, var(--lime)); --tc: var(--c3, var(--lime)); --td: var(--c3, var(--lime)); --fj: rgba(255,255,255,.06); --fs: rgba(255,255,255,.16); --carb: var(--c3, var(--lime)); --trn: #0e0a1c; }
  html.ct-day{ --bf: rgba(255,255,255,.36); --bm: rgba(46,36,84,.44); --bF: rgba(24,18,44,.84); --wf: rgba(255,255,255,.4); --tc: rgba(255,255,255,.94); --td: var(--c1); --fj: rgba(60,50,110,.3); --fs: rgba(255,255,255,.88); --carb: rgba(24,18,44,.75); --trn: rgba(255,255,255,.85); }
  .bgs-city, .bgs-tokyo{ background: #120d22; }
  .ct-sky{ position: absolute; inset: 0; transition: opacity 1.2s ease; }
  .ct-sky.d{
    background:
      radial-gradient(120% 55% at 50% 102%, rgba(255,255,255,.4), transparent 70%),
      linear-gradient(180deg, rgba(16,12,30,.3), rgba(16,12,30,.04)),
      linear-gradient(180deg, var(--c1), var(--c2));
    opacity: 0;
  }
  .ct-sky.n{
    background:
      radial-gradient(130% 60% at 50% 108%, var(--c1), transparent 72%),
      linear-gradient(180deg, #070511 0%, #100b22 60%, #170f2c 100%);
    opacity: 1;
  }
  html.ct-day .ct-sky.d{ opacity: 1; }
  html.ct-day .ct-sky.n{ opacity: 0; }

  .ct-stars, .ct-clouds, .ct-orb{ transition: opacity 1.2s ease; }
  .ct-stars{ position: absolute; inset: 0 0 40% 0; opacity: 1; }
  html.ct-day .ct-stars{ opacity: 0; }
  .ct-stars i{ position: absolute; border-radius: 50%; background: #fff; opacity: .6; animation: bgTwinkle var(--t) ease-in-out infinite; animation-delay: var(--dl); }
  .ct-clouds{ position: absolute; inset: 0; opacity: 0; }
  html.ct-day .ct-clouds{ opacity: 1; }
  .ct-clouds svg{ position: absolute; left: var(--l); top: var(--y); width: var(--w); fill: #fff; opacity: .3; animation: ctCloud var(--t) ease-in-out infinite alternate; animation-delay: var(--dl); }
  @keyframes ctCloud{ from{ transform: translateX(-26vw); } to{ transform: translateX(26vw); } }
  .ct-orb{ position: absolute; left: 40%; top: 13%; border-radius: 50%; animation: ctOrb 70s ease-in-out infinite alternate; }
  @keyframes ctOrb{ from{ transform: translate(-3vw, 1vh); } to{ transform: translate(5vw, -1vh); } }
  .ct-orb.sun{ width: 9vmax; height: 9vmax; margin: -4.5vmax; background: radial-gradient(circle, #fff 0 38%, rgba(255,255,255,.6) 40% 54%, rgba(255,255,255,0) 72%); box-shadow: 0 0 80px 24px var(--c3, #ffd27a); opacity: 0; }
  .ct-orb.moon{ width: 6.5vmax; height: 6.5vmax; margin: -3.25vmax; background: #f4f1ff; box-shadow: 0 0 60px 10px rgba(255,255,255,.2), inset -1.3vmax -.5vmax 0 0 rgba(120,110,170,.38); opacity: 1; }
  html.ct-day .ct-orb.sun{ opacity: 1; }
  html.ct-day .ct-orb.moon{ opacity: 0; }

  .ct-svg{ position: absolute; left: 0; right: 0; bottom: 0; width: 100%; height: clamp(210px, 42vh, 520px); }
  .ct-svg rect, .ct-svg path, .ct-svg line, .ct-svg circle{ transition: fill 1.2s ease, stroke 1.2s ease, opacity 1.2s ease; }
  .ct-svg .ly-far rect{ fill: var(--bf); }
  .ct-svg .ly-mid rect{ fill: var(--bm); }
  .ct-svg .ly-front rect{ fill: var(--bF); }
  .ct-svg .win{ fill: var(--wf); }
  .ct-svg .wg{ --wm: .8; animation: winFlick var(--d) ease-in-out infinite; }
  .ct-svg .ly-mid .wg{ --wm: .38; }
  @keyframes winFlick{ 0%,100%{ opacity: calc(var(--wm) * .62); } 50%{ opacity: var(--wm); } }
  .ct-svg .road{ fill: var(--bF); }
  .ct-svg .cb{ fill: var(--carb); }
  .ct-svg .cg{ fill: var(--c3, var(--lime)); opacity: 0; }
  html.ct-night .ct-svg .cg{ opacity: .35; }
  .ct-svg .car{ animation: ctCar var(--d) linear infinite; }
  @keyframes ctCar{ from{ transform: translateX(var(--a)); } to{ transform: translateX(var(--b)); } }
  /* Tokyo only */
  .ct-svg .fj{ fill: var(--fj); }
  .ct-svg .fs{ fill: var(--fs); }
  .ct-svg .tw-l{ stroke: var(--tc); stroke-width: 2.6; fill: none; stroke-linecap: round; }
  .ct-svg .tw-d{ fill: var(--td); }
  .ct-svg .tw-b{ fill: #fff; animation: ctBlink 2.4s ease-in-out infinite; }
  @keyframes ctBlink{ 0%,100%{ opacity: .15; } 50%{ opacity: 1; } }
  .ct-svg .sk-t{ fill: rgba(255,255,255,.72); }
  html.ct-night .ct-svg .sk-t{ fill: #1a1330; }
  .ct-svg .sk-led{ stroke: var(--c2); stroke-width: 2; opacity: 0; }
  html.ct-night .ct-svg .sk-led{ opacity: .9; }
  .ct-svg .ng{ fill: var(--nc); opacity: 0; }
  html.ct-night .ct-svg .ng{ opacity: .26; }
  .ct-svg .ns{ fill: var(--nc); opacity: .55; }
  html.ct-night .ct-svg .ns{ opacity: 1; }
  html.ct-night .ct-svg .ns.f{ animation: ctNeon 7s ease-in-out infinite; animation-delay: var(--dl); }
  @keyframes ctNeon{ 0%,46%,52%,100%{ opacity: 1; } 49%{ opacity: .35; } }
  .ct-svg .rail{ fill: var(--bF); }
  .ct-svg .pil{ fill: var(--bF); opacity: .7; }
  .ct-svg .trn{ animation: ctCar 24s linear infinite; --a: -330px; --b: 1800px; }
  .ct-svg .tb{ fill: var(--trn); }
  .ct-svg .tw{ fill: var(--wf); }
  .ct-petals i{
    position: absolute; left: var(--x); top: var(--y); width: var(--s); height: calc(var(--s) * .62); border-radius: 80% 0 80% 0;
    background: linear-gradient(135deg, #fff, var(--c1)); opacity: .8;
    animation: ctPetal var(--t) linear infinite; animation-delay: var(--dl);
  }
  html.ct-night .ct-petals i{ opacity: .45; }
  @keyframes ctPetal{ 0%{ transform: translate(0,-14vh) rotate(0); opacity: 0; } 10%{ opacity: .85; } 90%{ opacity: .85; } 100%{ transform: translate(-22vw,112vh) rotate(540deg); opacity: 0; } }

  /* "Moving background" off, or reduced motion: freeze every style */
  html.bg-still .bgs, html.bg-still .bgs *, html.bg-still .bgs::before, html.bg-still .bgs::after{ animation: none !important; }
  @media (prefers-reduced-motion: reduce){ .bgs, .bgs *{ animation: none !important; } }

  .stage{
    width: 100%;
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 48px 40px 60px;
    max-width: 1180px;
    margin: 0 auto;
  }

  .layout{
    display: flex;
    align-items: flex-start;
    gap: 56px;
    width: 100%;
  }
  .main-col{
    flex: 1 1 380px;
    min-width: 0;
    max-width: 420px;
  }
  .lyrics-col{
    width: 460px;
    flex-shrink: 0;
    position: sticky;
    top: 40px;
  }
  @media (max-width: 900px){
    .layout{ flex-direction: column; }
    .main-col{ max-width: none; width: 100%; }
    .lyrics-col{ width: 100%; position: static; }
  }

  /* ---------- login / idle ---------- */
  .kicker{
    font-size: 15px;
    font-weight: 500;
    color: var(--paper);
    opacity: .8;
    margin-bottom: 10px;
  }
  .big-headline{
    font-family: 'Bricolage Grotesque', sans-serif;
    font-weight: 800;
    font-size: clamp(40px, 9vw, 68px);
    line-height: 1.02;
    letter-spacing: -0.02em;
    margin-bottom: 22px;
  }
  .sub{
    font-size: 16px;
    line-height: 1.6;
    opacity: .85;
    max-width: 380px;
    margin-bottom: 32px;
  }
  button.cta{
    align-self: flex-start;
    background: var(--paper);
    color: var(--ink);
    border: none;
    padding: 16px 30px;
    border-radius: 999px;
    font-weight: 700;
    font-size: 15px;
    font-family: inherit;
    cursor: pointer;

  /* ---------- now playing ---------- */
  .art-card{

  .like-btn{
    flex: none; width: 36px; height: 36px; margin-top: -2px; padding: 0;
    display: grid; place-items: center; border: none; border-radius: 50%;
    background: transparent; color: var(--paper); opacity: .85; cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition: background .15s ease, opacity .15s ease, color .15s ease;

  .like-btn.on{ color: #1ED760; opacity: 1; }
  .like-btn.on svg{ fill: currentColor; }
  .like-btn.pop svg{ transform: scale(1.35); }
  .like-btn.busy{ pointer-events: none; }
  html.lyrics-off .title-row, html.lyrics-static .title-row{ justify-content: center; }

  }
  .track-artist{
    font-size: 17px;

  }

  .progress{
    width: 100%;
    max-width: 420px;
    margin-bottom: 10px;
  }
  .progress-track{
    position: relative;
    height: 6px;
    background: rgba(255,255,255,.22);
    border-radius: 6px;
    cursor: pointer;
    touch-action: none;
    -webkit-user-select: none; user-select: none;
  }
  /* invisible taller hit area so the thin bar is easy to tap/drag */
  .progress-track::before{
    content: '';
    position: absolute;
    left: 0; right: 0; top: -14px; bottom: -14px;

  .progress-thumb{
    position: absolute;

  /* ---------- lyrics (big, synced, word-level sweep) ---------- */
  .section-label{
    font-size: 14px;
    font-weight: 600;
    opacity: .8;
    margin: 0 0 16px;
  }
  .lyrics-box{
    position: relative;
    height: min(66vh, 600px);
    overflow: hidden;
  }
  /* NOTE: deliberately no mask-image here. A CSS mask on a container whose
     child transform updates every frame forces a full re-rasterize of the
     masked layer each frame, which was the main cause of the glitching
     (and the repaint pressure bleeding into the artwork). The soft edge is
     done with per-line opacity instead, set only when the active line
     changes rather than every frame. */
  .lyrics-track{
    position: absolute;
    left: 0; right: 0; top: 0;
    will-change: transform;
  }
  .lyrics-text{
    font-family: 'Inter', sans-serif;

  @media (max-width: 420px){

  /* ---------- manual mobile layout (View button) ---------- */

  .settings-panel{
    --row-h: 52px; --name-fs: 15.5px; --sub-fs: 12px; --ico: 34px; --sw-w: 46px; --sw-h: 28px; --knob: 24px;
    position: absolute; top: calc(100% + 12px); right: 0;

    padding: 10px; border-radius: 30px;

      radial-gradient(120% 90% at 12% -10%, rgba(255,255,255,.5) 0%, rgba(255,255,255,0) 42%),
      radial-gradient(90% 70% at 100% 115%, rgba(140,120,255,.22) 0%, rgba(140,120,255,0) 55%),

    border: 1px solid rgba(255,255,255,.34);

      0 28px 70px rgba(0,0,0,.45),

  }

    content: ''; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; z-index: -1;
    background: linear-gradient(180deg, rgba(255,255,255,.35) 0%, rgba(255,255,255,0) 18%);

  }

    code,
    redirect_uri: REDIRECT_URI,
    code_verifier: verifier
  });
  let data = {};
  try{
    const res = await fetch('https://accounts.spotify.com/api/token', {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body
    });
    data = await res.json();
  } catch(e){ data = {}; }
  window.history.replaceState({}, document.title, REDIRECT_URI);
  clearVerifier();
  if(data.access_token){
    accessToken = data.access_token;
    if(data.refresh_token){ localStorage.setItem(REFRESH_KEY, data.refresh_token); }
    startPolling();
  } else {
    renderLogin("Couldn't log in — try again.");
  }
}

/* ---------- rendering: login / idle / track ---------- */
function renderLogin(message){
  stopPolling();
  stage.innerHTML = `
    <p class="kicker">Now playing</p>
    <h1 class="big-headline">See what's<br>spinning.</h1>
    <p class="sub">${message || "Connect Spotify to show your currently playing track, skip controls, and synced lyrics."}</p>
    <button class="cta" id="loginBtn">Log in with Spotify</button>
  `;
  document.getElementById('loginBtn').addEventListener('click', redirectToAuth);
}

function renderIdle(){
  if(!nowPlayingEl) return;
  nowPlayingEl.innerHTML = `
    <p class="kicker">Now playing</p>
    <h1 class="big-headline">Quiet for now.</h1>
    <p class="sub">Nothing's playing on Spotify right now. Start something and this page will catch up automatically.</p>
  `;
  if(lyricsColEl){
    lyricsColEl.innerHTML = '';
  }
  lyricsMeta.lines = null;
  document.documentElement.classList.remove('lyrics-static');
  currentTrackId = null;
  currentTrackDurationMs = 0;
  updateFavicon(null);
  updateTitle(null);
}

function msToClock(ms){
  const total = Math.floor(ms/1000);
  const m = Math.floor(total/60);
  const s = total % 60;
  return `${m}:${String(s).padStart(2,'0')}`;
}

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function renderTrack(data){
  if(!nowPlayingEl) return;
  const track = data.item;
  const progress = data.progress_ms || 0;
  const duration = track.duration_ms || 1;
  const playing = !!data.is_playing;

  // Build the card's DOM (including the <img>) only once per song. This is
  // the actual fix for the artwork glitch: the previous version rebuilt this
  // whole block — a fresh <img> tag included — on every 5s poll, forcing the
  // browser to redecode/repaint the image each time. Now the element is
  // created once and simply left alone; only the values below get updated.
  if(track.id !== currentTrackId){
    currentTrackId = track.id;
    currentTrackDurationMs = duration;
    buildTrackCard(track);
    extractGradient(track.album.images[0]?.url || '');
    updateFavicon(track.album.images[0]?.url || '');
    updateTitle(track);

    document.documentElement.classList.remove('lyrics-static');
    if(lyricsColEl){
      lyricsColEl.innerHTML = `
        <div class="lyrics-head">
          <p class="section-label">Lyrics</p>
          <button class="tr-btn" id="trBtn" type="button" aria-pressed="false" title="Show an English translation under each line">Translate</button>
        </div>
        
        <div class="lyrics-box" id="lyricsBox"><p class="lyrics-status">Loading lyrics…</p></div>
      `;
      const trBtn = document.getElementById('trBtn');
      if(trBtn) trBtn.onclick = toggleTranslate;
      syncSettings();
    }
    loadLyricsFor(track, duration);
  } else {
    currentTrackDurationMs = duration;
  }

  // This is the single source of truth for "where are we in the song right
  // now" — both the progress bar/time (updateProgressUI) and the lyrics
  // sweep (updateLyrics) read from it every animation frame, corrected back
  // to Spotify's real position on every 5s poll to avoid drifting.
  lyricsMeta.startMs = progress;
  lyricsMeta.startWallClock = Date.now();
  lyricsMeta.playing = playing;
  if(playing && !wakeLock) requestWakeLock();
}

/* Swaps the browser tab icon to the currently playing track's album art. */
const DEFAULT_TITLE = 'Now Playing';
function updateTitle(track){
  document.title = track ? `${track.name} \u2014 ${track.artists.map(a => a.name).join(', ')}` : DEFAULT_TITLE;
}

const DEFAULT_FAVICON = 'Sky.jpeg';
function updateFavicon(url){
  let link = document.querySelector("link[rel~='icon']");
  if(!link){
    link = document.createElement('link');
    link.rel = 'icon';
    document.head.appendChild(link);
  }
  link.href = url || DEFAULT_FAVICON;
}

/* Builds the now-playing card's DOM once per song. */
function buildTrackCard(track){
  const artists = track.artists.map(a => a.name).join(', ');
  const art = track.album.images[0]?.url || '';

  nowPlayingEl.innerHTML = `
    <div class="art-card"><img src="${art}" alt=""></div>
    <div class="title-row">
      <h1 class="track-title">${escapeHtml(track.name)}</h1>
      <button class="like-btn" id="likeBtn" type="button" aria-label="Add to Liked Songs" aria-pressed="false" hidden>${ICON.heart}</button>
    </div>
    <p class="track-artist">${escapeHtml(artists)}</p>
    <div class="progress">
      <div class="progress-track"><div class="progress-fill" id="progressFill" style="width:0%"></div><div class="progress-thumb" id="progressThumb"></div></div>
    </div>
    <div class="time-row"><span id="timeNow">0:00</span><span id="timeTotal">${msToClock(track.duration_ms || 1)}</span></div>
    <div class="controls">
      <button class="ctrl-btn" id="prevBtn" aria-label="Previous track">${ICON.prev}</button>
      <button class="ctrl-btn main" id="playBtn" aria-label="Play">${ICON.play}</button>
      <button class="ctrl-btn" id="nextBtn" aria-label="Next track">${ICON.next}</button>
    </div>
    <div class="state-label"><span class="dot" id="stateDot"></span><span id="stateText">Paused</span></div>
    <div class="up-next">
      <p class="up-next-label">Up next</p>
      <div class="up-next-content" id="upNextContent"><p class="up-next-placeholder">Loading…</p></div>
    </div>
  `;

  document.getElementById('prevBtn').addEventListener('click', () => playerAction('POST', '/previous', 'Skipped back'));
  document.getElementById('nextBtn').addEventListener('click', () => playerAction('POST', '/next', 'Skipped ahead'));
  document.getElementById('playBtn').addEventListener('click', () => {
    playerAction('PUT', lyricsMeta.playing ? '/pause' : '/play', lyricsMeta.playing ? 'Paused' : 'Playing');
  });
  setupSeeking();
  setupLike(track);
}

/* ---------- Like / unlike (Liked Songs) ---------- */
let likeState = { uri: null, liked: false, needsScope: false };
function libHeaders(){ return { Authorization: `Bearer ${accessToken}` }; }
async function libCall(method, path){
  const url = `https://api.spotify.com/v1/me/library${path}`;
  let res = await fetch(url, { method, headers: libHeaders() });
  if(res.status === 401){
    const stored = localStorage.getItem(REFRESH_KEY);
    if(stored && await refreshAccessToken(stored)) res = await fetch(url, { method, headers: libHeaders() });
  }
  return res;
}
function paintLike(){
  const b = document.getElementById('likeBtn');
  if(!b) return;
  b.classList.toggle('on', likeState.liked);
  b.setAttribute('aria-pressed', likeState.liked ? 'true' : 'false');
  b.setAttribute('aria-label', likeState.liked ? 'Remove from Liked Songs' : 'Add to Liked Songs');
}
async function setupLike(track){
  const b = document.getElementById('likeBtn');
  if(!b) return;
  const uri = track.uri || (track.id ? `spotify:track:${track.id}` : null);
  if(track.is_local || !uri){ return; }
  likeState = { uri, liked: false, needsScope: false };
  b.hidden = false;
  paintLike();

  b.addEventListener('click', async () => {
    if(likeState.needsScope){
      showToast("Reconnecting to Spotify to allow Likes…");
      setTimeout(redirectToAuth, 1000);
      return;
    }
    if(likeState.uri !== uri) return;
    const want = !likeState.liked;
    likeState.liked = want; paintLike();
    b.classList.add('pop'); setTimeout(() => b.classList.remove('pop'), 250);
    b.classList.add('busy');
    try{
      const res = await libCall(want ? 'PUT' : 'DELETE', `?uris=${encodeURIComponent(uri)}`);
      if(res.status === 401 || res.status === 403){
        if(likeState.uri === uri){ likeState.liked = !want; likeState.needsScope = true; paintLike(); }
        showToast("Tap the heart again to allow Likes.");
      } else if(!res.ok){
        if(likeState.uri === uri){ likeState.liked = !want; paintLike(); }
        showToast("Couldn't update Liked Songs.");
      } else {
        showToast(want ? "Added to Liked Songs" : "Removed from Liked Songs");
      }
    } catch(e){
      if(likeState.uri === uri){ likeState.liked = !want; paintLike(); }
      showToast("Couldn't reach Spotify.");
    }
    b.classList.remove('busy');
  });

  try{
    const res = await libCall('GET', `/contains?uris=${encodeURIComponent(uri)}`);
    if(likeState.uri !== uri) return;
    if(res.status === 403 || res.status === 401){ likeState.needsScope = true; return; }
    if(!res.ok) return;
    const arr = await res.json();
    likeState.liked = !!(arr && arr[0]);
    paintLike();
  } catch(e){}
}

/* Click or drag the progress bar to jump to a spot in the song.
   While dragging, the bar/time show a preview; the actual seek request is
   sent once on release. */
let seekPreviewMs = null;
function setupSeeking(){
  const track = document.querySelector('.progress-track');
  if(!track) return;

  const msFromEvent = (e) => {
    const rect = track.getBoundingClientRect();
    const frac = Math.min(1, Math.max(0, (e.clientX - rect.left) / rect.width));
    return Math.round(frac * currentTrackDurationMs);
  };

  track.addEventListener('pointerdown', (e) => {
    if(!currentTrackDurationMs) return;
    track.setPointerCapture(e.pointerId);
    track.classList.add('seeking');
    seekPreviewMs = msFromEvent(e);
  });
  track.addEventListener('pointermove', (e) => {
    if(seekPreviewMs === null) return;
    seekPreviewMs = msFromEvent(e);
  });
  const finish = (e, commit) => {
    if(seekPreviewMs === null) return;
    const ms = commit ? msFromEvent(e) : null;
    seekPreviewMs = null;
    track.classList.remove('seeking');
    if(ms === null) return;
    // optimistic local update so bar + lyrics jump instantly
    lyricsMeta.startMs = ms;
    lyricsMeta.startWallClock = Date.now();
    playerAction('PUT', `/seek?position_ms=${ms}`, `Jumped to ${msToClock(ms)}`);
  };
  track.addEventListener('pointerup', (e) => finish(e, true));
  track.addEventListener('pointercancel', (e) => finish(e, false));
}

/* Runs every animation frame alongside the lyrics sweep. Reads the same
   clock (lyricsMeta), so the progress bar, the time, the play/pause icon,
   and the lyrics all move in lockstep off one source of truth. Every write
   is guarded so it only touches the DOM when the displayed value actually
   changes. */
function updateProgressUI(){
  const fill = document.getElementById('progressFill');
  if(!fill || !currentTrackDurationMs) return;

  let elapsedMs = lyricsMeta.startMs;
  if(lyricsMeta.playing){
    elapsedMs += Date.now() - lyricsMeta.startWallClock;
  }
  if(seekPreviewMs !== null) elapsedMs = seekPreviewMs;
  elapsedMs = Math.max(0, Math.min(elapsedMs, currentTrackDurationMs));

  const pct = (Math.min(100, (elapsedMs / currentTrackDurationMs) * 100)).toFixed(1);
  if(fill.dataset.pct !== pct){
    fill.dataset.pct = pct;
    fill.style.width = pct + '%';
    const thumb = document.getElementById('progressThumb');
    if(thumb) thumb.style.left = pct + '%';
  }

  const timeNow = document.getElementById('timeNow');
  if(timeNow){
    const clock = msToClock(elapsedMs);
    if(timeNow.textContent !== clock) timeNow.textContent = clock;
  }

  const playBtn = document.getElementById('playBtn');
  if(playBtn && playBtn.dataset.playing !== String(lyricsMeta.playing)){
    playBtn.dataset.playing = String(lyricsMeta.playing);
    playBtn.innerHTML = lyricsMeta.playing ? ICON.pause : ICON.play;
    playBtn.setAttribute('aria-label', lyricsMeta.playing ? 'Pause' : 'Play');
  }

  const stateDot = document.getElementById('stateDot');
  const stateText = document.getElementById('stateText');
  if(stateText && stateText.dataset.playing !== String(lyricsMeta.playing)){
    stateText.dataset.playing = String(lyricsMeta.playing);
    stateText.textContent = lyricsMeta.playing ? 'Playing' : 'Paused';
    if(stateDot) stateDot.classList.toggle('paused', !lyricsMeta.playing);
  }
}

/* ---------- lyrics (via lrclib.net - free, open, no key required) ---------- */

/* Parses standard LRC timestamps, e.g. "[00:12.34]Some line", including
   lines with multiple leading timestamps pointing at the same text. */
function parseLRC(lrcText){
  const lines = lrcText.split('\n');
  const tagRe = /\[(\d{2}):(\d{2})(?:\.(\d{1,3}))?\]/g;
  const out = [];
  for(const line of lines){
    const tags = [...line.matchAll(tagRe)];
    if(tags.length === 0) continue;
    const text = line.replace(tagRe, '').trim();
    for(const t of tags){
      const min = parseInt(t[1], 10);
      const sec = parseInt(t[2], 10);
      const msRaw = (t[3] || '0').padEnd(3, '0').slice(0, 3);
      out.push({ time: min * 60 + sec + parseInt(msRaw, 10) / 1000, text });
    }
  }
  return out.sort((a, b) => a.time - b.time);
}

function prepareLines(lines){
  return lines.map(line => ({ time: line.time, text: line.text }));
}

/* fetch with a timeout so a stalled lyrics server can never hang the page */
async function fetchT(url, ms = 8000){
  const ctl = new AbortController();
  const t = setTimeout(() => ctl.abort(), ms);
  try{ return await fetch(url, { signal: ctl.signal }); }
  finally{ clearTimeout(t); }
}

/* "Song (feat. X) - Remastered 2011" -> "Song" so alternate spellings still match */
function cleanTitle(t){
  return (t || '')
    .replace(/\s*[\(\[][^)\]]*(feat|ft\.|with |remaster|live|version|edit|mix|mono|stereo|radio|deluxe|bonus|single)[^)\]]*[\)\]]/gi, '')
    .replace(/\s+-\s+[^-]*(remaster|live|version|edit|mix|mono|stereo|radio|single|deluxe)[^-]*$/i, '')
    .replace(/\s{2,}/g, ' ')
    .trim();
}

/* Picks the best lrclib hit: synced lyrics first, and the closest running time. */
function pickBest(results, durationSec){
  const hits = (results || []).filter(r => r && (r.plainLyrics || r.syncedLyrics));
  if(!hits.length) return null;
  const gap = (r) => (typeof r.duration === 'number' && durationSec) ? Math.abs(r.duration - durationSec) : 999;
  hits.sort((x, y) => (!!y.syncedLyrics - !!x.syncedLyrics) || (gap(x) - gap(y)));
  return hits[0];
}

async function fetchLyricsData(title, artist, album, durationSec){
  const parse = (data) => ({
    plain: data.plainLyrics || null,
    synced: data.syncedLyrics ? parseLRC(data.syncedLyrics) : null
  });
  // 404 just means "not in the database". 5xx / 429 / network errors mean the
  // service is having a moment, so those are reported as transient (not cached).
  const isTransient = (res) => res.status >= 500 || res.status === 429;
  let transient = false;
  const clean = cleanTitle(title);

  // Each source returns lyrics, or null for "not here". Failures just move on to the next one.
  const lrcGet = async (t, withAlbum) => {
    try{
      const q = { track_name: t, artist_name: artist };
      if(withAlbum){ q.album_name = album; q.duration = durationSec; }
      const res = await fetchT(`https://lrclib.net/api/get?${new URLSearchParams(q)}`);
      if(res.ok){ const d = await res.json(); if(d.plainLyrics || d.syncedLyrics) return parse(d); }
      else if(isTransient(res)) transient = true;
    } catch(e){ transient = true; }
    return null;
  };
  const lrcSearch = async (params) => {
    try{
      const res = await fetchT(`https://lrclib.net/api/search?${new URLSearchParams(params)}`);
      if(res.ok){ const hit = pickBest(await res.json(), durationSec); if(hit) return parse(hit); }
      else if(isTransient(res)) transient = true;
    } catch(e){ transient = true; }
    return null;
  };

  let found = await lrcGet(title, true)
    || await lrcSearch({ track_name: title, artist_name: artist });
  if(!found && clean && clean !== title){
    found = await lrcGet(clean, true)
      || await lrcSearch({ track_name: clean, artist_name: artist });
  }
  if(!found) found = await lrcSearch({ q: `${clean || title} ${artist}`.trim() });
  if(found) return found;

  // Backup source (plain text only, no timestamps). Only reached when lrclib has nothing.
  // Failures here are ignored - this is a bonus, never a reason to show an error.
  try{
    const res = await fetchT(`https://api.lyrics.ovh/v1/${encodeURIComponent(artist)}/${encodeURIComponent(clean || title)}`, 8000);
    if(res.ok){
      const d = await res.json();
      let text = (d && d.lyrics || '').replace(/\r\n?/g, '\n').trim();
      text = text.replace(/^Paroles de la chanson[^\n]*\n+/i, '');
      if(text.length > 40) return { plain: text, synced: null, backup: true };
    }
  } catch(e){ /* backup unavailable */ }

  return { plain: null, synced: null, transient };
}

function renderLyricsBox(data){
  const box = document.getElementById('lyricsBox');
  if(!box) return;
  if(data.synced && data.synced.length){
    const lines = data.synced.map((l, i) => {
      const text = escapeHtml(l.text) || '\u266A';
      return `<p class="lyric-line" data-i="${i}">${text}<span class="lyric-tr"></span></p>`;
    }).join('');
    box.innerHTML = `<div class="lyrics-track" id="lyricsTrack">${lines}</div>`;
    // One delegated handler (assigned, not added, so re-renders never stack listeners).
    box.onclick = (e) => {
      const lineEl = e.target.closest('.lyric-line');
      if(!lineEl || !lyricsMeta.lines) return;
      if(document.documentElement.classList.contains('no-premium')) return;
      const line = lyricsMeta.lines[Number(lineEl.dataset.i)];
      if(!line) return;
      // ceil so float rounding can never land a hair before the line's timestamp
      const ms = Math.max(0, Math.ceil(line.time * 1000));
      // optimistic local update so the lyrics + bar jump instantly
      lyricsMeta.startMs = ms;
      lyricsMeta.startWallClock = Date.now();
      playerAction('PUT', `/seek?position_ms=${ms}`, `Jumped to ${msToClock(ms)}`);
    };
  } else if(data.plain){
    const plainLines = data.plain.split('\n').map(l => `<span class="pl">${escapeHtml(l)}<span class="lyric-tr"></span></span>`).join('');
    box.innerHTML = `<div class="lyrics-text">${plainLines}</div>`;
  } else {
    box.innerHTML = '<p class="lyrics-status">Lyrics not found for this track.</p>';
  }
}

function applyLyricsData(data){
  const prepared = data.synced ? prepareLines(data.synced) : null;
  lyricsMeta.lines = prepared;
  lyricsMeta.lastActiveIdx = -1;
  lyricsMeta.lastWordIdx = -1;
  lyricsMeta.currentY = 0;
  renderLyricsBox({ plain: data.plain, synced: prepared });
  // Lyrics that aren't timed (plain) or missing entirely can't scroll, so on a
  // phone in landscape the player takes over the whole screen (CSS below).
  const isStatic = !(prepared && prepared.length);
  document.documentElement.classList.toggle('lyrics-static', isStatic);
  ensureTranslations();
}

/* ---------- lyric translation (any language -> English) ----------
   Uses Google Translate's free public endpoint with auto language detection,
   so it works for every language it supports. English songs are skipped, and
   lines that come back identical (names, "yeah", etc.) show nothing. */
const trCache = {};

function lyricLinesFor(id){
  const d = lyricsCache[id];
  if(!d) return null;
  if(d.synced && d.synced.length) return d.synced.map(l => l.text);
  if(d.plain) return d.plain.split('\n');
  return null;
}
const hasLetters = (t) => /\p{L}/u.test(t);
const normTr = (t) => t.toLowerCase().replace(/[^\p{L}\p{N}]+/gu, ' ').trim();

let trBlockedUntil = 0;

async function gtx(q){
  const url = 'https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=en&dt=t&q=' + encodeURIComponent(q);
  const res = await fetch(url);
  if(!res.ok){ const err = new Error('translate ' + res.status); err.status = res.status; throw err; }
  const data = await res.json();
  const segs = (data[0] || []).filter(sg => sg && sg[0] != null).map(sg => ({ t: sg[0] || '', src: sg[1] || '' }));
  return { segs, lang: data[2] || '' };
}

/* Rebuild one translation per input line from Google's segments. Each source
   line ends in a newline, so a segment whose source ends in one closes a line. */
function alignToLines(segs, n){
  const a = [];
  let cur = '';
  for(const sg of segs){
    cur += sg.t;
    if(/\n\s*$/.test(sg.src)){ a.push(cur.trim()); cur = ''; }
  }
  if(cur.trim() !== '') a.push(cur.trim());
  if(a.length === n) return a;
  const b = segs.map(sg => sg.t).join('').split('\n').map(x => x.trim());
  while(b.length > n && b[b.length - 1] === '') b.pop();
  return b.length === n ? b : null;
}

async function translateLines(texts, depth = 0){
  const r = await gtx(texts.join('\n'));
  const out = alignToLines(r.segs, texts.length);
  if(out) return { out, lang: r.lang };
  if(texts.length > 1 && depth < 3){
    // lines didn't line up: split the batch in half and retry (bounded)
    const mid = Math.ceil(texts.length / 2);
    const first = await translateLines(texts.slice(0, mid), depth + 1);
    const second = await translateLines(texts.slice(mid), depth + 1);
    return { out: first.out.concat(second.out), lang: r.lang || first.lang };
  }
  return { out: texts.map(() => ''), lang: r.lang };
}

/* Cheap offline check so English songs never touch the network. */
const EN_WORDS = new Set(['the','you','and','it','that','is','in','on','my','with','for','of','this','but','got','just','like','your','all','be','we','what','was','are','not','they','when','have','can','if','she','up','out','get','know','now','her','him','i','to','im','dont','aint','yeah']);
function looksEnglish(lines){
  let words = 0, hits = 0;
  for(const l of lines){
    for(const w of l.toLowerCase().split(/[^\p{L}']+/u)){
      if(!w) continue;
      words++;
      if(EN_WORDS.has(w.replace(/'/g, ''))) hits++;
    }
  }
  return words > 0 && hits / words > 0.14;
}

async function buildTranslations(lines){
  const idxs = [];
  lines.forEach((t, i) => { if(hasLetters(t)) idxs.push(i); });
  const tr = new Array(lines.length).fill('');
  // batch lines so each request URL stays a safe length
  const chunks = [];
  let chunk = [];
  let size = 0;
  for(const i of idxs){
    const len = encodeURIComponent(lines[i]).length + 3;
    if(size + len > 1500 && chunk.length){ chunks.push(chunk); chunk = []; size = 0; }
    chunk.push(i);
    size += len;
  }
  if(chunk.length) chunks.push(chunk);
  let lang = '';
  for(let c = 0; c < chunks.length; c++){
    const r = await translateLines(chunks[c].map(i => lines[i]));
    if(c === 0){
      lang = r.lang;
      if(lang === 'en') return { english: true, tr };
    }
    chunks[c].forEach((i, k) => {
      const t = (r.out[k] || '').trim();
      if(t && normTr(t) !== normTr(lines[i])) tr[i] = t;
    });
  }
  return { english: false, lang, tr };
}

/* Finished translations are kept in the browser (last 40 songs) so each song
   only ever needs to be translated once. */
function loadStoredTr(id, n){
  try{
    const all = JSON.parse(localStorage.getItem('np_trc') || '[]');
    const hit = all.find(e => e[0] === id);
    return hit && hit[1] && hit[1].tr && hit[1].tr.length === n ? hit[1] : null;
  } catch(e){ return null; }
}
function saveStoredTr(id, entry){
  try{
    let all = JSON.parse(localStorage.getItem('np_trc') || '[]').filter(e => e[0] !== id);
    all.push([id, entry]);
    if(all.length > 40) all = all.slice(-40);
    localStorage.setItem('np_trc', JSON.stringify(all));
  } catch(e){ /* storage full or blocked - fine */ }
}

function applyTranslations(entry){
  document.querySelectorAll('#lyricsBox .lyric-tr').forEach((el, i) => {
    el.textContent = entry.tr[i] || '';
  });
}

let trBusy = false;
function setTrBusy(v){ trBusy = v; if(typeof syncSettings === 'function') syncSettings(); }

async function ensureTranslations(fromToggle){
  const id = currentTrackId;
  if(!id || !document.documentElement.classList.contains('tr-on')) return;
  if(document.documentElement.classList.contains('lyrics-off')) return;
  const lines = lyricLinesFor(id);
  if(!lines) return;
  if(!trCache[id]){
    const stored = loadStoredTr(id, lines.length);
    if(stored) trCache[id] = stored;
    else if(looksEnglish(lines)) trCache[id] = { english: true, tr: new Array(lines.length).fill('') };
  }
  if(!trCache[id]){
    if(Date.now() < trBlockedUntil){
      showToast('Translation is busy - try again in a couple of minutes.');
      return;
    }
    setTrBusy(true);
    try{
      const entry = await buildTranslations(lines);
      trCache[id] = entry;
      saveStoredTr(id, entry);
    } catch(e){
      const limited = e && (e.status === 429 || e.status === 403);
      if(limited) trBlockedUntil = Date.now() + 120000;
      setTrBusy(false);
      if(currentTrackId === id){
        showToast(limited ? 'Translation is busy - try again in a couple of minutes.' : "Translation isn't available right now.");
      }
      return;
    }
    setTrBusy(false);
  }
  if(currentTrackId !== id) return;
  applyTranslations(trCache[id]);
  if(fromToggle === true && trCache[id].english) showToast('These lyrics are already in English.');
}

function toggleTranslate(){
  const on = document.documentElement.classList.toggle('tr-on');
  try{ localStorage.setItem('np_translate', on ? '1' : '0'); } catch(e){}
  if(on) ensureTranslations(true);
}

async function loadLyricsFor(track, durationMs){
  const id = track.id;
  const durationSec = durationMs / 1000;
  if(lyricsCache[id] !== undefined){ applyLyricsData(lyricsCache[id]); return; }
  const artist = track.artists[0]?.name || '';
  const wait = (ms) => new Promise(r => setTimeout(r, ms));
  for(let attempt = 0; attempt < 3; attempt++){
    const data = await fetchLyricsData(track.name, artist, track.album.name, Math.round(durationSec));
    if(!data.transient){
      lyricsCache[id] = data;
      if(currentTrackId === id){ applyLyricsData(data); }
      return;
    }
    if(currentTrackId !== id) return;
    if(attempt < 2){
      const box = document.getElementById('lyricsBox');
      if(box) box.innerHTML = '<p class="lyrics-status">Lyrics service is busy - retrying…</p>';
      await wait(attempt === 0 ? 3000 : 8000);
      if(currentTrackId !== id) return;
    } else {
      // still down: show the no-lyrics layout for now, but don't cache it so the next load retries
      if(currentTrackId === id) applyLyricsData({ plain: null, synced: null });
    }
  }
}

/* Runs every animation frame (not tied to the 5s poll) for a continuously
   smooth scroll and word sweep, instead of snapping in discrete steps. */
function lyricsFrame(){
  updateProgressUI();
  updateLyrics();
  lyricsRAF = requestAnimationFrame(lyricsFrame);
}
function startLyricsLoop(){
  stopLyricsLoop();
  lyricsRAF = requestAnimationFrame(lyricsFrame);
}
function stopLyricsLoop(){
  if(lyricsRAF){ cancelAnimationFrame(lyricsRAF); lyricsRAF = null; }
}

/* Sets every word in a line to a resting state: fully sung (solid cyan)
   or not yet reached (default dim). Never touches the sweep gradient —
   that's reserved for the single word actively being highlighted. */
/* Sets every word in a line to a resting state by driving the clip width
   directly: 100% = fully sung, 0% = not yet reached. No classes, no custom
   properties, no gradients — just a width. */
function setLineSung(lineEl, sung){
  if(lineEl.dataset.sung === String(sung)) return;
  lineEl.dataset.sung = String(sung);
  lineEl.classList.toggle('sung', sung);
}

function updateLyrics(){
  if(!lyricsMeta.lines || lyricsMeta.lines.length === 0) return;
  const box = document.getElementById('lyricsBox');
  const track = document.getElementById('lyricsTrack');
  if(!box || !track) return;

  let elapsedSec = lyricsMeta.startMs / 1000;
  if(lyricsMeta.playing){
    elapsedSec += (Date.now() - lyricsMeta.startWallClock) / 1000;
  }

  const lines = lyricsMeta.lines;
  let idx = -1;
  for(let i = 0; i < lines.length; i++){
    if(lines[i].time <= elapsedSec) idx = i; else break;
  }
  if(idx < 0) idx = 0;

  const lineEls = track.querySelectorAll('.lyric-line');
  if(idx !== lyricsMeta.lastActiveIdx){
    lineEls.forEach((el, i) => {
      el.classList.toggle('active', i === idx);
      setLineSung(el, i < idx);

      // Distance-based fade replaces the old CSS mask. Only recalculated
      // when the active line changes, so it costs nothing per frame.
      const dist = Math.abs(i - idx);
      const op = Math.max(1 - dist * 0.16, 0.12).toFixed(2);
      if(el.dataset.op !== op){
        el.dataset.op = op;
        el.style.opacity = op;
      }
    });
    lyricsMeta.lastActiveIdx = idx;
  }

  const currentLineEl = lineEls[idx];
  if(currentLineEl){
    // continuous, eased vertical scroll toward centering the active line
    const boxHeight = box.clientHeight;
    const lineTop = currentLineEl.offsetTop;
    const lineHeight = currentLineEl.offsetHeight;
    const targetY = boxHeight / 2 - (lineTop + lineHeight / 2);
    lyricsMeta.currentY += (targetY - lyricsMeta.currentY) * 0.12;
    // Skip the write once the position has effectively settled — avoids
    // repainting every frame while sitting still on a long line.
    const rounded = Math.round(lyricsMeta.currentY * 10) / 10;
    if(lyricsMeta.lastY !== rounded){
      lyricsMeta.lastY = rounded;
      track.style.transform = `translateY(${rounded}px)`;
    }
  }
}

/* ---------- profile ---------- */
async function fetchProfile(){
  try{
    const res = await fetch('https://api.spotify.com/v1/me', {
      headers: { Authorization: `Bearer ${accessToken}` }
    });
    if(!res.ok) return;
    const data = await res.json();
    // Play/pause/skip/seek are Premium-only on Spotify's side, so hide them for free accounts.
    if(data.product){
      const free = data.product !== 'premium';
      document.documentElement.classList.toggle('no-premium', free);
      try{ localStorage.setItem('np_free', free ? '1' : '0'); } catch(e){}
    }
    const chip = document.getElementById('profileChip');
    if(!chip) return;
    const avatar = data.images?.[0]?.url;
    const name = data.display_name || 'Your profile';
    chip.href = data.external_urls?.spotify || '#';
    chip.style.display = 'flex';
    chip.innerHTML = `
      ${avatar ? `<img class="profile-avatar" src="${escapeHtml(avatar)}" alt="">` : `<span class="profile-avatar">${escapeHtml(name.charAt(0).toUpperCase())}</span>`}
      <span class="profile-name">${escapeHtml(name)}</span>
    `;
  } catch(e){ /* leave the chip hidden on failure */ }
}

/* ---------- playback controls ---------- */
async function playerAction(method, path, okMessage, retried){
  try{
    const res = await fetch(`https://api.spotify.com/v1/me/player${path}`, {
      method,
      headers: { Authorization: `Bearer ${accessToken}` }
    });
    if(res.status === 403){
      try{
        const j = await res.json();
        if(j && j.error && j.error.reason === 'PREMIUM_REQUIRED') setFreeAccount(true);
      } catch(e){}
      showToast("That needs Spotify Premium.");
      return;
    }
    if(res.status === 401){
      const stored = localStorage.getItem(REFRESH_KEY);
      if(!retried && stored && await refreshAccessToken(stored)){ return playerAction(method, path, okMessage, true); }
      renderLogin("Session expired — log in again.");
      return;
    }
    if(res.status === 404){ showToast("Open Spotify on a device first."); return; }
    if(!res.ok){ showToast(res.status === 429 ? "Spotify is busy - try again in a moment." : "Spotify couldn't do that."); return; }
    showToast(okMessage);
    setTimeout(tick, 450);
  } catch(e){
    showToast("Couldn't reach Spotify.");
  }
}

let toastTimer = null;
function showToast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('show'), 1800);
}

/* ---------- gradient from album art (two-tone, no storage used) ---------- */
function pickVibrant(pixelData){
  let best = null, bestScore = -1, fallbackR=0, fallbackG=0, fallbackB=0, n=0;
  for(let i=0;i<pixelData.length;i+=4){
    const r=pixelData[i], g=pixelData[i+1], b=pixelData[i+2], a=pixelData[i+3];
    if(a < 100) continue;
    fallbackR+=r; fallbackG+=g; fallbackB+=b; n++;
    const max=Math.max(r,g,b), min=Math.min(r,g,b);
    const lum=(max+min)/2;
    if(lum < 30 || lum > 225) continue;
    const sat = max===0 ? 0 : (max-min)/max;
    if(sat > bestScore){ bestScore = sat; best = [r,g,b]; }
  }
  if(best) return best;
  if(n===0) return [124,58,237];
  return [Math.round(fallbackR/n), Math.round(fallbackG/n), Math.round(fallbackB/n)];
}

function extractGradient(imgUrl){
  if(!imgUrl) return;
  const img = new Image();
  img.crossOrigin = 'Anonymous';
  img.onload = () => {
    try{
      const canvas = document.createElement('canvas');
      canvas.width = 24; canvas.height = 24;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, 24, 24);
      const left = ctx.getImageData(0, 0, 10, 24).data;
      const right = ctx.getImageData(14, 0, 10, 24).data;
      const top = ctx.getImageData(0, 0, 24, 10).data;
      const c1 = pickVibrant(left);
      const c2 = pickVibrant(right);
      const c3 = pickVibrant(top);
      document.documentElement.style.setProperty('--c1', `rgb(${c1[0]},${c1[1]},${c1[2]})`);
      document.documentElement.style.setProperty('--c2', `rgb(${c2[0]},${c2[1]},${c2[2]})`);
      document.documentElement.style.setProperty('--c3', `rgb(${c3[0]},${c3[1]},${c3[2]})`);
    } catch(e){ /* CORS-tainted canvas - keep the current colors */ }
  };
  img.src = imgUrl;
}

/* ---------- polling ---------- */
async function tick(retried){
  try{
    const res = await fetch('https://api.spotify.com/v1/me/player/currently-playing', {
      headers: { Authorization: `Bearer ${accessToken}` }
    });
    if(res.status === 204){ renderIdle(); return; }
    if(res.status === 401){
      const stored = localStorage.getItem(REFRESH_KEY);
      if(!retried && stored && await refreshAccessToken(stored)){ tick(true); return; }
      renderLogin("Session expired — log in again.");
      return;
    }
    // rate limit / server hiccup: keep whatever is on screen and try again next tick
    if(!res.ok) return;
    const data = await res.json();
    if(!data || !data.item){ renderIdle(); return; }
    // local files have no id; give them a stable key so they still render
    if(!data.item.id) data.item.id = data.item.uri || `${data.item.name}|${data.item.artists?.[0]?.name || ''}`;
    renderTrack(data);
    fetchQueue();
    probePremium();
  } catch(e){ /* transient network hiccup - keep current view, retry next tick */ }
}

let queueForTrackId = null;
let lastQueueFetch = 0;
let queueRetryTimer = null;
/* Spotify no longer includes the account type (free/Premium) in the profile for
   Development Mode apps, so detect it another way: send a "set shuffle to what
   it already is" command. It changes nothing, but Spotify rejects it with
   PREMIUM_REQUIRED on free accounts. Runs once per page load. */
function setFreeAccount(free){
  document.documentElement.classList.toggle('no-premium', free);
  try{ localStorage.setItem('np_free', free ? '1' : '0'); } catch(e){}
}
let premiumProbed = false;
let probing = false;
let probeTries = 0;
async function probePremium(){
  if(premiumProbed || probing || probeTries >= 4) return;
  probing = true;
  probeTries++;
  try{
    const headers = { Authorization: `Bearer ${accessToken}` };
    const st = await fetch('https://api.spotify.com/v1/me/player', { headers });
    if(st.status !== 200) return;
    const state = await st.json();
    if(!state || typeof state.shuffle_state !== 'boolean') return;
    const r = await fetch(`https://api.spotify.com/v1/me/player/shuffle?state=${state.shuffle_state}`, { method: 'PUT', headers });
    if(r.status === 200 || r.status === 204){ setFreeAccount(false); premiumProbed = true; }
    else if(r.status === 403){
      let reason = '';
      try{ const j = await r.json(); reason = (j && j.error && j.error.reason) || ''; } catch(e){}
      if(reason === 'PREMIUM_REQUIRED'){ setFreeAccount(true); premiumProbed = true; }
    }
  } catch(e){ /* try again on a later tick */ }
  finally { probing = false; }
}

async function fetchQueue(){
  // Fetch right away on a new song (and once more shortly after, since Spotify's
  // queue often lags a track change); otherwise only refresh every 15s.
  const isNewSong = queueForTrackId !== currentTrackId;
  if(!isNewSong && Date.now() - lastQueueFetch < 15000) return;
  queueForTrackId = currentTrackId;
  lastQueueFetch = Date.now();
  if(isNewSong){
    clearTimeout(queueRetryTimer);
    queueRetryTimer = setTimeout(() => { lastQueueFetch = 0; fetchQueue(); }, 2500);
  }
  try{
    let res = await fetch('https://api.spotify.com/v1/me/player/queue', {
      headers: { Authorization: `Bearer ${accessToken}` }
    });
    if(res.status === 401){
      const stored = localStorage.getItem(REFRESH_KEY);
      if(stored && await refreshAccessToken(stored)){
        res = await fetch('https://api.spotify.com/v1/me/player/queue', {
          headers: { Authorization: `Bearer ${accessToken}` }
        });
      }
    }
    if(!res.ok){
      showUpNextMessage(res.status === 403 ? 'Queue needs Premium' : `Queue unavailable (${res.status})`);
      return;
    }
    const data = await res.json();
    renderUpNext(data.queue && data.queue[0]);
  } catch(e){ /* leave whatever was showing */ }
}

function showUpNextMessage(msg){
  const box = document.getElementById('upNextContent');
  if(box) box.innerHTML = `<p class="up-next-placeholder">${escapeHtml(msg)}</p>`;
}

function renderUpNext(track){
  const box = document.getElementById('upNextContent');
  if(!box) return;
  if(!track){
    box.innerHTML = '<p class="up-next-placeholder">Nothing queued</p>';
    return;
  }
  const images = track.album?.images || [];
  const art = images[images.length - 1]?.url || images[0]?.url || '';
  const artists = (track.artists || []).map(a => a.name).join(', ');
  box.innerHTML = `
    ${art ? `<img class="up-next-art" src="${art}" alt="">` : '<div class="up-next-art"></div>'}
    <div class="up-next-info">
      <p class="up-next-title">${escapeHtml(track.name || '')}</p>
      <p class="up-next-artist">${escapeHtml(artists)}</p>
    </div>
  `;
}

/* ---------- custom uploaded backgrounds ---------- */
const CUSTOM_BG_DB = 'now-playing-backgrounds';
const CUSTOM_BG_STORE = 'items';
let customBgItems = [];
let customBgDbPromise = null;
let customBgObjectUrl = null;

function openCustomBgDb(){
  if(customBgDbPromise) return customBgDbPromise;
  customBgDbPromise = new Promise((resolve, reject) => {
    if(!('indexedDB' in window)){ reject(new Error('IndexedDB is not available')); return; }
    const req = indexedDB.open(CUSTOM_BG_DB, 1);
    req.onupgradeneeded = () => {
      const db = req.result;
      if(!db.objectStoreNames.contains(CUSTOM_BG_STORE)) db.createObjectStore(CUSTOM_BG_STORE, {keyPath:'id'});
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error || new Error('Could not open background storage'));
  });
  return customBgDbPromise;
}
async function customBgAll(){
  const db = await openCustomBgDb();
  return new Promise((resolve, reject) => {
    const req = db.transaction(CUSTOM_BG_STORE, 'readonly').objectStore(CUSTOM_BG_STORE).getAll();
    req.onsuccess = () => resolve((req.result || []).sort((a,b) => (a.createdAt||0) - (b.createdAt||0)));
    req.onerror = () => reject(req.error);
  });
}
async function customBgPut(item){
  const db = await openCustomBgDb();
  return new Promise((resolve, reject) => {
    const req = db.transaction(CUSTOM_BG_STORE, 'readwrite').objectStore(CUSTOM_BG_STORE).put(item);
    req.onsuccess = () => resolve();
    req.onerror = () => reject(req.error);
  });
}
async function customBgDelete(id){
  const db = await openCustomBgDb();
  return new Promise((resolve, reject) => {
    const req = db.transaction(CUSTOM_BG_STORE, 'readwrite').objectStore(CUSTOM_BG_STORE).delete(id);
    req.onsuccess = () => resolve();
    req.onerror = () => reject(req.error);
  });
}
function customBgName(name){
  const base = String(name || 'Background').replace(/\.[^.]+$/, '');
  return base.slice(0, 28) || 'Background';
}
function customBgSelected(){
  try{ return localStorage.getItem('np_custom_bg') || ''; } catch(e){ return ''; }
}
function saveCustomBgSelected(id){
  try{ if(id) localStorage.setItem('np_custom_bg', id); else localStorage.removeItem('np_custom_bg'); } catch(e){}
}
function setCustomBgOff(save=true){
  document.documentElement.removeAttribute('data-custom-bg');
  saveCustomBgSelected('');
  const el = document.getElementById('customBg');
  if(el) el.innerHTML = '';
  if(save) syncSettings();
}
async function useCustomBg(id, save=true){
  const item = customBgItems.find(x => x.id === id);
  if(!item){ setCustomBgOff(save); return; }
  document.documentElement.setAttribute('data-custom-bg','1');
  document.documentElement.removeAttribute('data-bg');
  const el = document.getElementById('customBg');
  if(!el) return;
  if(customBgObjectUrl) URL.revokeObjectURL(customBgObjectUrl);
  customBgObjectUrl = URL.createObjectURL(item.blob);
  el.innerHTML = '';
  const media = document.createElement(item.kind === 'video' ? 'video' : 'img');
  media.src = customBgObjectUrl;
  media.className = item.kind === 'video' ? '' : '';
  if(item.kind === 'video'){
    media.autoplay = true; media.muted = true; media.loop = true; media.playsInline = true;
    media.play().catch(()=>{});
  } else media.alt = '';
  el.appendChild(media);
  if(save) saveCustomBgSelected(id);
  syncSettings();
}
function renderCustomBgGrid(){
  const grid = document.getElementById('customBgGrid');
  const empty = document.getElementById('customBgEmpty');
  if(!grid || !empty) return;
  grid.innerHTML = '';
  empty.style.display = customBgItems.length ? 'none' : 'block';
  customBgItems.forEach(item => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'custom-tile'; b.dataset.customBg = item.id;
    b.setAttribute('aria-checked', item.id === customBgSelected() ? 'true' : 'false');
    b.title = item.name;
    const media = document.createElement(item.kind === 'video' ? 'video' : 'img');
    media.className = 'custom-thumb';
    media.src = URL.createObjectURL(item.blob);
    if(item.kind === 'video'){
      media.muted = true; media.loop = true; media.autoplay = true; media.playsInline = true;
      media.addEventListener('loadeddata', () => media.play().catch(()=>{}), {once:true});
    } else media.alt = '';
    const name = document.createElement('span');
    name.className = 'custom-name'; name.textContent = item.name;
    const del = document.createElement('span');
    del.className = 'custom-delete'; del.setAttribute('role','button'); del.setAttribute('aria-label','Delete '+item.name); del.textContent = '×';
    b.append(media,name,del); grid.appendChild(b);
  });
}
async function loadCustomBackgrounds(){
  try{
    customBgItems = await customBgAll();
    renderCustomBgGrid();
    const selected = customBgSelected();
    if(selected && customBgItems.some(x => x.id === selected)) await useCustomBg(selected, false);
    else if(selected) saveCustomBgSelected('');
    syncSettings();
  }catch(e){ console.warn('Custom background storage unavailable', e); }
}
async function addCustomBackgroundFiles(files){
  const list = Array.from(files || []);
  for(const file of list){
    if(!/^image\//.test(file.type) && !/^video\//.test(file.type)) continue;
    const item = {
      id:'cb-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,8),
      name:customBgName(file.name), kind:file.type.startsWith('video/')?'video':'image',
      type:file.type, size:file.size, createdAt:Date.now(), blob:file
    };
    try{ await customBgPut(item); customBgItems.push(item); }
    catch(e){ console.warn('Could not store background',e); }
  }
  renderCustomBgGrid();
  if(list.length && customBgItems.length) await useCustomBg(customBgItems[customBgItems.length-1].id,true);
}
async function deleteCustomBackground(id){
  const item = customBgItems.find(x => x.id === id);
  if(!item) return;
  const selected = customBgSelected() === id;
  try{ await customBgDelete(id); }catch(e){ return; }
  customBgItems = customBgItems.filter(x => x.id !== id);
  if(selected){
    const next = customBgItems[customBgItems.length-1];
    if(next) await useCustomBg(next.id,true); else setCustomBgOff(true);
  }
  renderCustomBgGrid(); syncSettings();
}

function mulberry(a){ return function(){ a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function buildSkyline(kind){
  const T = kind === 'tokyo', Y = 420, r = mulberry(T ? 11 : 5);
  let o = `<defs><pattern id="${kind}A" width="24" height="30" patternUnits="userSpaceOnUse"><rect class="win" x="4" y="5" width="7" height="10" rx="1.5"/><rect class="win" x="14" y="5" width="7" height="10" rx="1.5"/><rect class="win" x="4" y="18" width="7" height="8" rx="1.5"/></pattern><pattern id="${kind}B" width="20" height="26" patternUnits="userSpaceOnUse"><rect class="win" x="3" y="4" width="6" height="9" rx="1.5"/><rect class="win" x="11" y="4" width="6" height="9" rx="1.5"/><rect class="win" x="11" y="15" width="6" height="8" rx="1.5"/></pattern></defs>`;
  const reserved = T ? [[500, 640, 120], [1120, 1240, 120], [700, 1020, 165]] : [];
  const neonCols = ['var(--c1)', 'var(--c2)', 'var(--c3, var(--lime))'];
  let neon = '', nIdx = 0;
  const layer = (cls, minW, maxW, minH, maxH, gap, win, signs) => {
    let x = -30, g = `<g class="${cls}">`;
    while(x < 1640){
      const w = Math.round(minW + r() * (maxW - minW));
      let h = Math.round(minH + r() * (maxH - minH));
      const cx = x + w / 2;
      const zone = reserved.find(z => cx > z[0] && cx < z[1]); if(zone) h = Math.min(h, zone[2]);
      g += `<rect x="${x}" y="${Y - h}" width="${w}" height="${h + 2}"/>`;
      if(r() < .35 && w > 34){
        const w2 = Math.round(w * .55), h2 = Math.round(14 + r() * 30);
        g += `<rect x="${x + Math.round((w - w2) / 2)}" y="${Y - h - h2}" width="${w2}" height="${h2 + 2}"/>`;
        if(T && r() < .5) g += `<rect x="${x + w / 2 - 1}" y="${Y - h - h2 - 22}" width="2" height="24"/>`;
      }
      if(win && w >= 30){
        g += `<rect class="wg" x="${x + 5}" y="${Y - h + 8}" width="${w - 10}" height="${Math.max(10, h - 16)}" style="fill:url(#${kind}${r() < .5 ? 'A' : 'B'});--d:${(5 + r() * 5).toFixed(1)}s;animation-delay:-${(r() * 8).toFixed(1)}s"/>`;
      }
      if(signs && T && w >= 52 && h > 140 && r() < .55){
        const col = neonCols[nIdx++ % 3], sh = Math.round(34 + r() * 34), sy = Y - h + 26;
        neon += `<g style="--nc:${col}"><rect class="ng" x="${x + w - 15}" y="${sy - 6}" width="16" height="${sh + 12}" rx="8"/><rect class="ns${r() < .5 ? ' f' : ''}" x="${x + w - 11}" y="${sy}" width="7" height="${sh}" rx="3.5" style="--dl:-${(r() * 7).toFixed(1)}s"/></g>`;
      }
      x += w + Math.round(r() * gap);
    }
    return g + '</g>';
  };
  if(T){
    const fx = 860;
    o += `<path class="fj" d="M${fx - 360} ${Y} Q ${fx - 130} ${Y - 150} ${fx - 54} ${Y - 232} Q ${fx} ${Y - 248} ${fx + 54} ${Y - 232} Q ${fx + 130} ${Y - 150} ${fx + 360} ${Y} Z"/>`;
    o += `<path class="fs" d="M${fx - 62} ${Y - 226} Q ${fx} ${Y - 250} ${fx + 62} ${Y - 226} L ${fx + 46} ${Y - 206} L ${fx + 31} ${Y - 219} L ${fx + 15} ${Y - 198} L ${fx} ${Y - 217} L ${fx - 16} ${Y - 196} L ${fx - 31} ${Y - 217} L ${fx - 47} ${Y - 204} Z"/>`;
  }
  o += layer('ly-far', 40, 90, 70, T ? 200 : 170, 10, false, false);
  o += layer('ly-mid', T ? 38 : 44, T ? 84 : 100, 110, T ? 290 : 250, 12, true, false);
  if(T){
    // Tokyo-Tower-style lattice tower
    const tx = 560, legX = (y) => { const pts = [[420, 46], [236, 9], [168, 6], [62, 0]]; for(let i = 0; i < pts.length - 1; i++){ const a = pts[i], b = pts[i + 1]; if(y <= a[0] && y >= b[0]) return a[1] + (b[1] - a[1]) * (a[0] - y) / (a[0] - b[0]); } return 0; };
    let tw = `<g class="tower"><path class="tw-l" d="M${tx - 46} ${Y} L${tx - 9} 236 L${tx - 6} 168 L${tx} 62 L${tx + 6} 168 L${tx + 9} 236 L${tx + 46} ${Y}"/>`;
    const lv = [420, 340, 276, 220, 170, 120];
    for(let i = 0; i < lv.length - 1; i++){
      const y1 = lv[i], y2 = lv[i + 1], a = legX(y1), b = legX(y2);
      tw += `<path class="tw-l" style="stroke-width:1.6" d="M${tx - a} ${y1} L${tx + b} ${y2} M${tx + a} ${y1} L${tx - b} ${y2}"/>`;
    }
    tw += `<rect class="tw-d" x="${tx - 24}" y="288" width="48" height="8" rx="2"/><rect class="tw-d" x="${tx - 14}" y="214" width="28" height="7" rx="2"/><path class="tw-l" style="stroke-width:1.6" d="M${tx} 62 L${tx} 38"/><circle class="tw-b" cx="${tx}" cy="36" r="3"/></g>`;
    // Skytree-style spire
    const sx = 1180;
    tw += `<g class="skytree"><path class="sk-t" d="M${sx - 17} ${Y} L${sx - 6} 210 L${sx - 5} 150 L${sx - 2.5} 118 L${sx - 1} 36 L${sx + 1} 36 L${sx + 2.5} 118 L${sx + 5} 150 L${sx + 6} 210 L${sx + 17} ${Y} Z"/><rect class="sk-t" x="${sx - 13}" y="168" width="26" height="11" rx="4"/><rect class="sk-t" x="${sx - 9}" y="138" width="18" height="7" rx="3"/><line class="sk-led" x1="${sx}" y1="190" x2="${sx}" y2="${Y}"/></g>`;
    o += tw;
  }
  o += layer('ly-front', T ? 40 : 54, T ? 92 : 120, T ? 170 : 150, T ? 360 : 330, T ? 6 : 14, true, true);
  o += neon;
  if(T){
    let pil = '';
    for(let x = 10; x < 1620; x += 70) pil += `<rect class="pil" x="${x}" y="392" width="4" height="14"/>`;
    o += `<g class="viaduct">${pil}<rect class="rail" x="-10" y="388" width="1620" height="5"/><g class="trn"><rect class="tb" x="40" y="374" width="250" height="13" rx="5"/>${[0,1,2,3,4,5,6,7,8].map(i => `<rect class="tw" x="${54 + i * 26}" y="377" width="16" height="5" rx="1.5"/>`).join('')}</g></g>`;
  }
  o += `<rect class="road" x="-10" y="404" width="1620" height="20"/>`;
  const nCars = T ? 5 : 8;
  for(let i = 0; i < nCars; i++){
    const x0 = Math.round(r() * 1500), y = i % 2 ? 413 : 408, rev = i % 3 === 0 ? 'animation-direction:reverse;' : '';
    o += `<g class="car" style="--a:${-x0 - 90}px;--b:${1700 - x0}px;--d:${(12 + r() * 10).toFixed(1)}s;animation-delay:-${(r() * 20).toFixed(1)}s;${rev}"><rect class="cg" x="${x0 - 5}" y="${y - 3}" width="34" height="9" rx="4.5"/><rect class="cb" x="${x0}" y="${y}" width="22" height="4.5" rx="2.2"/></g>`;
  }
  return o;
}

function syncSettings(){

    const el = document.getElementById(id);
