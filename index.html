<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Now Playing">
<meta name="theme-color" content="#14101F">
<title>Now Playing</title>
<link rel="icon" type="image/jpeg" href="Sky.jpeg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Inter:wght@400;500;600;700&family=Onest:wght@400..800&display=swap" rel="stylesheet">
<style>
  :root{
    --c1: #FF3D81;
    --c2: #7C3AED;
    --ink: #14101F;
    --paper: #FFF9F0;
    --lime: #C6FF3D;
  }
  *{ box-sizing: border-box; margin: 0; padding: 0; }
  html{ height: 100%; background: var(--ink); }
  body{
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    color: var(--paper);
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    background: var(--ink);
    /* keep content out of the notch / home-indicator areas while the
       background still fills the whole screen (viewport-fit=cover) */
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    overflow-x: hidden;
    position: relative;
  }

  /* ---------- moving background ---------- */
  .bg-blobs{
    position: fixed;
    inset: 0;
    overflow: hidden;
    z-index: 0;
    filter: blur(90px);
  }
  .blob{
    position: absolute;
    border-radius: 50%;
    mix-blend-mode: screen;
    transition: background 1.2s ease;
  }
  .blob-a{
    width: 60vmax; height: 60vmax;
    top: -22%; left: -18%;
    background: var(--c1);
    opacity: .8;
    animation: floatA 28s ease-in-out infinite alternate;
  }
  .blob-b{
    width: 54vmax; height: 54vmax;
    bottom: -26%; right: -14%;
    background: var(--c2);
    opacity: .75;
    animation: floatB 34s ease-in-out infinite alternate;
  }
  .blob-c{
    width: 40vmax; height: 40vmax;
    top: 28%; left: 38%;
    background: var(--c3, var(--lime));
    opacity: .4;
    animation: floatC 22s ease-in-out infinite alternate;
  }
  @keyframes floatA{
    0%{ transform: translate(0,0) scale(1); }
    100%{ transform: translate(12vw,14vh) scale(1.18); }
  }
  @keyframes floatB{
    0%{ transform: translate(0,0) scale(1); }
    100%{ transform: translate(-14vw,-10vh) scale(1.12); }
  }
  @keyframes floatC{
    0%{ transform: translate(0,0) scale(1); }
    100%{ transform: translate(9vw,-14vh) scale(0.88); }
  }
  @media (prefers-reduced-motion: reduce){
    .blob{ animation: none !important; }
  }

  .stage{
    width: 100%;
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 48px 40px 60px;
    max-width: 1180px;
    margin: 0 auto;
  }

  .layout{
    display: flex;
    align-items: flex-start;
    gap: 56px;
    width: 100%;
  }
  .main-col{
    flex: 1 1 380px;
    min-width: 0;
    max-width: 420px;
  }
  .lyrics-col{
    width: 460px;
    flex-shrink: 0;
    position: sticky;
    top: 40px;
  }
  @media (max-width: 900px){
    .layout{ flex-direction: column; }
    .main-col{ max-width: none; width: 100%; }
    .lyrics-col{ width: 100%; position: static; }
  }

  /* ---------- login / idle ---------- */
  .kicker{
    font-size: 15px;
    font-weight: 500;
    color: var(--paper);
    opacity: .8;
    margin-bottom: 10px;
  }
  .big-headline{
    font-family: 'Bricolage Grotesque', sans-serif;
    font-weight: 800;
    font-size: clamp(40px, 9vw, 68px);
    line-height: 1.02;
    letter-spacing: -0.02em;
    margin-bottom: 22px;
  }
  .sub{
    font-size: 16px;
    line-height: 1.6;
    opacity: .85;
    max-width: 380px;
    margin-bottom: 32px;
  }
  button.cta{
    align-self: flex-start;
    background: var(--paper);
    color: var(--ink);
    border: none;
    padding: 16px 30px;
    border-radius: 999px;
    font-weight: 700;
    font-size: 15px;
    font-family: inherit;
    cursor: pointer;
    transition: transform .15s ease, background .15s ease;
  }
  button.cta:hover{ background: var(--lime); }
  button.cta:active{ transform: scale(.97); }
  button.cta:focus-visible{ outline: 2px solid var(--paper); outline-offset: 3px; }

  /* ---------- now playing ---------- */
  .art-card{
    width: 216px;
    height: 216px;
    border-radius: 30px;
    overflow: hidden;
    box-shadow: 0 24px 48px -18px rgba(0,0,0,.55);
    margin-bottom: 28px;
    background: rgba(255,255,255,.08);
    flex-shrink: 0;
    /* Stable, permanent layer promotion (created once, never torn down)
       so the artwork isn't caught up in the lyrics repaints. */
    transform: translateZ(0);
    will-change: transform;
  }
  .art-card img{ width: 100%; height: 100%; object-fit: cover; display: block; }

  .track-title{
    font-family: -apple-system, BlinkMacSystemFont, 'Onest', sans-serif;
    font-weight: 800;
    font-size: clamp(26px, 5.5vw, 40px);
    line-height: 1.1;
    letter-spacing: -0.01em;
    margin-bottom: 10px;
    word-break: break-word;
  }
  .track-artist{
    font-size: 17px;
    font-weight: 500;
    opacity: .82;
    margin-bottom: 30px;
  }

  .progress{
    width: 100%;
    max-width: 420px;
    margin-bottom: 10px;
  }
  .progress-track{
    position: relative;
    height: 6px;
    background: rgba(255,255,255,.22);
    border-radius: 6px;
    cursor: pointer;
    touch-action: none;
    -webkit-user-select: none; user-select: none;
  }
  /* invisible taller hit area so the thin bar is easy to tap/drag */
  .progress-track::before{
    content: '';
    position: absolute;
    left: 0; right: 0; top: -14px; bottom: -14px;
  }
  .progress-thumb{
    position: absolute;
    top: 50%; left: 0;
    width: 14px; height: 14px;
    margin: -7px 0 0 -7px;
    border-radius: 50%;
    background: var(--paper);
    box-shadow: 0 2px 6px rgba(0,0,0,.35);
    transform: scale(0);
    transition: transform .15s ease;
    pointer-events: none;
  }
  .progress-track:hover .progress-thumb,
  .progress-track.seeking .progress-thumb{ transform: scale(1); }
  .progress-fill{
    position: absolute;
    top: 0; left: 0; height: 100%;
    background: var(--paper);
    border-radius: 6px;
    width: 0%;
  }
  .time-row{
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    opacity: .7;
    font-variant-numeric: tabular-nums;
    max-width: 420px;
    margin-bottom: 30px;
  }

  .controls{
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 18px;
  }
  .ctrl-btn{
    width: 56px;
    height: 56px;
    border-radius: 50%;
    border: none;
    background: rgba(255,255,255,.14);
    color: var(--paper);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: background .15s ease, transform .12s ease;
    flex-shrink: 0;
  }
  .ctrl-btn:hover{ background: rgba(255,255,255,.26); }
  .ctrl-btn:active{ transform: scale(.92); }
  .ctrl-btn:focus-visible{ outline: 2px solid var(--paper); outline-offset: 3px; }
  .ctrl-btn.main{
    width: 64px; height: 64px;
    background: var(--paper);
    color: var(--ink);
  }
  .ctrl-btn.main:hover{ background: var(--lime); }
  .ctrl-btn svg{ width: 22px; height: 22px; }
  .ctrl-btn.main svg{ width: 24px; height: 24px; }

  .state-label{
    font-size: 13px;
    font-weight: 500;
    opacity: .7;
    display: flex;
    align-items: center;
    gap: 7px;
  }
  .state-label .dot{
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--lime);
  }
  .state-label .dot.paused{ background: var(--paper); opacity: .5; }

  .up-next{
    margin-top: 26px;
    max-width: 420px;
  }
  .up-next-label{
    font-size: 13px;
    font-weight: 600;
    opacity: .7;
    margin-bottom: 8px;
  }
  .up-next-content{
    display: flex;
    align-items: center;
    gap: 12px;
    background: rgba(255,255,255,.08);
    border-radius: 16px;
    padding: 10px 14px;
    min-height: 44px;
  }
  .up-next-art{
    width: 44px;
    height: 44px;
    border-radius: 8px;
    object-fit: cover;
    flex-shrink: 0;
    background: rgba(255,255,255,.1);
  }
  .up-next-info{ min-width: 0; }
  .up-next-title{
    font-size: 14px;
    font-weight: 700;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .up-next-artist{
    font-size: 12px;
    opacity: .65;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .up-next-placeholder{
    font-size: 13px;
    opacity: .55;
  }

  /* ---------- lyrics (big, synced, word-level sweep) ---------- */
  .section-label{
    font-size: 14px;
    font-weight: 600;
    opacity: .8;
    margin: 0 0 16px;
  }
  .lyrics-box{
    position: relative;
    height: min(66vh, 600px);
    overflow: hidden;
  }
  /* NOTE: deliberately no mask-image here. A CSS mask on a container whose
     child transform updates every frame forces a full re-rasterize of the
     masked layer each frame, which was the main cause of the glitching
     (and the repaint pressure bleeding into the artwork). The soft edge is
     done with per-line opacity instead, set only when the active line
     changes rather than every frame. */
  .lyrics-track{
    position: absolute;
    left: 0; right: 0; top: 0;
    will-change: transform;
  }
  .lyrics-text{
    font-family: 'Inter', sans-serif;
    font-size: 18px;
    line-height: 1.8;
    white-space: pre-line;
    opacity: .92;
  }
  .lyrics-status{
    font-size: 15px;
    opacity: .6;
  }
  .lyric-line{
    margin: 0;
    padding: 10px 0;
    font-family: -apple-system, BlinkMacSystemFont, 'Onest', sans-serif;
    font-size: 30px;
    font-weight: 800;
    line-height: 1.45;
    color: rgba(255,255,255,.3);
    transition: font-size .35s ease, opacity .5s ease, color .3s ease;
    cursor: pointer;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  .lyric-line:not(.active):not(.sung):hover{
    color: rgba(255,255,255,.65);
  }
  .lyric-line.active{
    font-size: 38px;
    color: rgba(255,255,255,.92);
    text-shadow: 0 0 4px rgba(255,255,255,.5), 0 0 12px rgba(255,255,255,.28);
  }
  .lyric-line.sung{
    color: var(--paper);
  }

  /* ---------- top bar: profile + logout ---------- */
  .topbar{
    position: fixed;
    top: calc(20px + env(safe-area-inset-top));
    right: calc(20px + env(safe-area-inset-right));
    display: flex;
    align-items: center;
    gap: 10px;
    z-index: 10;
  }
  .profile-chip{
    display: none;
    align-items: center;
    gap: 11px;
    background: rgba(255,255,255,.14);
    padding: 7px 20px 7px 7px;
    border-radius: 999px;
    text-decoration: none;
    color: var(--paper);
    font-size: 16px;
    font-weight: 600;
    max-width: 260px;
    transition: background .15s ease;
  }
  .profile-chip:hover{ background: rgba(255,255,255,.26); }
  .profile-avatar{
    width: 42px;
    height: 42px;
    border-radius: 50%;
    object-fit: cover;
    background: rgba(255,255,255,.25);
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
  }
  .profile-name{
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .logout-btn{
    background: rgba(255,255,255,.14);
    color: var(--paper);
    border: none;
    padding: 13px 22px;
    border-radius: 999px;
    font-family: inherit;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: background .15s ease;
  }
  .logout-btn:hover{ background: rgba(255,255,255,.26); }

  .toast{
    position: fixed;
    bottom: 28px;
    left: 50%;
    transform: translateX(-50%) translateY(12px);
    background: var(--ink);
    color: var(--paper);
    padding: 12px 20px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 500;
    opacity: 0;
    pointer-events: none;
    transition: opacity .25s ease, transform .25s ease;
    max-width: 90vw;
    text-align: center;
    z-index: 10;
  }
  .toast.show{
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  @media (max-width: 420px){
    .stage{ padding: 36px 22px 50px; }
    .art-card{ width: 160px; height: 160px; }
    .lyric-line{ font-size: 24px; }
  }

  /* ---------- manual mobile layout (View button) ---------- */
  .view-btn,
  .lyr-btn,
  .cur-btn{
    background: rgba(255,255,255,.14);
    color: var(--paper);
    border: none;
    padding: 13px 22px;
    border-radius: 999px;
    font-family: inherit;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: background .15s ease;
  }
  .view-btn:hover,
  .lyr-btn:hover,
  .cur-btn:hover{ background: rgba(255,255,255,.26); }
  @media (max-width: 900px){
    html:not(.mobile) .view-btn{ display: none; }
  }
  html.mobile .stage{ max-width: 460px; padding: 72px 20px 44px; justify-content: flex-start; }
  html.mobile .layout{ flex-direction: column; align-items: stretch; gap: 28px; }
  html.mobile .main-col{ flex: none; max-width: none; width: 100%; }
  html.mobile .lyrics-col{ width: 100%; position: static; }
  html.mobile .art-card{ width: min(64vw, 240px); height: min(64vw, 240px); margin-left: auto; margin-right: auto; }
  html.mobile .lyric-line{ font-size: 24px; }
  html.mobile .lyrics-box{ height: 52vh; }
  html.mobile .topbar{ top: calc(12px + env(safe-area-inset-top)); right: calc(12px + env(safe-area-inset-right)); gap: 8px; }
  html.mobile .profile-chip{ padding: 5px; }
  html.mobile .profile-name{ display: none; }
  html.mobile .toast{ max-width: 90vw; }



  /* ---------- hide-mouse (PC only): cursor disappears when it stops moving ---------- */
  .cur-btn{
    display: none;
    width: 46px; height: 46px; padding: 0;
    align-items: center; justify-content: center;
    border-radius: 50%;
  }
  @media (hover: hover) and (pointer: fine){
    .cur-btn{ display: inline-flex; }
  }
  .cur-btn svg{ width: 22px; height: 22px; }
  .cur-slash{ display: none; }
  html.hide-cursor .cur-slash{ display: inline; }
  html.hide-cursor .cur-btn{ background: rgba(255,255,255,.9); color: #14101F; }
  html.hide-cursor .cur-btn:hover{ background: #fff; }
  html.mobile .cur-btn{ width: 40px; height: 40px; }
  html.mobile .cur-btn svg{ width: 19px; height: 19px; }
  html.cursor-idle,
  html.cursor-idle *{ cursor: none !important; }

  /* ---------- log out / view: round icon buttons like the others ---------- */
  .logout-btn,
  .view-btn{
    width: 46px; height: 46px; padding: 0;
    display: inline-flex; align-items: center; justify-content: center;
    border-radius: 50%;
  }
  .logout-btn svg,
  .view-btn svg{ width: 22px; height: 22px; }
  html.mobile .logout-btn,
  html.mobile .view-btn{ width: 40px; height: 40px; }
  html.mobile .logout-btn svg,
  html.mobile .view-btn svg{ width: 19px; height: 19px; }

  /* ---------- lyrics on/off icon button ---------- */
  .lyr-btn{
    width: 46px; height: 46px; padding: 0;
    display: inline-flex; align-items: center; justify-content: center;
    border-radius: 50%;
  }
  .lyr-btn svg{ width: 22px; height: 22px; }
  .lyr-slash{ display: none; }
  html.lyrics-off .lyr-slash{ display: inline; }
  html:not(.lyrics-off) .lyr-btn{ background: rgba(255,255,255,.9); color: #14101F; }
  html:not(.lyrics-off) .lyr-btn:hover{ background: #fff; }
  html.mobile .lyr-btn{ width: 40px; height: 40px; }
  html.mobile .lyr-btn svg{ width: 19px; height: 19px; }

  /* ---------- lyrics hidden by choice (icon button, all devices): the player fills the screen ---------- */
  html.lyrics-off .lyrics-col{ display: none; }
  html.lyrics-off .stage{ max-width: none; padding: 80px 5vw 4vh; }
  html.lyrics-off .layout{ justify-content: center; align-items: center; }
  html.lyrics-off .main-col{ flex: none; width: 100%; max-width: min(92vw, 760px); margin: 0 auto; text-align: center; }
  html.lyrics-off .art-card{
    width: min(86vw, 46vh); height: min(86vw, 46vh);
    margin: 0 auto 4vh; border-radius: clamp(24px, 5vw, 44px);
  }
  html.lyrics-off .track-title{ font-size: clamp(28px, 6.5vw, 64px); }
  html.lyrics-off .track-artist{ font-size: clamp(17px, 3vw, 28px); margin-bottom: 3.5vh; }
  html.lyrics-off .progress,
  html.lyrics-off .time-row{ max-width: none; }
  html.lyrics-off .progress-track{ height: 8px; }
  html.lyrics-off .time-row{ font-size: clamp(12px, 2vw, 18px); margin-bottom: 3vh; }
  html.lyrics-off .controls{ gap: clamp(16px, 3vw, 32px); justify-content: center; margin-bottom: 3vh; }
  html.lyrics-off .state-label{ justify-content: center; }
  html.lyrics-off .ctrl-btn{ width: clamp(56px, 9vw, 84px); height: clamp(56px, 9vw, 84px); }
  html.lyrics-off .ctrl-btn.main{ width: clamp(68px, 11vw, 104px); height: clamp(68px, 11vw, 104px); }
  html.lyrics-off .ctrl-btn svg{ width: 36%; height: 36%; }
  html.lyrics-off .ctrl-btn.main svg{ width: 40%; height: 40%; }

  /* Tablets, laptops and desktops sideways: big art on the left, everything else beside it. */
  @media (orientation: landscape) and (min-height: 521px){
    html.lyrics-off .stage{ padding: 80px 6vw 5vh; }
    html.lyrics-off .layout{ height: calc(100dvh - 80px - 5vh - env(safe-area-inset-top) - env(safe-area-inset-bottom)); }
    html.lyrics-off .main-col{
      max-width: none; margin: 0; width: 100%;
      display: grid; grid-template-columns: auto minmax(0, 1fr);
      column-gap: 5vw; align-content: center; text-align: left;
    }
    html.lyrics-off .main-col > *{ grid-column: 2; }
    html.lyrics-off .art-card{
      grid-column: 1; grid-row: 1 / span 8; align-self: center;
      width: min(66vh, 42vw); height: min(66vh, 42vw); margin: 0;
    }
    html.lyrics-off .track-title{ font-size: clamp(30px, 4.6vw, 76px); }
    html.lyrics-off .track-artist{ font-size: clamp(18px, 2vw, 32px); }
    html.lyrics-off .controls,
    html.lyrics-off .state-label{ justify-content: flex-start; }
  }

  /* ---------- phone in landscape: playback left, lyrics right ---------- */
  @media (orientation: landscape) and (max-height: 520px){
    .stage{ max-width: none; padding: 56px 20px 12px; justify-content: flex-start; }
    .layout{ flex-direction: row; align-items: stretch; gap: 24px; height: calc(100dvh - 68px - env(safe-area-inset-top) - env(safe-area-inset-bottom)); }
    .main-col{ flex: 0 0 36%; max-width: none; width: auto; overflow-y: auto; scrollbar-width: none; }
    .main-col::-webkit-scrollbar{ display: none; }
    .lyrics-col{ flex: 1 1 auto; width: auto; position: static; min-width: 0; }
    .art-card{ width: min(20vh, 90px); height: min(20vh, 90px); border-radius: 16px; margin: 0 0 8px; }
    .track-title{ font-size: clamp(18px, 3.4vw, 24px); margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .track-artist{ white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .lyrics-box{ height: calc(100dvh - 116px - env(safe-area-inset-top) - env(safe-area-inset-bottom)); }
    .lyric-line{ font-size: 22px; }
    .topbar{ top: calc(10px + env(safe-area-inset-top)); right: calc(12px + env(safe-area-inset-right)); gap: 8px; }
    .track-artist{ font-size: 14px; margin-bottom: 10px; }
    .time-row{ margin-bottom: 8px; }
    .controls{ margin-bottom: 8px; gap: 10px; }
    .ctrl-btn{ width: 42px; height: 42px; }
    .ctrl-btn.main{ width: 50px; height: 50px; }
    .up-next{ margin-top: 6px; display: flex; align-items: center; gap: 8px; }
    .up-next-label{ margin: 0; font-size: 11px; white-space: nowrap; }
    .up-next-content{ flex: 1; min-width: 0; padding: 5px 8px; min-height: 0; border-radius: 10px; gap: 8px; }
    .up-next-art{ width: 28px; height: 28px; border-radius: 6px; }
    .up-next-info{ display: flex; align-items: baseline; gap: 6px; flex: 1; }
    .up-next-title{ font-size: 12px; flex: 0 1 auto; min-width: 0; }
    .up-next-artist{ font-size: 11px; flex: 1 1 0; min-width: 0; }
    .up-next-placeholder{ font-size: 11px; }
    .state-label{ font-size: 12px; }
    .logout-btn, .view-btn, .cur-btn, .lyr-btn{ width: 36px; height: 36px; }
    .logout-btn svg, .view-btn svg, .cur-btn svg, .lyr-btn svg{ width: 17px; height: 17px; }
    .profile-chip{ padding: 4px; }
    .profile-name{ display: none; }
  }

/* ---------- PKCE helpers ---------- */
function randomString(len){
  const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
  let out = '';
  for(let i=0;i<len;i++) out += chars.charAt(Math.floor(Math.random()*chars.length));
  return out;
}
async function sha256(plain){
  return crypto.subtle.digest('SHA-256', new TextEncoder().encode(plain));
}
function base64UrlEncode(buffer){
  return btoa(String.fromCharCode(...new Uint8Array(buffer)))
    .replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}

const VERIFIER_KEY = 'sp_verifier';

/* iOS Safari and in-app browsers (Instagram, Messenger, etc.) wipe
   window.name on cross-origin navigation, which silently destroyed the
   PKCE verifier on the way back from Spotify. Storage survives the
   round trip; window.name is kept only as a last-resort fallback. */
function saveVerifier(v){
  try{ sessionStorage.setItem(VERIFIER_KEY, v); }catch(e){}
  try{ localStorage.setItem(VERIFIER_KEY, v); }catch(e){}
  try{ window.name = 'sp_verifier:' + v; }catch(e){}
}
function readVerifier(){
  let v = null;
  try{ v = sessionStorage.getItem(VERIFIER_KEY); }catch(e){}
  if(!v){ try{ v = localStorage.getItem(VERIFIER_KEY); }catch(e){} }
  if(!v && typeof window.name === 'string' && window.name.startsWith('sp_verifier:')){
    v = window.name.slice(12);
  }
  return v;
}
function clearVerifier(){
  try{ sessionStorage.removeItem(VERIFIER_KEY); }catch(e){}
  try{ localStorage.removeItem(VERIFIER_KEY); }catch(e){}
  try{ if(typeof window.name === 'string' && window.name.startsWith('sp_verifier:')) window.name = ''; }catch(e){}
}

async function redirectToAuth(){
  const verifier = randomString(64);
  saveVerifier(verifier);
  const challenge = base64UrlEncode(await sha256(verifier));
  const params = new URLSearchParams({
    client_id: CLIENT_ID,
    response_type: 'code',
    redirect_uri: REDIRECT_URI,
    scope: SCOPES,
    code_challenge_method: 'S256',
    code_challenge: challenge
  });
  window.location.href = `https://accounts.spotify.com/authorize?${params}`;
}

const REFRESH_KEY = 'sp_refresh_token';

async function refreshAccessToken(refreshToken){
  const body = new URLSearchParams({
    grant_type: 'refresh_token',
    refresh_token: refreshToken,
    client_id: CLIENT_ID
  });
  try{
    const res = await fetch('https://accounts.spotify.com/api/token', {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body
    });
    const data = await res.json();
    if(data.access_token){
      accessToken = data.access_token;
      if(data.refresh_token){ localStorage.setItem(REFRESH_KEY, data.refresh_token); }
      return true;
    }
  } catch(e){ /* fall through to false */ }
  return false;
}

function logout(){

  stopPolling();

}

async function exchangeCodeForToken(code){
  const verifier = readVerifier();
  if(!verifier){ renderLogin("That link expired — log in again."); return; }
  const body = new URLSearchParams({
    client_id: CLIENT_ID,
    grant_type: 'authorization_code',
    code,
    redirect_uri: REDIRECT_URI,
    code_verifier: verifier
  });

    method: 'POST',
    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
    body
  });
  const data = await res.json();
  window.history.replaceState({}, document.title, REDIRECT_URI);
  clearVerifier();
  if(data.access_token){
    accessToken = data.access_token;
    if(data.refresh_token){ localStorage.setItem(REFRESH_KEY, data.refresh_token); }
    startPolling();

  }
}

/* Click or drag the progress bar to jump to a spot in the song.

let seekPreviewMs = null;
function setupSeeking(){
  const track = document.querySelector('.progress-track');
  if(!track) return;

  const msFromEvent = (e) => {
    const rect = track.getBoundingClientRect();
    const frac = Math.min(1, Math.max(0, (e.clientX - rect.left) / rect.width));
    return Math.round(frac * currentTrackDurationMs);
  };

  track.addEventListener('pointerdown', (e) => {
    if(!currentTrackDurationMs) return;
    track.setPointerCapture(e.pointerId);
    track.classList.add('seeking');
    seekPreviewMs = msFromEvent(e);
  });
  track.addEventListener('pointermove', (e) => {
    if(seekPreviewMs === null) return;
    seekPreviewMs = msFromEvent(e);
  });
  const finish = (e, commit) => {
    if(seekPreviewMs === null) return;
    const ms = commit ? msFromEvent(e) : null;
    seekPreviewMs = null;
    track.classList.remove('seeking');
    if(ms === null) return;
    // optimistic local update so bar + lyrics jump instantly
    lyricsMeta.startMs = ms;
    lyricsMeta.startWallClock = Date.now();
    playerAction('PUT', `/seek?position_ms=${ms}`, `Jumped to ${msToClock(ms)}`);
  };
  track.addEventListener('pointerup', (e) => finish(e, true));
  track.addEventListener('pointercancel', (e) => finish(e, false));
}

/* Runs every animation frame alongside the lyrics sweep. Reads the same
   clock (lyricsMeta), so the progress bar, the time, the play/pause icon,
   and the lyrics all move in lockstep off one source of truth. Every write
   is guarded so it only touches the DOM when the displayed value actually
   changes. */
function updateProgressUI(){
  const fill = document.getElementById('progressFill');
  if(!fill || !currentTrackDurationMs) return;

  let elapsedMs = lyricsMeta.startMs;
  if(lyricsMeta.playing){
    elapsedMs += Date.now() - lyricsMeta.startWallClock;
  }
  if(seekPreviewMs !== null) elapsedMs = seekPreviewMs;
  elapsedMs = Math.max(0, Math.min(elapsedMs, currentTrackDurationMs));

  const pct = (Math.min(100, (elapsedMs / currentTrackDurationMs) * 100)).toFixed(1);
  if(fill.dataset.pct !== pct){
    fill.dataset.pct = pct;
    fill.style.width = pct + '%';
    const thumb = document.getElementById('progressThumb');

  }

  const timeNow = document.getElementById('timeNow');
  if(timeNow){
    const clock = msToClock(elapsedMs);

  }

  const playBtn = document.getElementById('playBtn');
  if(playBtn && playBtn.dataset.playing !== String(lyricsMeta.playing)){

/* ---------- lyrics (via lrclib.net - free, open, no key required) ---------- */

/* Parses standard LRC timestamps, e.g. "[00:12.34]Some line", including
   lines with multiple leading timestamps pointing at the same text. */
function parseLRC(lrcText){
  const lines = lrcText.split('\n');
  const tagRe = /\[(\d{2}):(\d{2})(?:\.(\d{1,3}))?\]/g;
  const out = [];
  for(const line of lines){
    const tags = [...line.matchAll(tagRe)];
    if(tags.length === 0) continue;
    const text = line.replace(tagRe, '').trim();
    for(const t of tags){
      const min = parseInt(t[1], 10);
      const sec = parseInt(t[2], 10);
      const msRaw = (t[3] || '0').padEnd(3, '0').slice(0, 3);
      out.push({ time: min * 60 + sec + parseInt(msRaw, 10) / 1000, text });
    }
  }
  return out.sort((a, b) => a.time - b.time);
}

function prepareLines(lines){
  return lines.map(line => ({ time: line.time, text: line.text }));
}

async function fetchLyricsData(title, artist, album, durationSec){
  const parse = (data) => ({
    plain: data.plainLyrics || null,
    synced: data.syncedLyrics ? parseLRC(data.syncedLyrics) : null
  });
  try{
    const exact = new URLSearchParams({ track_name: title, artist_name: artist, album_name: album, duration: durationSec });
    let res = await fetch(`https://lrclib.net/api/get?${exact}`);
    if(res.ok){
      const data = await res.json();
      if(data.plainLyrics || data.syncedLyrics) return parse(data);
    }
    const loose = new URLSearchParams({ track_name: title, artist_name: artist });
    res = await fetch(`https://lrclib.net/api/search?${loose}`);
    if(res.ok){
      const results = await res.json();
      if(Array.isArray(results)){
        const hit = results.find(r => r.plainLyrics || r.syncedLyrics);
        if(hit) return parse(hit);
      }
    }
  } catch(e){ /* treat as not found */ }
  return { plain: null, synced: null };
}

function renderLyricsBox(data){
  const box = document.getElementById('lyricsBox');
  if(!box) return;
  if(data.synced && data.synced.length){
    const lines = data.synced.map((l, i) => {
      const text = escapeHtml(l.text) || '\u266A';
      return `<p class="lyric-line" data-i="${i}">${text}<span class="lyric-tr"></span></p>`;
    }).join('');
    box.innerHTML = `<div class="lyrics-track" id="lyricsTrack">${lines}</div>`;
    // One delegated handler (assigned, not added, so re-renders never stack listeners).
    box.onclick = (e) => {
      const lineEl = e.target.closest('.lyric-line');
      if(!lineEl || !lyricsMeta.lines) return;
      if(document.documentElement.classList.contains('no-premium')) return;
      const line = lyricsMeta.lines[Number(lineEl.dataset.i)];
      if(!line) return;
      // ceil so float rounding can never land a hair before the line's timestamp
      const ms = Math.max(0, Math.ceil(line.time * 1000));
      // optimistic local update so the lyrics + bar jump instantly
      lyricsMeta.startMs = ms;
      lyricsMeta.startWallClock = Date.now();
      playerAction('PUT', `/seek?position_ms=${ms}`, `Jumped to ${msToClock(ms)}`);
    };
  } else if(data.plain){
    const plainLines = data.plain.split('\n').map(l => `<span class="pl">${escapeHtml(l)}<span class="lyric-tr"></span></span>`).join('');
    box.innerHTML = `<div class="lyrics-text">${plainLines}</div>`;
  } else {
    box.innerHTML = '<p class="lyrics-status">Lyrics not found for this track.</p>';
  }
}

function applyLyricsData(data){
  const prepared = data.synced ? prepareLines(data.synced) : null;
  lyricsMeta.lines = prepared;
  lyricsMeta.lastActiveIdx = -1;
  lyricsMeta.lastWordIdx = -1;
  lyricsMeta.currentY = 0;
  renderLyricsBox({ plain: data.plain, synced: prepared });
  // Lyrics that aren't timed (plain) or missing entirely can't scroll, so on a
  // phone in landscape the player takes over the whole screen (CSS below).
  const isStatic = !(prepared && prepared.length);
  document.documentElement.classList.toggle('lyrics-static', isStatic);
  ensureTranslations();
}

/* ---------- lyric translation (any language -> English) ----------
   Uses Google Translate's free public endpoint with auto language detection,
   so it works for every language it supports. English songs are skipped, and
   lines that come back identical (names, "yeah", etc.) show nothing. */
const trCache = {};

function lyricLinesFor(id){
  const d = lyricsCache[id];
  if(!d) return null;
  if(d.synced && d.synced.length) return d.synced.map(l => l.text);
  if(d.plain) return d.plain.split('\n');
  return null;
}
const hasLetters = (t) => /\p{L}/u.test(t);
const normTr = (t) => t.toLowerCase().replace(/[^\p{L}\p{N}]+/gu, ' ').trim();

let trBlockedUntil = 0;

async function gtx(q){
  const url = 'https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=en&dt=t&q=' + encodeURIComponent(q);
  const res = await fetch(url);
  if(!res.ok){ const err = new Error('translate ' + res.status); err.status = res.status; throw err; }
  const data = await res.json();
  const segs = (data[0] || []).filter(sg => sg && sg[0] != null).map(sg => ({ t: sg[0] || '', src: sg[1] || '' }));
  return { segs, lang: data[2] || '' };
}

/* Rebuild one translation per input line from Google's segments. Each source
   line ends in a newline, so a segment whose source ends in one closes a line. */
function alignToLines(segs, n){
  const a = [];
  let cur = '';
  for(const sg of segs){
    cur += sg.t;
    if(/\n\s*$/.test(sg.src)){ a.push(cur.trim()); cur = ''; }
  }
  if(cur.trim() !== '') a.push(cur.trim());
  if(a.length === n) return a;
  const b = segs.map(sg => sg.t).join('').split('\n').map(x => x.trim());
  while(b.length > n && b[b.length - 1] === '') b.pop();
  return b.length === n ? b : null;
}

async function translateLines(texts, depth = 0){
  const r = await gtx(texts.join('\n'));
  const out = alignToLines(r.segs, texts.length);
  if(out) return { out, lang: r.lang };
  if(texts.length > 1 && depth < 3){
    // lines didn't line up: split the batch in half and retry (bounded)
    const mid = Math.ceil(texts.length / 2);
    const first = await translateLines(texts.slice(0, mid), depth + 1);
    const second = await translateLines(texts.slice(mid), depth + 1);
    return { out: first.out.concat(second.out), lang: r.lang || first.lang };
  }
  return { out: texts.map(() => ''), lang: r.lang };
}

/* Cheap offline check so English songs never touch the network. */
const EN_WORDS = new Set(['the','you','and','it','that','is','in','on','my','with','for','of','this','but','got','just','like','your','all','be','we','what','was','are','not','they','when','have','can','if','she','up','out','get','know','now','her','him','i','to','im','dont','aint','yeah']);
function looksEnglish(lines){
  let words = 0, hits = 0;
  for(const l of lines){
    for(const w of l.toLowerCase().split(/[^\p{L}']+/u)){
      if(!w) continue;
      words++;
      if(EN_WORDS.has(w.replace(/'/g, ''))) hits++;
    }
  }
  return words > 0 && hits / words > 0.14;
}

async function buildTranslations(lines){
  const idxs = [];
  lines.forEach((t, i) => { if(hasLetters(t)) idxs.push(i); });
  const tr = new Array(lines.length).fill('');
  // batch lines so each request URL stays a safe length
  const chunks = [];
  let chunk = [];
  let size = 0;
  for(const i of idxs){
    const len = encodeURIComponent(lines[i]).length + 3;
    if(size + len > 1500 && chunk.length){ chunks.push(chunk); chunk = []; size = 0; }
    chunk.push(i);
    size += len;
  }
  if(chunk.length) chunks.push(chunk);
  let lang = '';
  for(let c = 0; c < chunks.length; c++){
    const r = await translateLines(chunks[c].map(i => lines[i]));
    if(c === 0){
      lang = r.lang;
      if(lang === 'en') return { english: true, tr };
    }
    chunks[c].forEach((i, k) => {
      const t = (r.out[k] || '').trim();
      if(t && normTr(t) !== normTr(lines[i])) tr[i] = t;
    });
  }
  return { english: false, lang, tr };
}

/* Finished translations are kept in the browser (last 40 songs) so each song
   only ever needs to be translated once. */
function loadStoredTr(id, n){
  try{
    const all = JSON.parse(localStorage.getItem('np_trc') || '[]');
    const hit = all.find(e => e[0] === id);
    return hit && hit[1] && hit[1].tr && hit[1].tr.length === n ? hit[1] : null;
  } catch(e){ return null; }
}
function saveStoredTr(id, entry){
  try{
    let all = JSON.parse(localStorage.getItem('np_trc') || '[]').filter(e => e[0] !== id);
    all.push([id, entry]);
    if(all.length > 40) all = all.slice(-40);
    localStorage.setItem('np_trc', JSON.stringify(all));
  } catch(e){ /* storage full or blocked - fine */ }
}

function applyTranslations(entry){
  document.querySelectorAll('#lyricsBox .lyric-tr').forEach((el, i) => {
    el.textContent = entry.tr[i] || '';
  });
}

async function ensureTranslations(fromToggle){
  const id = currentTrackId;
  if(!id || !document.documentElement.classList.contains('tr-on')) return;
  if(document.documentElement.classList.contains('lyrics-off')) return;
  const lines = lyricLinesFor(id);
  if(!lines) return;
  const btn = document.getElementById('trBtn');
  if(!trCache[id]){
    const stored = loadStoredTr(id, lines.length);
    if(stored) trCache[id] = stored;
    else if(looksEnglish(lines)) trCache[id] = { english: true, tr: new Array(lines.length).fill('') };
  }
  if(!trCache[id]){
    if(Date.now() < trBlockedUntil){
      showToast('Translation is busy - try again in a couple of minutes.');
      return;
    }
    if(btn) btn.textContent = 'Translating…';
    try{
      const entry = await buildTranslations(lines);
      trCache[id] = entry;
      saveStoredTr(id, entry);
    } catch(e){
      const limited = e && (e.status === 429 || e.status === 403);
      if(limited) trBlockedUntil = Date.now() + 120000;
      if(currentTrackId === id){
        const b1 = document.getElementById('trBtn');
        if(b1) b1.textContent = 'Translate';
        showToast(limited ? 'Translation is busy - try again in a couple of minutes.' : "Translation isn't available right now.");
      }
      return;
    }
  }
  if(currentTrackId !== id) return;
  const b2 = document.getElementById('trBtn');
  if(b2) b2.textContent = 'Translate';
  applyTranslations(trCache[id]);
  if(fromToggle === true && trCache[id].english) showToast('These lyrics are already in English.');
}

function syncTrBtn(){
  const b = document.getElementById('trBtn');
  if(!b) return;
  const on = document.documentElement.classList.contains('tr-on');
  b.classList.toggle('on', on);
  b.setAttribute('aria-pressed', on ? 'true' : 'false');
}

function toggleTranslate(){
  const on = document.documentElement.classList.toggle('tr-on');
  try{ localStorage.setItem('np_translate', on ? '1' : '0'); } catch(e){}
  syncTrBtn();
  if(on) ensureTranslations(true);
}

async function loadLyricsFor(track, durationMs){
  const id = track.id;
  const durationSec = durationMs / 1000;
  if(lyricsCache[id] !== undefined){ applyLyricsData(lyricsCache[id]); return; }
  const artist = track.artists[0]?.name || '';
  const data = await fetchLyricsData(track.name, artist, track.album.name, Math.round(durationSec));
  lyricsCache[id] = data;
  if(currentTrackId === id){ applyLyricsData(data); }
}

/* Runs every animation frame (not tied to the 5s poll) for a continuously
   smooth scroll and word sweep, instead of snapping in discrete steps. */
function lyricsFrame(){
  updateProgressUI();
  updateLyrics();
  lyricsRAF = requestAnimationFrame(lyricsFrame);
}
function startLyricsLoop(){
  stopLyricsLoop();
  lyricsRAF = requestAnimationFrame(lyricsFrame);
}
function stopLyricsLoop(){
  if(lyricsRAF){ cancelAnimationFrame(lyricsRAF); lyricsRAF = null; }
}

/* Sets every word in a line to a resting state: fully sung (solid cyan)
   or not yet reached (default dim). Never touches the sweep gradient —
   that's reserved for the single word actively being highlighted. */
/* Sets every word in a line to a resting state by driving the clip width
   directly: 100% = fully sung, 0% = not yet reached. No classes, no custom
   properties, no gradients — just a width. */
function setLineSung(lineEl, sung){
  if(lineEl.dataset.sung === String(sung)) return;
  lineEl.dataset.sung = String(sung);
  lineEl.classList.toggle('sung', sung);
}

function updateLyrics(){
  if(!lyricsMeta.lines || lyricsMeta.lines.length === 0) return;
  const box = document.getElementById('lyricsBox');
  const track = document.getElementById('lyricsTrack');
  if(!box || !track) return;

  let elapsedSec = lyricsMeta.startMs / 1000;
  if(lyricsMeta.playing){
    elapsedSec += (Date.now() - lyricsMeta.startWallClock) / 1000;
  }

  const lines = lyricsMeta.lines;
  let idx = -1;
  for(let i = 0; i < lines.length; i++){
    if(lines[i].time <= elapsedSec) idx = i; else break;
  }
  if(idx < 0) idx = 0;

  const lineEls = track.querySelectorAll('.lyric-line');
  if(idx !== lyricsMeta.lastActiveIdx){
    lineEls.forEach((el, i) => {
      el.classList.toggle('active', i === idx);
      setLineSung(el, i < idx);

      // Distance-based fade replaces the old CSS mask. Only recalculated
      // when the active line changes, so it costs nothing per frame.
      const dist = Math.abs(i - idx);
      const op = Math.max(1 - dist * 0.16, 0.12).toFixed(2);
      if(el.dataset.op !== op){
        el.dataset.op = op;
        el.style.opacity = op;
      }
    });
    lyricsMeta.lastActiveIdx = idx;
  }

  const currentLineEl = lineEls[idx];
  if(currentLineEl){
    // continuous, eased vertical scroll toward centering the active line
    const boxHeight = box.clientHeight;
    const lineTop = currentLineEl.offsetTop;
    const lineHeight = currentLineEl.offsetHeight;
    const targetY = boxHeight / 2 - (lineTop + lineHeight / 2);
    lyricsMeta.currentY += (targetY - lyricsMeta.currentY) * 0.12;
    // Skip the write once the position has effectively settled — avoids
    // repainting every frame while sitting still on a long line.
    const rounded = Math.round(lyricsMeta.currentY * 10) / 10;
    if(lyricsMeta.lastY !== rounded){
      lyricsMeta.lastY = rounded;
      track.style.transform = `translateY(${rounded}px)`;
    }
  }
}

async function fetchProfile(){

    });

    if(data.product){

    `;

/* ---------- playback controls ---------- */
async function playerAction(method, path, okMessage){
  try{
    const res = await fetch(`https://api.spotify.com/v1/me/player${path}`, {
      method,
      headers: { Authorization: `Bearer ${accessToken}` }
    });
    if(res.status === 403){
      try{
        const j = await res.json();
        if(j && j.error && j.error.reason === 'PREMIUM_REQUIRED') setFreeAccount(true);
      } catch(e){}
      showToast("That needs Spotify Premium.");
      return;
    }
    if(res.status === 401){
      const stored = localStorage.getItem(REFRESH_KEY);
      if(stored && await refreshAccessToken(stored)){ setTimeout(tick, 300); return; }
      renderLogin("Session expired — log in again.");
      return;
    }
    if(res.status === 404){ showToast("Open Spotify on a device first."); return; }
    showToast(okMessage);
    setTimeout(tick, 450);
  } catch(e){
    showToast("Couldn't reach Spotify.");
  }
}

let toastTimer = null;

/* ---------- gradient from album art (two-tone, no storage used) ---------- */
function pickVibrant(pixelData){
  let best = null, bestScore = -1, fallbackR=0, fallbackG=0, fallbackB=0, n=0;
  for(let i=0;i<pixelData.length;i+=4){
    const r=pixelData[i], g=pixelData[i+1], b=pixelData[i+2], a=pixelData[i+3];
    if(a < 100) continue;
    fallbackR+=r; fallbackG+=g; fallbackB+=b; n++;
    const max=Math.max(r,g,b), min=Math.min(r,g,b);
    const lum=(max+min)/2;
    if(lum < 30 || lum > 225) continue;
    const sat = max===0 ? 0 : (max-min)/max;
    if(sat > bestScore){ bestScore = sat; best = [r,g,b]; }
  }
  if(best) return best;
  if(n===0) return [124,58,237];
  return [Math.round(fallbackR/n), Math.round(fallbackG/n), Math.round(fallbackB/n)];
}

function extractGradient(imgUrl){
  if(!imgUrl) return;
  const img = new Image();
  img.crossOrigin = 'Anonymous';
  img.onload = () => {
    try{
      const canvas = document.createElement('canvas');
      canvas.width = 24; canvas.height = 24;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, 24, 24);
      const left = ctx.getImageData(0, 0, 10, 24).data;
      const right = ctx.getImageData(14, 0, 10, 24).data;
      const top = ctx.getImageData(0, 0, 24, 10).data;
      const c1 = pickVibrant(left);
      const c2 = pickVibrant(right);
      const c3 = pickVibrant(top);
      document.documentElement.style.setProperty('--c1', `rgb(${c1[0]},${c1[1]},${c1[2]})`);
      document.documentElement.style.setProperty('--c2', `rgb(${c2[0]},${c2[1]},${c2[2]})`);
      document.documentElement.style.setProperty('--c3', `rgb(${c3[0]},${c3[1]},${c3[2]})`);
    } catch(e){ /* CORS-tainted canvas - keep the current colors */ }
  };
  img.src = imgUrl;
}

/* ---------- polling ---------- */
async function tick(){
  try{
    const res = await fetch('https://api.spotify.com/v1/me/player/currently-playing', {
      headers: { Authorization: `Bearer ${accessToken}` }
    });
    if(res.status === 204){ renderIdle(); return; }
    if(res.status === 401){
      const stored = localStorage.getItem(REFRESH_KEY);
      if(stored && await refreshAccessToken(stored)){ tick(); return; }
      renderLogin("Session expired — log in again.");
      return;
    }
    const data = await res.json();
    if(!data || !data.item){ renderIdle(); return; }
    renderTrack(data);
    fetchQueue();
    probePremium();
  } catch(e){ /* transient network hiccup - keep current view, retry next tick */ }
}

let queueForTrackId = null;
let lastQueueFetch = 0;
let queueRetryTimer = null;
/* Spotify no longer includes the account type (free/Premium) in the profile for
   Development Mode apps, so detect it another way: send a "set shuffle to what
   it already is" command. It changes nothing, but Spotify rejects it with
   PREMIUM_REQUIRED on free accounts. Runs once per page load. */
function setFreeAccount(free){
  document.documentElement.classList.toggle('no-premium', free);
  try{ localStorage.setItem('np_free', free ? '1' : '0'); } catch(e){}
}
let premiumProbed = false;
let probing = false;
let probeTries = 0;
async function probePremium(){
  if(premiumProbed || probing || probeTries >= 4) return;
  probing = true;
  probeTries++;
  try{
    const headers = { Authorization: `Bearer ${accessToken}` };
    const st = await fetch('https://api.spotify.com/v1/me/player', { headers });
    if(st.status !== 200) return;
    const state = await st.json();
    if(!state || typeof state.shuffle_state !== 'boolean') return;
    const r = await fetch(`https://api.spotify.com/v1/me/player/shuffle?state=${state.shuffle_state}`, { method: 'PUT', headers });
    if(r.status === 200 || r.status === 204){ setFreeAccount(false); premiumProbed = true; }
    else if(r.status === 403){
      let reason = '';
      try{ const j = await r.json(); reason = (j && j.error && j.error.reason) || ''; } catch(e){}
      if(reason === 'PREMIUM_REQUIRED'){ setFreeAccount(true); premiumProbed = true; }
    }
  } catch(e){ /* try again on a later tick */ }
  finally { probing = false; }
}

async function fetchQueue(){
  // Fetch right away on a new song (and once more shortly after, since Spotify's
  // queue often lags a track change); otherwise only refresh every 15s.
  const isNewSong = queueForTrackId !== currentTrackId;
  if(!isNewSong && Date.now() - lastQueueFetch < 15000) return;
  queueForTrackId = currentTrackId;
  lastQueueFetch = Date.now();
  if(isNewSong){
    clearTimeout(queueRetryTimer);
    queueRetryTimer = setTimeout(() => { lastQueueFetch = 0; fetchQueue(); }, 2500);
  }
  try{
    let res = await fetch('https://api.spotify.com/v1/me/player/queue', {
      headers: { Authorization: `Bearer ${accessToken}` }
    });
    if(res.status === 401){
      const stored = localStorage.getItem(REFRESH_KEY);
      if(stored && await refreshAccessToken(stored)){
        res = await fetch('https://api.spotify.com/v1/me/player/queue', {
          headers: { Authorization: `Bearer ${accessToken}` }
        });
      }
    }
    if(!res.ok){
      showUpNextMessage(res.status === 403 ? 'Queue needs Premium' : `Queue unavailable (${res.status})`);
      return;
    }
    const data = await res.json();
    renderUpNext(data.queue && data.queue[0]);
  } catch(e){ /* leave whatever was showing */ }
}

function showUpNextMessage(msg){
  const box = document.getElementById('upNextContent');
  if(box) box.innerHTML = `<p class="up-next-placeholder">${escapeHtml(msg)}</p>`;
}

function renderUpNext(track){
  const box = document.getElementById('upNextContent');
  if(!box) return;
  if(!track){
    box.innerHTML = '<p class="up-next-placeholder">Nothing queued</p>';
    return;
  }
  const images = track.album?.images || [];
  const art = images[images.length - 1]?.url || images[0]?.url || '';
  const artists = (track.artists || []).map(a => a.name).join(', ');

    ${art ? `<img class="up-next-art" src="${art}" alt="">` : '<div class="up-next-art"></div>'}
    <div class="up-next-info">
      <p class="up-next-title">${escapeHtml(track.name || '')}</p>
      <p class="up-next-artist">${escapeHtml(artists)}</p>
    </div>
  `;
}

/* ---------- hide the mouse cursor when it stops moving (PC, opt-in) ---------- */
let cursorTimer = null;
function wakeCursor(){
  const root = document.documentElement;
  root.classList.remove('cursor-idle');
  clearTimeout(cursorTimer);
  if(!root.classList.contains('hide-cursor')) return;
  cursorTimer = setTimeout(() => root.classList.add('cursor-idle'), 2000);
}
// Browsers fire "fake" mousemove events when things move under a still cursor
// (the scrolling lyrics and animated background do), which used to reset the
// timer forever. Only count moves where the pointer actually changed position.
let lastMX = -100, lastMY = -100;
document.addEventListener('mousemove', (e) => {
  if(Math.abs(e.clientX - lastMX) < 2 && Math.abs(e.clientY - lastMY) < 2) return;
  lastMX = e.clientX;
  lastMY = e.clientY;
  wakeCursor();
}, { passive: true });
document.addEventListener('mousedown', wakeCursor, { passive: true });

/* ---------- keep the screen awake while viewing ---------- */
let wakeLock = null;
let wakeLockPending = false;
let userInteracted = false;
let fallbackVideo = null;
let fallbackTimer = null;

async function requestWakeLock(){
  if(document.visibilityState !== 'visible') return;
  if(wakeLock || wakeLockPending) return;
  if(!('wakeLock' in navigator)){ startFallbackWake(); return; }
  wakeLockPending = true;
  try{
    const lock = await navigator.wakeLock.request('screen');
    wakeLock = lock;
    lock.addEventListener('release', () => { if(wakeLock === lock) wakeLock = null; });
    stopFallbackWake();
  } catch(e){
    // Denied or unavailable (battery saver, ChromeOS policy, etc.) - use the
    // hidden-video fallback instead.
    console.warn('Wake Lock request failed:', e && e.name, e && e.message);
    startFallbackWake();
  } finally {
    wakeLockPending = false;
  }
}

/* Fallback for browsers/devices where the Wake Lock API is missing or refuses
   (older iPad/iPhone Home Screen apps, some Chromebooks): a tiny muted, looping
   video. Browsers keep the screen on while a video is playing. Tries to start
   right away; if the browser wants a tap first, the first tap starts it. */

function startFallbackWake(){
  if(fallbackVideo) return;
  try{
    const v = document.createElement('video');
    v.muted = true;
    v.loop = true;
    v.setAttribute('muted', '');
    v.setAttribute('playsinline', '');
    v.setAttribute('webkit-playsinline', '');
    v.style.cssText = 'position:fixed;left:0;bottom:0;width:2px;height:2px;opacity:.01;pointer-events:none;';
    v.src = WAKE_VIDEO;
    document.body.appendChild(v);
    fallbackVideo = v;
    const p = v.play();
    if(p && p.catch) p.catch(() => stopFallbackWake()); // needs a tap first; retried after one
  } catch(e){
    console.warn('Wake fallback failed:', e && e.name, e && e.message);
    stopFallbackWake();
  }
}

function stopFallbackWake(){
  if(fallbackTimer){ clearInterval(fallbackTimer); fallbackTimer = null; }
  if(fallbackVideo){ fallbackVideo.pause(); fallbackVideo.remove(); fallbackVideo = null; }
}

// The first tap/click/keypress unlocks the fallback (and retries the real lock).
['pointerdown', 'keydown', 'touchstart'].forEach(evt => {
  document.addEventListener(evt, () => {
    if(userInteracted) return;
    userInteracted = true;
    if(!wakeLock) requestWakeLock();
  }, { passive: true });
});

// Safety net: re-acquire every 10s if the lock silently dropped while visible.
setInterval(() => {
  if(document.visibilityState === 'visible' && !wakeLock) requestWakeLock();
  if(fallbackVideo && fallbackVideo.paused && document.visibilityState === 'visible'){ fallbackVideo.play().catch(() => {}); }
}, 10000);

// The browser releases the lock when the tab is hidden; re-request on return.
document.addEventListener('visibilitychange', () => {
  if(document.visibilityState === 'visible'){
    requestWakeLock();
    if(fallbackVideo && fallbackVideo.paused){ fallbackVideo.play().catch(() => {}); }
  }
});

/* ---------- init ---------- */
(async function init(){
  requestWakeLock();
  if(CLIENT_ID.includes('PASTE_YOUR')){
    renderLogin("Add your Spotify Client ID in the code before this will work.");
    return;
  }
  const params = new URLSearchParams(window.location.search);
  const code = params.get('code');
  if(code){
    exchangeCodeForToken(code);
    return;
  }
  const stored = localStorage.getItem(REFRESH_KEY);
  if(stored){
    const ok = await refreshAccessToken(stored);
    if(ok){ startPolling(); return; }
    localStorage.removeItem(REFRESH_KEY);
  }
  renderLogin();
})();
