    if(ctb){ applyCityTime(ctb.dataset.ct); syncSettings(); return; }
    const row = e.target.closest('.sp-row');
    if(!row || row.getAttribute('aria-disabled') === 'true') return;
    const fn = SETTINGS[row.id];
    if(fn) fn();
    syncSettings();
  });
  if(!settingsWired){
    settingsWired = true;
    document.addEventListener('click', (e) => {
      const pn = document.getElementById('settingsPanel');
      const g = document.getElementById('gearBtn');
      if(pn && pn.classList.contains('open') && !pn.contains(e.target) && !(g && g.contains(e.target))) setSettingsOpen(false);
    });
    document.addEventListener('keydown', (e) => {
      if(e.key === 'Escape'){
        const pn = document.getElementById('settingsPanel');
        if(pn && pn.classList.contains('open')){ setSettingsOpen(false); const g = document.getElementById('gearBtn'); if(g) g.focus(); }
      }
    });
    // keep the switches in step with any class change (song with no lyrics, etc.)
    new MutationObserver(syncSettings).observe(document.documentElement, { attributes: true, attributeFilter: ['class'] });
  }
  syncSettings();
}

function stopPolling(){
  if(pollTimer){ clearInterval(pollTimer); pollTimer = null; }
  stopLyricsLoop();
}

/* ---------- landscape phones: use the free side next to the notch ---------- */
function updateIslandSide(){
  const root = document.documentElement;
  let o = window.orientation;
  if(typeof o !== 'number' && screen.orientation && typeof screen.orientation.angle === 'number'){
    o = screen.orientation.angle === 270 ? -90 : screen.orientation.angle;
  }
  // rotated counter-clockwise (90): notch/Dynamic Island on the left, free space on the right
  root.classList.toggle('island-left', o === 90);
  root.classList.toggle('island-right', o === -90);
}
updateIslandSide();
window.addEventListener('orientationchange', () => setTimeout(updateIslandSide, 60));
window.addEventListener('resize', updateIslandSide);

/* ---------- hide the mouse cursor when it stops moving (PC, opt-in) ---------- */
let cursorTimer = null;
function wakeCursor(){
  const root = document.documentElement;
  root.classList.remove('cursor-idle');
  clearTimeout(cursorTimer);
  if(!root.classList.contains('hide-cursor')) return;
  cursorTimer = setTimeout(() => root.classList.add('cursor-idle'), 2000);
}
// Browsers fire "fake" mousemove events when things move under a still cursor
// (the scrolling lyrics and animated background do), which used to reset the
// timer forever. Only count moves where the pointer actually changed position.
let lastMX = -100, lastMY = -100;
document.addEventListener('mousemove', (e) => {
  if(e.isTrusted && e.movementX === 0 && e.movementY === 0) return;   // synthetic move, pointer didn't travel
  if(Math.abs(e.clientX - lastMX) < 2 && Math.abs(e.clientY - lastMY) < 2) return;
  lastMX = e.clientX;
  lastMY = e.clientY;
  wakeCursor();
}, { passive: true });
document.addEventListener('mousedown', wakeCursor, { passive: true });

/* ---------- keep the screen awake while viewing ---------- */
let wakeLock = null;
let wakeLockPending = false;
let userInteracted = false;
let fallbackVideo = null;
let fallbackTimer = null;

async function requestWakeLock(){
  if(document.visibilityState !== 'visible') return;
  if(wakeLock || wakeLockPending) return;
  if(!('wakeLock' in navigator)){ startFallbackWake(); return; }
  wakeLockPending = true;
  try{
    const lock = await navigator.wakeLock.request('screen');
    wakeLock = lock;
    lock.addEventListener('release', () => { if(wakeLock === lock) wakeLock = null; });
    stopFallbackWake();
  } catch(e){
    // Denied or unavailable (battery saver, ChromeOS policy, etc.) - use the
    // hidden-video fallback instead.
    console.warn('Wake Lock request failed:', e && e.name, e && e.message);
    startFallbackWake();
  } finally {
    wakeLockPending = false;
  }
}

/* Fallback for browsers/devices where the Wake Lock API is missing or refuses
   (older iPad/iPhone Home Screen apps, some Chromebooks): a tiny muted, looping
   video. Browsers keep the screen on while a video is playing. Tries to start
   right away; if the browser wants a tap first, the first tap starts it. */
const WAKE_VIDEO = 'data:video/mp4;base64,AAAAIGZ0eXBpc29tAAACAGlzb21pc28yYXZjMW1wNDEAAAM2bW9vdgAAAGxtdmhkAAAAAAAAAAAAAAAAAAAD6AAAB9AAAQAAAQAAAAAAAAAAAAAAAAEAAAAAAAAAAAAAAAAAAAABAAAAAAAAAAAAAAAAAABAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAgAAAmB0cmFrAAAAXHRraGQAAAADAAAAAAAAAAAAAAABAAAAAAAAB9AAAAAAAAAAAAAAAAAAAAAAAAEAAAAAAAAAAAAAAAAAAAABAAAAAAAAAAAAAAAAAABAAAAAAEAAAABAAAAAAAAkZWR0cwAAABxlbHN0AAAAAAAAAAEAAAfQAAAAAAABAAAAAAHYbWRpYQAAACBtZGhkAAAAAAAAAAAAAAAAAABAAAAAgABVxAAAAAAALWhkbHIAAAAAAAAAAHZpZGUAAAAAAAAAAAAAAABWaWRlb0hhbmRsZXIAAAABg21pbmYAAAAUdm1oZAAAAAEAAAAAAAAAAAAAACRkaW5mAAAAHGRyZWYAAAAAAAAAAQAAAAx1cmwgAAAAAQAAAUNzdGJsAAAAu3N0c2QAAAAAAAAAAQAAAKthdmMxAAAAAAAAAAEAAAAAAAAAAAAAAAAAAAAAAEAAQABIAAAASAAAAAAAAAABFUxhdmM2MC4zMS4xMDIgbGlieDI2NAAAAAAAAAAAAAAAGP//AAAAMWF2Y0MBQsAe/+EAGGdCwB6mERCbARAAAAMAEAAAAwBA8WLhGAEABmjIQgRLIAAAABBwYXNwAAAAAQAAAAEAAAAUYnRydAAAAAAAAArAAAAKwAAAABhzdHRzAAAAAAAAAAEAAAAEAAAgAAAAABRzdHNzAAAAAAAAAAEAAAABAAAAHHN0c2MAAAAAAAAAAQAAAAEAAAAEAAAAAQAAACRzdHN6AAAAAAAAAAAAAAAEAAACkAAAAAoAAAALAAAACwAAABRzdGNvAAAAAAAAAAEAAANmAAAAYnVkdGEAAABabWV0YQAAAAAAAAAhaGRscgAAAAAAAAAAbWRpcmFwcGwAAAAAAAAAAAAAAAAtaWxzdAAAACWpdG9vAAAAHWRhdGEAAAABAAAAAExhdmY2MC4xNi4xMDAAAAAIZnJlZQAAArhtZGF0AAACcgYF//9u3EXpvebZSLeWLNgg2SPu73gyNjQgLSBjb3JlIDE2NCByMzEwOCAzMWUxOWY5IC0gSC4yNjQvTVBFRy00IEFWQyBjb2RlYyAtIENvcHlsZWZ0IDIwMDMtMjAyMyAtIGh0dHA6Ly93d3cudmlkZW9sYW4ub3JnL3gyNjQuaHRtbCAtIG9wdGlvbnM6IGNhYmFjPTAgcmVmPTE2IGRlYmxvY2s9MTowOjAgYW5hbHlzZT0weDE6MHgxMzEgbWU9dW1oIHN1Ym1lPTEwIHBzeT0xIHBzeV9yZD0xLjAwOjAuMDAgbWl4ZWRfcmVmPTEgbWVfcmFuZ2U9MjQgY2hyb21hX21lPTEgdHJlbGxpcz0yIDh4OGRjdD0wIGNxbT0wIGRlYWR6b25lPTIxLDExIGZhc3RfcHNraXA9MSBjaHJvbWFfcXBfb2Zmc2V0PS0yIHRocmVhZHM9MSBsb29rYWhlYWRfdGhyZWFkcz0xIHNsaWNlZF90aHJlYWRzPTAgbnI9MCBkZWNpbWF0ZT0xIGludGVybGFjZWQ9MCBibHVyYXlfY29tcGF0PTAgY29uc3RyYWluZWRfaW50cmE9MCBiZnJhbWVzPTAgd2VpZ2h0cD0wIGtleWludD0yNTAga2V5aW50X21pbj0yIHNjZW5lY3V0PTQwIGludHJhX3JlZnJlc2g9MCByY19sb29rYWhlYWQ9NjAgcmM9Y3JmIG1idHJlZT0xIGNyZj0zMC4wIHFjb21wPTAuNjAgcXBtaW49MCBxcG1heD02OSBxcH function startFallbackWake(){
  if(fallbackVideo) return;
  try{
    const v = document.createElement('video');
    v.muted = true;
    v.loop = true;
    v.setAttribute('muted', '');
    v.setAttribute('playsinline', '');
    v.setAttribute('webkit-playsinline', '');
    v.style.cssText = 'position:fixed;left:0;bottom:0;width:2px;height:2px;opacity:.01;pointer-events:none;';
    v.src = WAKE_VIDEO;
    document.body.appendChild(v);
    fallbackVideo = v;
    const p = v.play();
    if(p && p.catch) p.catch(() => stopFallbackWake()); // needs a tap first; retried after one
  } catch(e){
    console.warn('Wake fallback failed:', e && e.name, e && e.message);
    stopFallbackWake();
  }
}

function stopFallbackWake(){
  if(fallbackTimer){ clearInterval(fallbackTimer); fallbackTimer = null; }
  if(fallbackVideo){ fallbackVideo.pause(); fallbackVideo.remove(); fallbackVideo = null; }
}

// The first tap/click/keypress unlocks the fallback (and retries the real lock).
['pointerdown', 'keydown', 'touchstart'].forEach(evt => {
  document.addEventListener(evt, () => {
    if(userInteracted) return;
    userInteracted = true;
    if(!wakeLock) requestWakeLock();
  }, { passive: true });
});

// Safety net: re-acquire every 10s if the lock silently dropped while visible.
setInterval(() => {
  if(document.visibilityState === 'visible' && !wakeLock) requestWakeLock();
  if(fallbackVideo && fallbackVideo.paused && document.visibilityState === 'visible'){ fallbackVideo.play().catch(() => {}); }
}, 10000);

// The browser releases the lock when the tab is hidden; re-request on return.
document.addEventListener('visibilitychange', () => {
  if(document.visibilityState === 'visible'){
    requestWakeLock();
    if(fallbackVideo && fallbackVideo.paused){ fallbackVideo.play().catch(() => {}); }
  }
});

/* ---------- init ---------- */
(async function init(){
  requestWakeLock();
  if(CLIENT_ID.includes('PASTE_YOUR')){
    renderLogin("Add your Spotify Client ID in the code before this will work.");
    return;
  }
  const params = new URLSearchParams(window.location.search);
  const code = params.get('code');
  if(code){
    exchangeCodeForToken(code);
    return;
  }
  const stored = localStorage.getItem(REFRESH_KEY);
  if(stored){
    const ok = await refreshAccessToken(stored);
    if(ok){ startPolling(); return; }
    localStorage.removeItem(REFRESH_KEY);
  }
  renderLogin();
})();
</script>
