<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Now Playing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --c1: #FF3D81;
    --c2: #7C3AED;
    --ink: #14101F;
    --paper: #FFF9F0;
    --lime: #C6FF3D;
  }
  *{ box-sizing: border-box; margin: 0; padding: 0; }
  html{ height: 100%; }
  body{
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    color: var(--paper);
    min-height: 100vh;
    display: flex;
    background: linear-gradient(135deg, var(--c1), var(--c2) 70%);
    background-attachment: fixed;
    transition: background 1s ease;
    overflow-x: hidden;
  }

  .stage{
    width: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 48px 40px 60px;
    max-width: 1080px;
    margin: 0 auto;
  }
  .layout{
    display: flex;
    align-items: flex-start;
    gap: 56px;
    width: 100%;
  }
  .main-col{
    flex: 1 1 420px;
    min-width: 0;
    max-width: 460px;
  }
  .side-col{
    width: 280px;
    flex-shrink: 0;
    position: sticky;
    top: 40px;
    max-height: calc(100vh - 80px);
    overflow-y: auto;
    padding-right: 4px;
  }
  .side-col::-webkit-scrollbar{ width: 6px; }
  .side-col::-webkit-scrollbar-thumb{ background: rgba(255,255,255,.25); border-radius: 6px; }
  @media (max-width: 860px){
    .layout{ flex-direction: column; }
    .main-col{ max-width: none; width: 100%; }
    .side-col{
      width: 100%;
      position: static;
      max-height: none;
      overflow-y: visible;
    }
  }

  /* ---------- login / idle ---------- */
  .kicker{
    font-size: 15px;
    font-weight: 500;
    color: var(--paper);
    opacity: .8;
    margin-bottom: 10px;
  }
  .big-headline{
    font-family: 'Bricolage Grotesque', sans-serif;
    font-weight: 800;
    font-size: clamp(40px, 9vw, 68px);
    line-height: 1.02;
    letter-spacing: -0.02em;
    margin-bottom: 22px;
  }
  .sub{
    font-size: 16px;
    line-height: 1.6;
    opacity: .85;
    max-width: 380px;
    margin-bottom: 32px;
  }
  button.cta{
    align-self: flex-start;
    background: var(--paper);
    color: var(--ink);
    border: none;
    padding: 16px 30px;
    border-radius: 999px;
    font-weight: 700;
    font-size: 15px;
    font-family: inherit;
    cursor: pointer;
    transition: transform .15s ease, background .15s ease;
  }
  button.cta:hover{ background: var(--lime); }
  button.cta:active{ transform: scale(.97); }
  button.cta:focus-visible{ outline: 2px solid var(--paper); outline-offset: 3px; }

  /* ---------- now playing ---------- */
  .art-card{
    width: 168px;
    height: 168px;
    border-radius: 26px;
    overflow: hidden;
    transform: rotate(-4deg);
    box-shadow: 0 24px 48px -18px rgba(0,0,0,.55);
    margin-bottom: 28px;
    background: rgba(255,255,255,.08);
    flex-shrink: 0;
  }
  .art-card img{ width: 100%; height: 100%; object-fit: cover; display: block; }

  .track-title{
    font-family: 'Bricolage Grotesque', sans-serif;
    font-weight: 800;
    font-size: clamp(32px, 7vw, 52px);
    line-height: 1.04;
    letter-spacing: -0.02em;
    margin-bottom: 10px;
    word-break: break-word;
  }
  .track-artist{
    font-size: 17px;
    font-weight: 500;
    opacity: .82;
    margin-bottom: 30px;
  }

  .progress{
    width: 100%;
    max-width: 420px;
    margin-bottom: 10px;
  }
  .progress-track{
    position: relative;
    height: 6px;
    background: rgba(255,255,255,.22);
    border-radius: 6px;
  }
  .progress-fill{
    position: absolute;
    top: 0; left: 0; height: 100%;
    background: var(--paper);
    border-radius: 6px;
    width: 0%;
    transition: width 1s linear;
  }
  .time-row{
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    opacity: .7;
    font-variant-numeric: tabular-nums;
    max-width: 420px;
    margin-bottom: 30px;
  }

  .controls{
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 18px;
  }
  .ctrl-btn{
    width: 56px;
    height: 56px;
    border-radius: 50%;
    border: none;
    background: rgba(255,255,255,.14);
    color: var(--paper);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: background .15s ease, transform .12s ease;
    flex-shrink: 0;
  }
  .ctrl-btn:hover{ background: rgba(255,255,255,.26); }
  .ctrl-btn:active{ transform: scale(.92); }
  .ctrl-btn:focus-visible{ outline: 2px solid var(--paper); outline-offset: 3px; }
  .ctrl-btn.main{
    width: 64px; height: 64px;
    background: var(--paper);
    color: var(--ink);
  }
  .ctrl-btn.main:hover{ background: var(--lime); }
  .ctrl-btn svg{ width: 22px; height: 22px; }
  .ctrl-btn.main svg{ width: 24px; height: 24px; }

  .state-label{
    font-size: 13px;
    font-weight: 500;
    opacity: .7;
    display: flex;
    align-items: center;
    gap: 7px;
  }
  .state-label .dot{
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--lime);
  }
  .state-label .dot.paused{ background: var(--paper); opacity: .5; }

  /* ---------- library / playlists ---------- */
  .section-label{
    font-size: 14px;
    font-weight: 600;
    opacity: .8;
    margin: 0 0 16px;
  }
  .playlist-list{
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .playlist-row{
    display: flex;
    align-items: center;
    gap: 12px;
    text-decoration: none;
    color: inherit;
    padding: 8px;
    border-radius: 14px;
    transition: background .15s ease;
  }
  .playlist-row:hover{ background: rgba(255,255,255,.1); }
  .playlist-row-cover{
    width: 52px;
    height: 52px;
    border-radius: 10px;
    overflow: hidden;
    background: rgba(255,255,255,.1);
    flex-shrink: 0;
    box-shadow: 0 8px 18px -10px rgba(0,0,0,.5);
  }
  .playlist-row-cover img{ width: 100%; height: 100%; object-fit: cover; display: block; }
  .playlist-row-info{ min-width: 0; }
  .playlist-row-name{
    font-size: 14px;
    font-weight: 600;
    line-height: 1.3;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .playlist-row-count{
    font-size: 12px;
    opacity: .6;
    margin-top: 2px;
  }

  .toast{
    position: fixed;
    bottom: 28px;
    left: 50%;
    transform: translateX(-50%) translateY(12px);
    background: var(--ink);
    color: var(--paper);
    padding: 12px 20px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 500;
    opacity: 0;
    pointer-events: none;
    transition: opacity .25s ease, transform .25s ease;
    max-width: 90vw;
    text-align: center;
    z-index: 10;
  }
  .toast.show{
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  @media (max-width: 420px){
    .stage{ padding: 36px 22px 50px; }
    .art-card{ width: 132px; height: 132px; }
    .playlist-scroll{ margin: 0 -22px; padding-left: 22px; padding-right: 22px; }
  }

  .logout-btn{
    position: fixed;
    top: 20px;
    right: 20px;
    background: rgba(255,255,255,.14);
    color: var(--paper);
    border: none;
    padding: 9px 16px;
    border-radius: 999px;
    font-family: inherit;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    z-index: 10;
    transition: background .15s ease;
  }
  .logout-btn:hover{ background: rgba(255,255,255,.26); }

  .lyrics-box{
    margin-top: 30px;
    max-width: 460px;
    max-height: 260px;
    overflow-y: auto;
    background: rgba(255,255,255,.08);
    border-radius: 20px;
    padding: 20px 22px;
  }
  .lyrics-box::-webkit-scrollbar{ width: 6px; }
  .lyrics-box::-webkit-scrollbar-thumb{ background: rgba(255,255,255,.25); border-radius: 6px; }
  .lyrics-text{
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    line-height: 1.75;
    white-space: pre-line;
    opacity: .92;
  }
  .lyrics-status{
    font-size: 14px;
    opacity: .6;
  }
</style>
</head>
<body>

<div class="stage" id="stage">
  <p class="kicker">Loading…</p>
</div>
<div class="toast" id="toast"></div>

<script>
/* ============ CONFIGURE THIS ============ */
const CLIENT_ID = "f8ae9b8233d44779be5fa82f8351bbf9";
/* ========================================= */

const REDIRECT_URI = window.location.origin + window.location.pathname;
const SCOPES = "user-read-currently-playing user-read-playback-state user-modify-playback-state playlist-read-private playlist-read-collaborative";
const stage = document.getElementById('stage');
const toastEl = document.getElementById('toast');

let accessToken = null;
let pollTimer = null;
let nowPlayingEl = null;
let libraryEl = null;
let currentTrackId = null;
let lyricsCache = {};

/* ---------- icons ---------- */
const ICON = {
  prev: `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h2v14H6zM19.5 5.5L9 12l10.5 6.5v-13z"/></svg>`,
  next: `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 5h2v14h-2zM4.5 5.5L15 12 4.5 18.5v-13z"/></svg>`,
  play: `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 4.5v15l13-7.5z"/></svg>`,
  pause:`<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>`
};

/* ---------- PKCE helpers ---------- */
function randomString(len){
  const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
  let out = '';
  for(let i=0;i<len;i++) out += chars.charAt(Math.floor(Math.random()*chars.length));
  return out;
}
async function sha256(plain){
  return crypto.subtle.digest('SHA-256', new TextEncoder().encode(plain));
}
function base64UrlEncode(buffer){
  return btoa(String.fromCharCode(...new Uint8Array(buffer)))
    .replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}

async function redirectToAuth(){
  const verifier = randomString(64);
  window.name = "sp_verifier:" + verifier;
  const challenge = base64UrlEncode(await sha256(verifier));
  const params = new URLSearchParams({
    client_id: CLIENT_ID,
    response_type: 'code',
    redirect_uri: REDIRECT_URI,
    scope: SCOPES,
    code_challenge_method: 'S256',
    code_challenge: challenge
  });
  window.location.href = `https://accounts.spotify.com/authorize?${params}`;
}


const REFRESH_KEY = 'sp_refresh_token';

async function refreshAccessToken(refreshToken){
  const body = new URLSearchParams({
    grant_type: 'refresh_token',
    refresh_token: refreshToken,
    client_id: CLIENT_ID
  });
  try{
    const res = await fetch('https://accounts.spotify.com/api/token', {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body
    });
    const data = await res.json();
    if(data.access_token){
      accessToken = data.access_token;
      if(data.refresh_token){ localStorage.setItem(REFRESH_KEY, data.refresh_token); }
      return true;
    }
  } catch(e){ /* fall through to false */ }
  return false;
}

function logout(){
  localStorage.removeItem(REFRESH_KEY);
  stopPolling();
  renderLogin();
}

async function exchangeCodeForToken(code){
  const verifier = window.name.startsWith('sp_verifier:') ? window.name.slice(12) : null;
  if(!verifier){ renderLogin("That link expired — log in again."); return; }
  const body = new URLSearchParams({
    client_id: CLIENT_ID,
    grant_type: 'authorization_code',
    code,
    redirect_uri: REDIRECT_URI,
    code_verifier: verifier
  });
  const res = await fetch('https://accounts.spotify.com/api/token', {
    method: 'POST',
    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
    body
  });
  const data = await res.json();
  window.history.replaceState({}, document.title, REDIRECT_URI);
  if(data.access_token){
    accessToken = data.access_token;
    if(data.refresh_token){ localStorage.setItem(REFRESH_KEY, data.refresh_token); }
    startPolling();
  } else {
    renderLogin("Couldn't log in — try again.");
  }
}

/* ---------- rendering: login / idle / track ---------- */
function renderLogin(message){
  stopPolling();
  stage.innerHTML = `
    <p class="kicker">Now playing</p>
    <h1 class="big-headline">See what's<br>spinning.</h1>
    <p class="sub">${message || "Connect Spotify to show your currently playing track, skip controls, and your playlists."}</p>
    <button class="cta" id="loginBtn">Log in with Spotify</button>
  `;
  document.getElementById('loginBtn').addEventListener('click', redirectToAuth);
}

function renderIdle(){
  if(!nowPlayingEl) return;
  nowPlayingEl.innerHTML = `
    <p class="kicker">Now playing</p>
    <h1 class="big-headline">Quiet for now.</h1>
    <p class="sub">Nothing's playing on Spotify right now. Start something and this page will catch up automatically.</p>
  `;
}

function msToClock(ms){
  const total = Math.floor(ms/1000);
  const m = Math.floor(total/60);
  const s = total % 60;
  return `${m}:${String(s).padStart(2,'0')}`;
}

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function renderTrack(data){
  if(!nowPlayingEl) return;
  const track = data.item;
  const artists = track.artists.map(a => a.name).join(', ');
  const art = track.album.images[0]?.url || '';
  const progress = data.progress_ms || 0;
  const duration = track.duration_ms || 1;
  const pct = Math.min(100, (progress/duration) * 100);
  const playing = !!data.is_playing;

  nowPlayingEl.innerHTML = `
    <div class="art-card"><img src="${art}" alt=""></div>
    <h1 class="track-title">${escapeHtml(track.name)}</h1>
    <p class="track-artist">${escapeHtml(artists)}</p>
    <div class="progress">
      <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
    </div>
    <div class="time-row"><span>${msToClock(progress)}</span><span>${msToClock(duration)}</span></div>
    <div class="controls">
      <button class="ctrl-btn" id="prevBtn" aria-label="Previous track">${ICON.prev}</button>
      <button class="ctrl-btn main" id="playBtn" aria-label="${playing ? 'Pause' : 'Play'}">${playing ? ICON.pause : ICON.play}</button>
      <button class="ctrl-btn" id="nextBtn" aria-label="Next track">${ICON.next}</button>
    </div>
    <div class="state-label"><span class="dot ${playing ? '' : 'paused'}"></span>${playing ? 'Playing' : 'Paused'}</div>
    <p class="section-label" style="margin-top:30px;">Lyrics</p>
    <div class="lyrics-box" id="lyricsBox"><p class="lyrics-status">Loading lyrics…</p></div>
  `;

  document.getElementById('prevBtn').addEventListener('click', () => playerAction('POST', '/previous', 'Skipped back'));
  document.getElementById('nextBtn').addEventListener('click', () => playerAction('POST', '/next', 'Skipped ahead'));
  document.getElementById('playBtn').addEventListener('click', () => {
    playerAction('PUT', playing ? '/pause' : '/play', playing ? 'Paused' : 'Playing');
  });

  extractGradient(art);

  if(track.id !== currentTrackId){
    currentTrackId = track.id;
    loadLyricsFor(track, duration);
  } else if(lyricsCache[track.id] !== undefined){
    renderLyricsBox(lyricsCache[track.id]);
  }
}

/* ---------- lyrics (via lrclib.net - free, open, no key required) ---------- */
async function fetchLyricsText(title, artist, album, durationSec){
  try{
    const exact = new URLSearchParams({ track_name: title, artist_name: artist, album_name: album, duration: durationSec });
    let res = await fetch(`https://lrclib.net/api/get?${exact}`);
    if(res.ok){
      const data = await res.json();
      if(data.plainLyrics) return data.plainLyrics;
    }
    const loose = new URLSearchParams({ track_name: title, artist_name: artist });
    res = await fetch(`https://lrclib.net/api/search?${loose}`);
    if(res.ok){
      const results = await res.json();
      if(Array.isArray(results)){
        const hit = results.find(r => r.plainLyrics);
        if(hit) return hit.plainLyrics;
      }
    }
  } catch(e){ /* treat as not found */ }
  return null;
}

function renderLyricsBox(text){
  const box = document.getElementById('lyricsBox');
  if(!box) return;
  if(!text){
    box.innerHTML = '<p class="lyrics-status">Lyrics not found for this track.</p>';
    return;
  }
  box.innerHTML = `<pre class="lyrics-text">${escapeHtml(text)}</pre>`;
}

async function loadLyricsFor(track, durationMs){
  const id = track.id;
  if(lyricsCache[id] !== undefined){ renderLyricsBox(lyricsCache[id]); return; }
  const artist = track.artists[0]?.name || '';
  const text = await fetchLyricsText(track.name, artist, track.album.name, Math.round(durationMs / 1000));
  lyricsCache[id] = text;
  if(currentTrackId === id){ renderLyricsBox(text); }
}

/* ---------- library: playlists ---------- */
async function fetchLibrary(){
  try{
    const res = await fetch('https://api.spotify.com/v1/me/playlists?limit=50', {
      headers: { Authorization: `Bearer ${accessToken}` }
    });
    if(!res.ok) return;
    const data = await res.json();
    renderPlaylists(data.items || []);
  } catch(e){ /* leave library section empty on failure */ }
}

function renderPlaylists(playlists){
  if(!libraryEl) return;
  const usable = playlists.filter(p => p);
  if(usable.length === 0){ libraryEl.innerHTML = ''; return; }
  const rows = usable.map(p => {
    const cover = p.images?.[0]?.url || '';
    const url = p.external_urls?.spotify || '#';
    const count = p.tracks?.total;
    return `
      <a class="playlist-row" href="${url}" target="_blank" rel="noopener">
        <div class="playlist-row-cover">${cover ? `<img src="${cover}" alt="">` : ''}</div>
        <div class="playlist-row-info">
          <p class="playlist-row-name">${escapeHtml(p.name)}</p>
          ${typeof count === 'number' ? `<p class="playlist-row-count">${count} tracks</p>` : ''}
        </div>
      </a>
    `;
  }).join('');
  libraryEl.innerHTML = `
    <p class="section-label">Your playlists</p>
    <div class="playlist-list">${rows}</div>
  `;
}

/* ---------- playback controls ---------- */
async function playerAction(method, path, okMessage){
  try{
    const res = await fetch(`https://api.spotify.com/v1/me/player${path}`, {
      method,
      headers: { Authorization: `Bearer ${accessToken}` }
    });
    if(res.status === 403){ showToast("That needs Spotify Premium."); return; }
    if(res.status === 401){
      const stored = localStorage.getItem(REFRESH_KEY);
      if(stored && await refreshAccessToken(stored)){ setTimeout(tick, 300); return; }
      renderLogin("Session expired — log in again.");
      return;
    }
    if(res.status === 404){ showToast("Open Spotify on a device first."); return; }
    showToast(okMessage);
    setTimeout(tick, 450);
  } catch(e){
    showToast("Couldn't reach Spotify.");
  }
}

let toastTimer = null;
function showToast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('show'), 1800);
}

/* ---------- gradient from album art (two-tone, no storage used) ---------- */
function pickVibrant(pixelData){
  let best = null, bestScore = -1, fallbackR=0, fallbackG=0, fallbackB=0, n=0;
  for(let i=0;i<pixelData.length;i+=4){
    const r=pixelData[i], g=pixelData[i+1], b=pixelData[i+2], a=pixelData[i+3];
    if(a < 100) continue;
    fallbackR+=r; fallbackG+=g; fallbackB+=b; n++;
    const max=Math.max(r,g,b), min=Math.min(r,g,b);
    const lum=(max+min)/2;
    if(lum < 30 || lum > 225) continue; // skip near-black/near-white pixels
    const sat = max===0 ? 0 : (max-min)/max;
    if(sat > bestScore){ bestScore = sat; best = [r,g,b]; }
  }
  if(best) return best;
  if(n===0) return [124,58,237]; // ultimate fallback: violet
  return [Math.round(fallbackR/n), Math.round(fallbackG/n), Math.round(fallbackB/n)];
}

function extractGradient(imgUrl){
  if(!imgUrl) return;
  const img = new Image();
  img.crossOrigin = 'Anonymous';
  img.onload = () => {
    try{
      const canvas = document.createElement('canvas');
      canvas.width = 24; canvas.height = 24;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, 24, 24);
      const left = ctx.getImageData(0, 0, 10, 24).data;
      const right = ctx.getImageData(14, 0, 10, 24).data;
      const [r1,g1,b1] = pickVibrant(left);
      const [r2,g2,b2] = pickVibrant(right);
      document.body.style.background =
        `linear-gradient(135deg, rgb(${r1},${g1},${b1}), rgb(${r2},${g2},${b2}) 75%)`;
    } catch(e){ /* CORS-tainted canvas - keep the current gradient */ }
  };
  img.src = imgUrl;
}

/* ---------- polling ---------- */
async function tick(){
  try{
    const res = await fetch('https://api.spotify.com/v1/me/player/currently-playing', {
      headers: { Authorization: `Bearer ${accessToken}` }
    });
    if(res.status === 204){ renderIdle(); return; }
    if(res.status === 401){
      const stored = localStorage.getItem(REFRESH_KEY);
      if(stored && await refreshAccessToken(stored)){ tick(); return; }
      renderLogin("Session expired — log in again.");
      return;
    }
    const data = await res.json();
    if(!data || !data.item){ renderIdle(); return; }
    renderTrack(data);
  } catch(e){ /* transient network hiccup - keep current view, retry next tick */ }
}

function startPolling(){
  stopPolling();
  stage.innerHTML = `
    <button class="logout-btn" id="logoutBtn">Log out</button>
    <div class="layout">
      <div class="main-col" id="nowPlaying"></div>
      <aside class="side-col" id="library"></aside>
    </div>
  `;
  document.getElementById('logoutBtn').addEventListener('click', logout);
  nowPlayingEl = document.getElementById('nowPlaying');
  libraryEl = document.getElementById('library');
  tick();
  fetchLibrary();
  pollTimer = setInterval(tick, 5000);
}
function stopPolling(){
  if(pollTimer){ clearInterval(pollTimer); pollTimer = null; }
}

/* ---------- init ---------- */
(async function init(){
  if(CLIENT_ID.includes('PASTE_YOUR')){
    renderLogin("Add your Spotify Client ID in the code before this will work.");
    return;
  }
  const params = new URLSearchParams(window.location.search);
  const code = params.get('code');
  if(code){
    exchangeCodeForToken(code);
    return;
  }
  const stored = localStorage.getItem(REFRESH_KEY);
  if(stored){
    const ok = await refreshAccessToken(stored);
    if(ok){ startPolling(); return; }
    localStorage.removeItem(REFRESH_KEY);
  }
  renderLogin();
})();
</script>
